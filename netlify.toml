[build]
  # Static frontend source of truth.
  publish = "public"
  # Assets are committed; no build step required.
  command = "echo Deployment started"

[[headers]]
  for = "/*"
  [headers.values]
    cache-control = "max-age=0, no-cache, no-store, must-revalidate"
    pragma = "no-cache"
    expires = "0"
