<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKMS Workshop Sample</title>
  <style>
    body { margin: 0; font-family: "Pretendard", sans-serif; background: #fcfcf9; color: #20253c; }
    main { max-width: 920px; margin: 0 auto; padding: 32px 20px 56px; }
    h1 { font-size: clamp(34px, 6vw, 56px); letter-spacing: -0.06em; margin: 0 0 12px; }
    .slot { background: white; border: 1px solid rgba(32,37,60,.08); border-radius: 18px; padding: 18px 20px; margin-top: 14px; }
    .time { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #0052A2; }
    h2 { margin: 8px 0 8px; font-size: 22px; }
    p { margin: 0; line-height: 1.7; color: rgba(32,37,60,.76); }
  </style>
</head>
<body>
  <main>
    <h1>VWBE 워크숍 샘플 가이드</h1>
    <div class="slot"><div class="time">00-10 min</div><h2>오프닝 질문</h2><p>우리 팀이 스스로 몰입해서 움직였던 순간은 언제였는가?</p></div>
    <div class="slot"><div class="time">10-25 min</div><h2>핵심 개념 브리핑</h2><p>VWBE와 SUPEX 추구의 연결을 실제 조직 행동 관점에서 설명합니다.</p></div>
    <div class="slot"><div class="time">25-45 min</div><h2>팀 토론</h2><p>자율과 책임을 동시에 높이기 위해 제거해야 할 장애물을 식별합니다.</p></div>
  </main>
</body>
</html>
