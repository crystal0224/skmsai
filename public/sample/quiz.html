<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKMS Quiz Sample</title>
  <style>
    body { margin: 0; font-family: "Pretendard", sans-serif; background: #f6f8ff; color: #17204c; }
    main { max-width: 760px; margin: 0 auto; padding: 32px 20px 56px; }
    .card { background: white; border-radius: 22px; padding: 28px; box-shadow: 0 20px 50px rgba(23,32,76,.08); }
    h1 { margin: 0 0 18px; font-size: 40px; letter-spacing: -0.05em; }
    .opt { display: block; margin-top: 10px; padding: 14px 16px; border-radius: 14px; background: #f7f9ff; border: 1px solid rgba(23,32,76,.08); }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>SKMS 퀴즈 샘플</h1>
      <p>다음 중 VWBE 설명으로 가장 적절한 것은?</p>
      <label class="opt"><input type="radio" name="q1"> 외부 통제를 강화해 실행을 표준화하는 방식</label>
      <label class="opt"><input type="radio" name="q1" checked> 자발적 의욕을 바탕으로 구성원이 스스로 몰입하게 만드는 상태</label>
      <label class="opt"><input type="radio" name="q1"> 단기 성과만을 최대화하는 인사 제도</label>
      <label class="opt"><input type="radio" name="q1"> 의사결정을 본사에만 집중시키는 운영 원칙</label>
    </div>
  </main>
</body>
</html>
