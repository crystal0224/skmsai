<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKMS Company Builder</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --hud-bg:rgba(18,18,30,0.88);
  --hud-border:rgba(255,255,255,0.08);
  --accent:#FFB830;
  --green:#4ADE80;
  --red:#F87171;
  --blue:#60A5FA;
  --cust:#42A5F5;
  --emp:#66BB6A;
  --soc:#26A69A;
}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#e8e8f0}
canvas{display:block;cursor:default}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
#ui>*{pointer-events:auto}

/* Top bar */
.topbar{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--hud-bg);backdrop-filter:blur(12px);border-bottom:1px solid var(--hud-border);flex-wrap:wrap}
.topbar .logo{font-weight:800;font-size:16px;color:var(--accent);letter-spacing:-0.5px;white-space:nowrap}
.topbar .logo small{font-size:10px;color:rgba(255,255,255,0.4);font-weight:500;margin-left:4px}
.topbar .stat{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:8px;background:rgba(255,255,255,0.06)}
.topbar .stat .val{font-variant-numeric:tabular-nums}
.topbar .stat.money .val{color:var(--green)}
.topbar .stat.rating .val{color:#FBBF24}
.topbar .stat .val.cust{color:var(--cust)}
.topbar .stat .val.emp{color:var(--emp)}
.topbar .stat .val.soc{color:var(--soc)}
.topbar .time-display{margin-left:auto;display:flex;align-items:center;gap:8px}
.topbar .day{font-size:11px;color:rgba(255,255,255,0.5)}
.topbar .clock{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.speed-btn{background:rgba(255,255,255,0.08);border:1px solid var(--hud-border);color:#fff;border-radius:6px;padding:3px 10px;font-size:12px;cursor:pointer;font-weight:600;transition:all .15s}
.speed-btn:hover,.speed-btn.active{background:var(--accent);color:#1a1a2e;border-color:var(--accent)}

.back-btn{background:none;border:1px solid var(--hud-border);color:rgba(255,255,255,0.5);border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer;text-decoration:none;font-weight:500;transition:all .15s}
.back-btn:hover{color:#fff;border-color:rgba(255,255,255,0.3)}

/* Build panel */
.build-panel{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:8px 12px;background:var(--hud-bg);backdrop-filter:blur(12px);border:1px solid var(--hud-border);border-radius:16px;z-index:20;overflow-x:auto;max-width:96vw}
.build-btn{width:60px;height:62px;border:2px solid transparent;border-radius:10px;background:rgba(255,255,255,0.05);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:all 0.15s ease-out;position:relative;color:#e8e8f0;font-family:inherit}
.build-btn:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.15);transform:translateY(-2px)}
.build-btn.active{border-color:var(--accent);background:rgba(255,184,48,0.15)}
.build-btn .icon{font-size:22px}
.build-btn .label{font-size:8px;font-weight:600;letter-spacing:0.3px;text-transform:uppercase;color:rgba(255,255,255,0.5)}
.build-btn .cost{position:absolute;top:-7px;right:-3px;font-size:9px;font-weight:700;background:var(--green);color:#111;padding:1px 5px;border-radius:5px}

/* Minimap */
.minimap{position:fixed;bottom:20px;right:16px;width:140px;height:105px;background:rgba(18,18,30,0.9);border:1px solid var(--hud-border);border-radius:8px;overflow:hidden}
.minimap canvas{width:100%;height:100%}

/* Toast */
.toast{position:fixed;top:55px;left:50%;transform:translateX(-50%) translateY(-20px);padding:8px 20px;border-radius:8px;font-size:12px;font-weight:600;opacity:0;transition:all 0.3s ease-out;z-index:100;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.warn{background:#F59E0B;color:#1a1a2e}
.toast.info{background:var(--blue);color:#fff}
.toast.success{background:var(--green);color:#1a1a2e}

/* Tutorial */
.tutorial{position:fixed;bottom:105px;left:50%;transform:translateX(-50%);background:rgba(18,18,30,0.95);border:1px solid var(--accent);border-radius:10px;padding:12px 20px;font-size:12px;max-width:400px;text-align:center;line-height:1.5;z-index:50;display:none}
.tutorial.show{display:block}
.tutorial .step{color:var(--accent);font-weight:700;font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
.tutorial .dismiss{margin-top:6px;font-size:10px;color:rgba(255,255,255,0.4);cursor:pointer;transition:color .15s}
.tutorial .dismiss:hover{color:#fff}

/* Policy panel */
.policy-toggle{position:fixed;right:16px;top:65px;background:var(--hud-bg);backdrop-filter:blur(12px);border:1px solid var(--hud-border);border-radius:8px;padding:6px 12px;font-size:11px;color:var(--accent);cursor:pointer;font-weight:700;z-index:25;transition:all .15s}
.policy-toggle:hover{background:rgba(255,184,48,0.15)}
.policy-panel{position:fixed;right:16px;top:100px;width:260px;max-height:calc(100vh - 230px);overflow-y:auto;background:var(--hud-bg);backdrop-filter:blur(12px);border:1px solid var(--hud-border);border-radius:12px;padding:14px;z-index:24;transform:translateX(300px);transition:transform .3s ease;font-size:11px}
.policy-panel.open{transform:translateX(0)}
.policy-panel h3{font-size:13px;font-weight:700;margin-bottom:10px;color:var(--accent)}
.pol-item{padding:8px;margin-bottom:6px;border-radius:8px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);transition:all .2s;cursor:pointer}
.pol-item:hover{background:rgba(255,255,255,0.08)}
.pol-item.active{border-color:var(--accent);background:rgba(255,184,48,0.1);box-shadow:0 0 10px rgba(255,184,48,0.15)}
.pol-item.locked{opacity:0.5;cursor:not-allowed}
.pol-item.activating{border-color:#60A5FA;background:rgba(96,165,250,0.1)}
.pol-name{font-weight:700;font-size:12px;margin-bottom:2px}
.pol-cost{font-size:10px;color:rgba(255,255,255,0.4)}
.pol-req{font-size:9px;color:#F87171;margin-top:2px}
.pol-desc{font-size:9px;color:rgba(255,255,255,0.5);margin-top:2px}
.pol-progress{height:3px;background:rgba(255,255,255,0.1);border-radius:2px;margin-top:4px;overflow:hidden}
.pol-progress-bar{height:100%;background:var(--blue);border-radius:2px;transition:width .3s}

/* Meeting panel */
.meeting-panel{position:fixed;right:0;top:0;width:320px;height:100%;background:var(--hud-bg);backdrop-filter:blur(16px);border-left:1px solid var(--hud-border);z-index:30;transform:translateX(340px);transition:transform .3s ease;padding:24px 20px;overflow-y:auto}
.meeting-panel.open{transform:translateX(0)}
.meeting-close{position:absolute;top:12px;right:12px;background:rgba(255,255,255,0.08);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.meeting-close:hover{background:rgba(255,255,255,0.2)}
.meeting-portrait{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:20px auto 10px;font-size:28px;border:3px solid var(--accent)}
.meeting-name{text-align:center;font-weight:700;font-size:15px;margin-bottom:2px}
.meeting-type{text-align:center;font-size:11px;color:rgba(255,255,255,0.5);margin-bottom:16px;text-transform:capitalize}
.meeting-stats{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.meeting-stat{text-align:center;padding:4px 8px;border-radius:6px;background:rgba(255,255,255,0.05);font-size:10px}
.meeting-stat .v{font-weight:700;font-size:13px;display:block}
.meeting-choice{width:100%;padding:10px 14px;margin-bottom:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:#e8e8f0;cursor:pointer;text-align:left;font-size:11px;line-height:1.4;transition:all .15s;font-family:inherit}
.meeting-choice:hover{background:rgba(255,184,48,0.12);border-color:var(--accent)}
.meeting-choice .effect{display:block;font-size:9px;color:rgba(255,255,255,0.4);margin-top:2px}

/* Event modal */
.event-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:40;display:none;align-items:center;justify-content:center}
.event-overlay.show{display:flex}
.event-card{background:#FFFEF5;color:#1a1a2e;border-radius:12px;width:420px;max-width:90vw;padding:28px 24px;box-shadow:0 20px 60px rgba(0,0,0,0.5);border:2px solid #E8E0D0;position:relative}
.event-headline{font-size:18px;font-weight:800;margin-bottom:8px;line-height:1.3;color:#2C1810}
.event-desc{font-size:13px;color:#5C4A3A;margin-bottom:16px;line-height:1.5}
.event-timer{position:absolute;top:12px;right:16px;font-size:12px;font-weight:700;color:#D32F2F}
.event-choice{width:100%;padding:10px 14px;margin-bottom:6px;border-radius:8px;border:1px solid #D7CCC8;background:#FFF;color:#2C1810;cursor:pointer;text-align:left;font-size:12px;line-height:1.4;transition:all .15s;font-family:inherit}
.event-choice:hover{background:#FFF3E0;border-color:#FFB830}
.event-choice:disabled{opacity:0.4;cursor:not-allowed}
.event-choice .preview{display:block;font-size:10px;color:#8D6E63;margin-top:2px}
.event-choice .req{color:#D32F2F;font-weight:600}
.event-tag{display:inline-block;font-size:9px;font-weight:700;background:#EFEBE9;color:#5D4037;padding:2px 8px;border-radius:4px;margin-bottom:10px;letter-spacing:0.5px}

/* Report card */
.report-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:50;display:none;align-items:center;justify-content:center;overflow-y:auto;padding:20px}
.report-overlay.show{display:flex}
.report-card{background:var(--hud-bg);backdrop-filter:blur(16px);border:1px solid var(--hud-border);border-radius:16px;width:480px;max-width:95vw;padding:32px 28px;color:#e8e8f0}
.report-title{font-size:22px;font-weight:800;color:var(--accent);text-align:center;margin-bottom:6px}
.report-subtitle{font-size:12px;text-align:center;color:rgba(255,255,255,0.5);margin-bottom:20px}
.report-section{margin-bottom:16px}
.report-section h4{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,0.08)}
.report-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:12px}
.report-bar{height:8px;border-radius:4px;background:rgba(255,255,255,0.08);flex:1;margin:0 10px;overflow:hidden}
.report-bar-fill{height:100%;border-radius:4px;transition:width .5s}
.report-check{font-size:12px;padding:3px 0}
.report-quote{font-style:italic;text-align:center;padding:16px;color:rgba(255,255,255,0.6);font-size:12px;line-height:1.6;border:1px solid rgba(255,255,255,0.06);border-radius:8px;margin-bottom:16px}
.report-btn{width:100%;padding:12px;border:none;border-radius:10px;background:var(--accent);color:#1a1a2e;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s;font-family:inherit}
.report-btn:hover{opacity:0.85}

/* Scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div class="topbar" id="topbar"></div>
  <div class="build-panel" id="build-panel"></div>
  <div class="minimap"><canvas id="minimap" width="140" height="105"></canvas></div>
  <div class="toast" id="toast"></div>
  <div class="tutorial" id="tutorial"></div>
  <div class="policy-toggle" id="policy-toggle"></div>
  <div class="policy-panel" id="policy-panel"></div>
  <div class="meeting-panel" id="meeting-panel"></div>
  <div class="event-overlay" id="event-overlay"></div>
  <div class="report-overlay" id="report-overlay"></div>
</div>

// EMPLOYEE TYPE CONFIG
// ============================================================

// POLICY DEFINITIONS
// ============================================================

// ============================================================
// SPEECH BUBBLE LINES
// ============================================================

  quitting:                 ["\uC5EC\uAE30\uAE4C\uC9C0\uC778 \uAC83 \uAC19\uC2B5\uB2C8\uB2E4. \uC548\uB155\uD788 \uACC4\uC138\uC694."]
};

// ============================================================
// EVENT DEFINITIONS
// ============================================================
const EVENTS = [

    mouseGX: -1, mouseGY: -1, mouseX: 0, mouseY: 0,

    activePolicies: {},

    eventTimer: 0, eventActive: false, eventCountdown: 0, currentEvent: null, usedEvents: [],

    }

// ============================================================
// SCENARIO: CRISIS COMPANY SETUP
// ============================================================
function setupCrisisScenario() {
  var cx = Math.floor(GRID / 2), cy = Math.floor(GRID / 2);
  // HQ at center
  G.grid[cy][cx] = {type:'hq'};
  // Corridors: a cross pattern
  for (var i = 1; i <= 5; i++) {
    placeCell(cx + i, cy, 'corridor');
    placeCell(cx - i, cy, 'corridor');
    placeCell(cx, cy + i, 'corridor');
    placeCell(cx, cy - i, 'corridor');
  }
  // Production at right
  placeCell(cx + 6, cy, 'production');
  // Marketing at left
  placeCell(cx - 6, cy, 'marketing');
  // Employees: 6 disengaged, 4 cynic, 2 rookie
  var types = [];
  for (var i = 0; i < 6; i++) types.push('disengaged');
  for (var i = 0; i < 4; i++) types.push('cynic');
  for (var i = 0; i < 2; i++) types.push('rookie');
  for (var i = 0; i < types.length; i++) {
    spawnWorker(types[i], cx, cy);
  }
}

function placeCell(x, y, type) {
  if (x < 0 || y < 0 || x >= GRID || y >= GRID) return;
  G.grid[y][x] = {type: type};
  G.bldgs.push({type: type, gx: x, gy: y});
}

function spawnWorker(type, nearX, nearY) {
  G.workerID++;
  var w = {
    id: G.workerID,
    type: type,
    x: nearX + (Math.random() - 0.5) * 2,
    y: nearY + (Math.random() - 0.5) * 2,
    targetX: nearX, targetY: nearY,
    will: 30 + Math.random() * 30,
    capability: 20 + Math.random() * 40,
    happiness: 20 + Math.random() * 30,
    path: [],
    pathIdx: 0,
    state: 'idle',
    stateTimer: 0,
    bubble: null,
    bubbleTimer: 0,
    speechCooldown: Math.random() * 200,
    quitTimer: 0,
    quitting: false,
    fadeOut: 1,
    preventQuitDays: 0,
    transitionCooldown: 0
  };
  if (type === 'ace') { w.will = 70; w.capability = 75; w.happiness = 60; }
  if (type === 'leader') { w.will = 80; w.capability = 80; w.happiness = 65; }
  G.workers.push(w);
  return w;
}

// ============================================================
// HELPERS
// ============================================================
function toScr(gx, gy) {
  return {x: (gx - gy) * TW / 2, y: (gx + gy) * TH / 2};
}
function toGrd(sx, sy) {
  var wx = (sx - G.camX) / G.zm, wy = (sy - G.camY) / G.zm;
  return {x: Math.floor(wx / TW + wy / TH), y: Math.floor(wy / TH - wx / TW)};
}
function inBounds(x, y) { return x >= 0 && y >= 0 && x < GRID && y < GRID; }
function hasBuilding(type) {
  return G.bldgs.some(function(b) { return b.type === type; });
}
function countBuilding(type) {
  return G.bldgs.filter(function(b) { return b.type === type; }).length;
}
function policyActive(id) { return !!G.activePolicies[id]; }

function removeOneByType(state, type) {
  for (var i = state.workers.length - 1; i >= 0; i--) {
    if (state.workers[i].type === type && !state.workers[i].quitting) {
      state.workers[i].quitting = true;
      state.workers[i].bubble = SPEECH.quitting[0];
      state.workers[i].bubbleTimer = 120;
      state.totalQuits++;
      return;
    }
  }
}

function quitRandom(state, count) {
  var alive = state.workers.filter(function(w) { return !w.quitting; });
  for (var i = 0; i < count && i < alive.length; i++) {
    var idx = Math.floor(Math.random() * alive.length);
    alive[idx].quitting = true;
    alive[idx].bubble = SPEECH.quitting[0];
    alive[idx].bubbleTimer = 120;
    state.totalQuits++;
    alive.splice(idx, 1);
  }
}

function convertRandom(state, fromType, toType, count) {
  var matching = state.workers.filter(function(w) { return w.type === fromType && !w.quitting; });
  for (var i = 0; i < count && i < matching.length; i++) {
    matching[i].type = toType;
    if (toType === 'cynic') {
      matching[i].will = Math.max(20, matching[i].will - 20);
      matching[i].happiness = Math.max(10, matching[i].happiness - 15);
    }
  }
}

function clamp(lo, hi, v) { return Math.max(lo, Math.min(hi, v)); }

function showToast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (type || 'info');
  clearTimeout(el._tid);
  el._tid = setTimeout(function() { el.className = 'toast'; }, 2500);
}

// AUDIO
// ============================================================
function initAudio() {
  if (!G.audioCtx) {
    G.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}
function tone(f, d, t, v) {
  if (!G.audioCtx) return;
  var o = G.audioCtx.createOscillator(), g = G.audioCtx.createGain();
  o.type = t || 'square'; o.frequency.value = f;
  g.gain.setValueAtTime(v || 0.06, G.audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, G.audioCtx.currentTime + d);
  o.connect(g); g.connect(G.audioCtx.destination);
  o.start(); o.stop(G.audioCtx.currentTime + d);
}
function sfxPlace() { tone(523, 0.1, 'sine', 0.1); tone(659, 0.1, 'sine', 0.07); }
function sfxErr() { tone(200, 0.2, 'sawtooth', 0.05); }
function sfxDel() { tone(330, 0.15, 'triangle', 0.06); }

// Center camera on HQ
function centerCamera() {

  G.camX = canvas.width / 2 - s.x * G.zm;
  G.camY = canvas.height / 2 - s.y * G.zm;
}

// ============================================================
// BFS PATHFINDING
// ============================================================
function bfsPath(sx, sy, tx, ty) {
  var s_gx = Math.round(sx), s_gy = Math.round(sy);
  var t_gx = Math.round(tx), t_gy = Math.round(ty);
  if (s_gx === t_gx && s_gy === t_gy) return [];
  if (!inBounds(t_gx, t_gy)) return [];

  var visited = {};
  var queue = [{x: s_gx, y: s_gy, path: []}];
  visited[s_gx + ',' + s_gy] = true;
  var dirs = [[1,0],[-1,0],[0,1],[0,-1]];

  while (queue.length > 0) {
    var cur = queue.shift();
    for (var d = 0; d < 4; d++) {
      var nx = cur.x + dirs[d][0], ny = cur.y + dirs[d][1];
      if (!inBounds(nx, ny)) continue;
      var key = nx + ',' + ny;
      if (visited[key]) continue;
      var cell = G.grid[ny][nx];
      if (!cell) continue; // can only walk on placed tiles
      visited[key] = true;
      var newPath = cur.path.concat([{x: nx, y: ny}]);
      if (nx === t_gx && ny === t_gy) return newPath;
      queue.push({x: nx, y: ny, path: newPath});
    }
  }
  return []; // no path
}

// ============================================================
// RENDERING
// ============================================================
function dayLight() {
  var h = G.gTime / 60;
  if (h < 6) return 0.2;
  if (h < 8) return 0.2 + (h - 6) / 2 * 0.5;
  if (h < 17) return 0.7 + Math.sin((h - 8) / 9 * Math.PI) * 0.3;
  if (h < 20) return 0.7 - (h - 17) / 3 * 0.5;
  return 0.2;
}

function drawTile(gx, gy) {
  var s = toScr(gx, gy);
  var sx = s.x * G.zm + G.camX, sy = s.y * G.zm + G.camY;
  var tw = TW * G.zm, th = TH * G.zm;
  // Check if on screen
  if (sx + tw < 0 || sx - tw > canvas.width || sy + th < -50 || sy - 50 > canvas.height) return;
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.lineTo(sx + tw / 2, sy + th / 2);
  ctx.lineTo(sx, sy + th);
  ctx.lineTo(sx - tw / 2, sy + th / 2);
  ctx.closePath();
  var d = dayLight();
  var gr = 120 * d + 50 | 0, gg = 190 * d + 40 | 0, gb = 90 * d + 30 | 0;
  ctx.fillStyle = 'rgb(' + gr + ',' + gg + ',' + gb + ')';
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,' + (0.03 + (1 - d) * 0.06) + ')';
  ctx.lineWidth = 0.5;
  ctx.stroke();
}

function drawBuilding(gx, gy, cell) {
  var s = toScr(gx, gy);
  var sx = s.x * G.zm + G.camX, sy = s.y * G.zm + G.camY;
  var tw = TW * G.zm, th = TH * G.zm;
  var d = dayLight();

  if (cell.type === 'hq') {
    var bh = 42 * G.zm;
    // Top face
    ctx.beginPath();
    ctx.moveTo(sx, sy - bh); ctx.lineTo(sx + tw / 2, sy + th / 2 - bh);
    ctx.lineTo(sx, sy + th - bh); ctx.lineTo(sx - tw / 2, sy + th / 2 - bh);
    ctx.closePath();
    ctx.fillStyle = 'rgb(' + (255 * d | 0) + ',' + (200 * d | 0) + ',' + (100 * d | 0) + ')';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 2 * G.zm; ctx.stroke();
    // Right face
    ctx.beginPath();
    ctx.moveTo(sx, sy + th - bh); ctx.lineTo(sx + tw / 2, sy + th / 2 - bh);
    ctx.lineTo(sx + tw / 2, sy + th / 2); ctx.lineTo(sx, sy + th);
    ctx.closePath();
    ctx.fillStyle = 'rgb(' + (160 * d | 0) + ',' + (120 * d | 0) + ',' + (50 * d | 0) + ')';
    ctx.fill(); ctx.stroke();
    // Left face
    ctx.beginPath();
    ctx.moveTo(sx, sy + th - bh); ctx.lineTo(sx - tw / 2, sy + th / 2 - bh);
    ctx.lineTo(sx - tw / 2, sy + th / 2); ctx.lineTo(sx, sy + th);
    ctx.closePath();
    ctx.fillStyle = 'rgb(' + (200 * d | 0) + ',' + (155 * d | 0) + ',' + (65 * d | 0) + ')';
    ctx.fill(); ctx.stroke();
    // Label
    ctx.font = 'bold ' + Math.max(9, 10 * G.zm) + 'px system-ui';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,' + d + ')';
    ctx.fillText('COMPANY HQ', sx, sy - bh + 10 * G.zm);
    ctx.font = Math.max(16, 22 * G.zm) + 'px serif';
    ctx.fillText('\u{1F3E2}', sx, sy - bh - 2 * G.zm);
    return;
  }

  if (cell.type === 'corridor') {
    var ch = 4 * G.zm;
    // Flat raised tile
    ctx.beginPath();
    ctx.moveTo(sx, sy - ch); ctx.lineTo(sx + tw / 2 - 4 * G.zm, sy + th / 2 - ch);
    ctx.lineTo(sx, sy + th - ch - 2 * G.zm); ctx.lineTo(sx - tw / 2 + 4 * G.zm, sy + th / 2 - ch);
    ctx.closePath();
    var pc = 200 * d + 50 | 0;
    ctx.fillStyle = 'rgb(' + pc + ',' + (pc - 8) + ',' + (pc - 16) + ')';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.1)'; ctx.lineWidth = 1; ctx.stroke();
    return;
  }

  if (cell.type === 'tree') {
    // Trunk
    ctx.fillStyle = 'rgb(' + (100 * d + 30 | 0) + ',' + (70 * d + 20 | 0) + ',' + (40 * d + 10 | 0) + ')';
    ctx.fillRect(sx - 3 * G.zm, sy - 10 * G.zm, 6 * G.zm, 14 * G.zm);
    // Canopy
    ctx.beginPath();
    ctx.arc(sx, sy - 18 * G.zm, 12 * G.zm, 0, Math.PI * 2);
    ctx.fillStyle = 'rgb(' + (60 * d + 30 | 0) + ',' + (190 * d + 30 | 0) + ',' + (70 * d + 20 | 0) + ')';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 1.5 * G.zm; ctx.stroke();
    return;
  }

  var def = DEFS[cell.type];
  if (!def) return;
  var bh = def.height * G.zm;
  var r = parseInt(def.col.slice(1, 3), 16);
  var g = parseInt(def.col.slice(3, 5), 16);
  var b = parseInt(def.col.slice(5, 7), 16);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,' + (0.08 + (1 - d) * 0.08) + ')';
  ctx.beginPath();
  ctx.moveTo(sx, sy + th); ctx.lineTo(sx + tw / 2, sy + th / 2);
  ctx.lineTo(sx + tw / 2 + 6 * G.zm, sy + th / 2 + 4 * G.zm);
  ctx.lineTo(sx + 6 * G.zm, sy + th + 4 * G.zm);
  ctx.closePath(); ctx.fill();

  // Top face (bright)
  ctx.beginPath();
  ctx.moveTo(sx, sy - bh); ctx.lineTo(sx + tw / 2, sy + th / 2 - bh);
  ctx.lineTo(sx, sy + th - bh); ctx.lineTo(sx - tw / 2, sy + th / 2 - bh);
  ctx.closePath();
  ctx.fillStyle = 'rgb(' + Math.min(255, r * d + 40 | 0) + ',' + Math.min(255, g * d + 40 | 0) + ',' + Math.min(255, b * d + 40 | 0) + ')';
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 2 * G.zm; ctx.stroke();

  // Right face (dark)
  ctx.beginPath();
  ctx.moveTo(sx, sy + th - bh); ctx.lineTo(sx + tw / 2, sy + th / 2 - bh);
  ctx.lineTo(sx + tw / 2, sy + th / 2); ctx.lineTo(sx, sy + th);
  ctx.closePath();
  ctx.fillStyle = 'rgb(' + (r * 0.55 * d + 15 | 0) + ',' + (g * 0.55 * d + 15 | 0) + ',' + (b * 0.55 * d + 15 | 0) + ')';
  ctx.fill(); ctx.stroke();

  // Left face (medium)
  ctx.beginPath();
  ctx.moveTo(sx, sy + th - bh); ctx.lineTo(sx - tw / 2, sy + th / 2 - bh);
  ctx.lineTo(sx - tw / 2, sy + th / 2); ctx.lineTo(sx, sy + th);
  ctx.closePath();
  ctx.fillStyle = 'rgb(' + (r * 0.72 * d + 22 | 0) + ',' + (g * 0.72 * d + 22 | 0) + ',' + (b * 0.72 * d + 22 | 0) + ')';
  ctx.fill(); ctx.stroke();

  // Emoji
  ctx.font = Math.max(14, 18 * G.zm) + 'px serif';
  ctx.textAlign = 'center';
  ctx.fillText(def.emoji, sx, sy - bh + 6 * G.zm);
  // Label
  ctx.font = 'bold ' + Math.max(7, 8 * G.zm) + 'px system-ui';
  ctx.fillStyle = 'rgba(255,255,255,' + (d * 0.9) + ')';
  ctx.fillText(def.lbl, sx, sy - bh + 18 * G.zm);
}

function drawWorker(w) {
  var s = toScr(w.x, w.y);
  var sx = s.x * G.zm + G.camX, sy = s.y * G.zm + G.camY;
  var d = dayLight();
  var tc = EMP_TYPES[w.type] || EMP_TYPES.disengaged;
  var sizeM = tc.size;
  var alpha = w.fadeOut;

  // Shadow on ground
  ctx.fillStyle = 'rgba(0,0,0,' + (0.15 * alpha) + ')';
  ctx.beginPath();
  ctx.ellipse(sx + 2 * G.zm, sy + 2 * G.zm, 5 * G.zm * sizeM, 2 * G.zm * sizeM, 0, 0, Math.PI * 2);
  ctx.fill();

  // Body
  ctx.globalAlpha = alpha;
  ctx.fillStyle = tc.color;
  ctx.beginPath();
  ctx.arc(sx, sy - 4 * G.zm * sizeM, 4.5 * G.zm * sizeM, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = G.zm; ctx.stroke();

  // Head
  ctx.fillStyle = 'rgb(' + (245 * d + 10 | 0) + ',' + (215 * d + 20 | 0) + ',' + (185 * d + 20 | 0) + ')';
  ctx.beginPath();
  ctx.arc(sx, sy - 10 * G.zm * sizeM, 3.2 * G.zm * sizeM, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  // Speech bubble
  if (w.bubble && w.bubbleTimer > 0) {
    drawBubble(sx, sy - 18 * G.zm * sizeM, w.bubble);
  }
}

function drawBubble(x, y, text) {
  ctx.font = Math.max(9, 10 * G.zm) + 'px system-ui';
  var tw = ctx.measureText(text).width + 14 * G.zm;
  var th = 18 * G.zm;
  var bx = x - tw / 2, by = y - th - 6 * G.zm;

  // Rounded rect
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.beginPath();
  var r = 6 * G.zm;
  ctx.moveTo(bx + r, by);
  ctx.lineTo(bx + tw - r, by);
  ctx.quadraticCurveTo(bx + tw, by, bx + tw, by + r);
  ctx.lineTo(bx + tw, by + th - r);
  ctx.quadraticCurveTo(bx + tw, by + th, bx + tw - r, by + th);
  ctx.lineTo(bx + r, by + th);
  ctx.quadraticCurveTo(bx, by + th, bx, by + th - r);
  ctx.lineTo(bx, by + r);
  ctx.quadraticCurveTo(bx, by, bx + r, by);
  ctx.closePath();
  ctx.fill();

  // Triangle
  ctx.beginPath();
  ctx.moveTo(x - 4 * G.zm, by + th);
  ctx.lineTo(x, by + th + 5 * G.zm);
  ctx.lineTo(x + 4 * G.zm, by + th);
  ctx.closePath();
  ctx.fill();

  // Text
  ctx.fillStyle = '#1a1a2e';
  ctx.textAlign = 'center';
  ctx.fillText(text, x, by + th - 5 * G.zm);
}

function drawGhost(gx, gy) {
  if (!G.selTool || G.selTool === 'bulldoze') return;
  if (!inBounds(gx, gy)) return;
  var s = toScr(gx, gy);
  var sx = s.x * G.zm + G.camX, sy = s.y * G.zm + G.camY;
  var tw = TW * G.zm, th = TH * G.zm;
  var canPlace = !G.grid[gy][gx] && G.money >= (DEFS[G.selTool] ? DEFS[G.selTool].cost : 0);
  ctx.globalAlpha = 0.5;
  ctx.beginPath();
  ctx.moveTo(sx, sy); ctx.lineTo(sx + tw / 2, sy + th / 2);
  ctx.lineTo(sx, sy + th); ctx.lineTo(sx - tw / 2, sy + th / 2);
  ctx.closePath();
  ctx.fillStyle = canPlace ? 'rgba(76,175,80,0.4)' : 'rgba(244,67,54,0.4)';
  ctx.fill();
  ctx.strokeStyle = canPlace ? '#4CAF50' : '#F44336';
  ctx.lineWidth = 2 * G.zm;
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawMinimap() {
  mmX.fillStyle = '#1a2a1a';
  mmX.fillRect(0, 0, 140, 105);
  var scale = 140 / GRID;
  for (var i = 0; i < G.bldgs.length; i++) {
    var b = G.bldgs[i];
    var def = DEFS[b.type];
    mmX.fillStyle = def ? def.col : '#FFD54F';
    mmX.fillRect(b.gx * scale, b.gy * scale, Math.max(2, scale), Math.max(2, scale));
  }
  // HQ
  var hx = Math.floor(GRID / 2), hy = Math.floor(GRID / 2);
  mmX.fillStyle = '#FFD54F';
  mmX.fillRect(hx * scale - 1, hy * scale - 1, 4, 4);
  // Workers
  for (var i = 0; i < G.workers.length; i++) {
    var w = G.workers[i];
    if (w.quitting && w.fadeOut <= 0) continue;
    var tc = EMP_TYPES[w.type];
    mmX.fillStyle = tc ? tc.color : '#aaa';
    mmX.fillRect(w.x * scale, w.y * scale, 2, 2);
  }
}

// ============================================================
// MAIN RENDER
// ============================================================
function render() {
  var d = dayLight();
  // Sky gradient
  var skyR = 180 * d + 60 | 0, skyG = 210 * d + 50 | 0, skyB = 240 * d + 15 | 0;
  ctx.fillStyle = 'rgb(' + skyR + ',' + skyG + ',' + skyB + ')';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Collect all renderable items sorted by iso depth (painter's algorithm)
  var items = [];

  // Tiles and buildings
  for (var gy = 0; gy < GRID; gy++) {
    for (var gx = 0; gx < GRID; gx++) {
      items.push({type: 'tile', gx: gx, gy: gy, depth: gx + gy});
      if (G.grid[gy][gx]) {
        items.push({type: 'building', gx: gx, gy: gy, cell: G.grid[gy][gx], depth: gx + gy + 0.1});
      }
    }
  }

  // Workers
  for (var i = 0; i < G.workers.length; i++) {
    var w = G.workers[i];
    if (w.quitting && w.fadeOut <= 0) continue;
    items.push({type: 'worker', worker: w, depth: Math.round(w.x) + Math.round(w.y) + 0.2});
  }

  items.sort(function(a, b) { return a.depth - b.depth; });

  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    if (it.type === 'tile') drawTile(it.gx, it.gy);
    else if (it.type === 'building') drawBuilding(it.gx, it.gy, it.cell);
    else if (it.type === 'worker') drawWorker(it.worker);
  }

  // Ghost preview
  if (G.selTool && G.mouseGX >= 0) {
    drawGhost(G.mouseGX, G.mouseGY);
  }

  drawMinimap();
}

// ============================================================
// GAME TICK
// ============================================================
function gameTick() {
  if (G.gameOver) return;

  // Advance time
  G.gTime += G.gSpeed;
  if (G.gTime >= 1440) {
    G.gTime -= 1440;
    G.gDay++;
    dayTick();
  }

  // Event timer
  G.eventTimer += G.gSpeed;
  if (!G.eventActive && G.eventTimer > (40 + Math.random() * 20) * 60) {
    G.eventTimer = 0;
    triggerRandomEvent();
  }

  // Event countdown
  if (G.eventActive && G.eventCountdown > 0) {
    G.eventCountdown -= G.gSpeed / 60;
    updateEventTimer();
    if (G.eventCountdown <= 0) {
      autoPickWorst();
    }
  }

  // Worker AI
  updateWorkers();

  // Spawn timer
  G.spawnTimer += G.gSpeed;
  if (G.spawnTimer > 600) { // every ~10 game-minutes
    G.spawnTimer = 0;
    maybeSpawnWorker();
  }

  // Policy activation
  updatePolicies();

  // Metric drift
  updateMetrics();

  // Buff timers (per day handled in dayTick)

  // Welfare just-built timer
  if (G.welfareTimer > 0) {
    G.welfareTimer -= G.gSpeed;
    if (G.welfareTimer <= 0) G.welfareJustBuilt = false;
  }

  // Win/lose check
  checkWinLose();
}

function dayTick() {
  // Revenue and expenses
  var rev = 0;
  for (var i = 0; i < G.bldgs.length; i++) {
    var def = DEFS[G.bldgs[i].type];
    if (def && def.rev > 0) rev += def.rev;
  }
  // Employee multiplier
  var empMult = 0;
  var aliveWorkers = G.workers.filter(function(w) { return !w.quitting; });
  for (var i = 0; i < aliveWorkers.length; i++) {
    var tc = EMP_TYPES[aliveWorkers[i].type];
    empMult += tc ? tc.revMult : 0.5;
  }
  if (aliveWorkers.length > 0) empMult /= aliveWorkers.length;
  else empMult = 0;

  rev = Math.round(rev * empMult * G.revPenalty);
  if (policyActive('rewards')) rev = Math.round(rev * 1.1);
  if (policyActive('coordination')) rev = Math.round(rev * 1.15);

  var expenses = 0;
  for (var i = 0; i < G.bldgs.length; i++) {
    var def = DEFS[G.bldgs[i].type];
    if (def) expenses += def.upkeep;
  }
  expenses += aliveWorkers.length * 5; // salary

  G.money += rev - expenses;

  // Buff countdown
  if (G.revPenaltyDays > 0) {
    G.revPenaltyDays--;
    if (G.revPenaltyDays <= 0) G.revPenalty = 1;
  }
  if (G.rookieGrowthDays > 0) {
    G.rookieGrowthDays--;
    if (G.rookieGrowthDays <= 0) G.rookieGrowthBuff = 1;
  }
  if (G.delayedCustDays > 0) {
    G.delayedCustDays--;
    if (G.delayedCustDays <= 0 && G.delayedCust > 0) {
      G.custSat = Math.min(100, G.custSat + G.delayedCust);
      G.delayedCust = 0;
      showToast('\uD601\uC2E0 \uD22C\uC790 \uD6A8\uACFC \uBC1C\uC0DD! \uACE0\uAC1D\uB9CC\uC871 +', 'success');
    }
  }

  // Update HUD after economy
  updateHUD();
}

function updateMetrics() {
  // Building-based metric growth
  for (var i = 0; i < G.bldgs.length; i++) {
    var def = DEFS[G.bldgs[i].type];
    if (def && def.metric && def.metricAmt) {
      if (def.metric === 'cust') G.custSat = Math.min(100, G.custSat + def.metricAmt * G.gSpeed / 60);
      if (def.metric === 'emp') G.empHap = Math.min(100, G.empHap + def.metricAmt * G.gSpeed / 60);
      if (def.metric === 'soc') G.socVal = Math.min(100, G.socVal + def.metricAmt * G.gSpeed / 60);
    }
  }

  // Policy bonuses
  var polKeys = Object.keys(G.activePolicies);
  for (var p = 0; p < polKeys.length; p++) {
    var pol = POLICIES.find(function(pp) { return pp.id === polKeys[p]; });
    if (pol) {
      G.custSat = Math.min(100, G.custSat + pol.custBonus * 0.001 * G.gSpeed);
      G.empHap = Math.min(100, G.empHap + pol.empBonus * 0.001 * G.gSpeed);
      G.socVal = Math.min(100, G.socVal + pol.socBonus * 0.001 * G.gSpeed);
    }
  }

  // Natural decay
  G.custSat = Math.max(0, G.custSat - 0.002 * G.gSpeed);
  G.empHap = Math.max(0, G.empHap - 0.003 * G.gSpeed);
  G.socVal = Math.max(0, G.socVal - 0.002 * G.gSpeed);

  // Rating
  G.rating = clamp(1, 5, (G.custSat + G.empHap + G.socVal) / 60 + G.ratingBonus);
}

function updateWorkers() {
  var hx = Math.floor(GRID / 2), hy = Math.floor(GRID / 2);
  for (var i = G.workers.length - 1; i >= 0; i--) {
    var w = G.workers[i];
    var tc = EMP_TYPES[w.type] || EMP_TYPES.disengaged;

    // Quitting animation
    if (w.quitting) {
      // Move toward HQ
      var dx = hx - w.x, dy = hy - w.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > 0.5) {
        w.x += (dx / dist) * 0.03 * G.gSpeed;
        w.y += (dy / dist) * 0.03 * G.gSpeed;
      } else {
        w.fadeOut -= 0.02 * G.gSpeed;
        if (w.fadeOut <= 0) {
          G.workers.splice(i, 1);
        }
      }
      continue;
    }

    // Speech cooldown
    w.speechCooldown -= G.gSpeed;
    if (w.speechCooldown <= 0 && !w.bubble) {
      w.speechCooldown = 200 + Math.random() * 300;
      assignSpeech(w);
    }

    // Bubble timer
    if (w.bubbleTimer > 0) {
      w.bubbleTimer -= G.gSpeed;
      if (w.bubbleTimer <= 0) w.bubble = null;
    }

    // State timer
    w.stateTimer -= G.gSpeed;
    if (w.stateTimer <= 0) {
      pickNewTarget(w);
    }

    // Move along path
    if (w.path && w.path.length > 0 && w.pathIdx < w.path.length) {
      var target = w.path[w.pathIdx];
      var dx = target.x - w.x, dy = target.y - w.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      var spd = tc.speed * 0.02 * G.gSpeed;
      if (dist < spd) {
        w.x = target.x; w.y = target.y;
        w.pathIdx++;
      } else {
        w.x += (dx / dist) * spd;
        w.y += (dy / dist) * spd;
      }
    }

    // Type transitions
    w.transitionCooldown -= G.gSpeed;
    if (w.transitionCooldown <= 0) {
      w.transitionCooldown = 300 + Math.random() * 300;
      attemptTransition(w);
    }

    // Happiness drain for bad conditions
    if (!hasBuilding('cafeteria') && !hasBuilding('wellness')) {
      w.happiness = Math.max(0, w.happiness - 0.005 * G.gSpeed);
    }

    // Quit check
    if (w.happiness <= 0 && w.preventQuitDays <= 0) {
      w.quitting = true;
      w.bubble = SPEECH.quitting[0];
      w.bubbleTimer = 120;
      G.totalQuits++;
    }

    // Prevent quit countdown (per day in dayTick is approximate, use ticks)
    if (w.preventQuitDays > 0) {
      w.preventQuitDays -= G.gSpeed / 1440;
    }
  }
}

function pickNewTarget(w) {
  var hx = Math.floor(GRID / 2), hy = Math.floor(GRID / 2);
  // Pick a random building to visit
  var targets = G.bldgs.filter(function(b) { return b.type !== 'corridor' && b.type !== 'tree'; });
  if (targets.length === 0) {
    w.stateTimer = 120;
    return;
  }
  var t = targets[Math.floor(Math.random() * targets.length)];
  var path = bfsPath(w.x, w.y, t.gx, t.gy);
  if (path.length > 0) {
    w.path = path;
    w.pathIdx = 0;
    w.stateTimer = 300 + Math.random() * 300;
  } else {
    // Wander near current position
    w.stateTimer = 120;
    w.path = [];
  }
}

function attemptTransition(w) {
  // Rookie -> Ace (if Academy + OJT)
  if (w.type === 'rookie' && hasBuilding('academy') && policyActive('ojt')) {
    var chance = 0.03 * G.rookieGrowthBuff;
    if (Math.random() < chance) {
      w.type = 'ace';
      w.will = 70; w.capability = 70; w.happiness = 60;
      w.bubble = SPEECH.transition_cynic_ace[0]; // reuse "let's do this" line
      w.bubbleTimer = 120;
      G.totalAceTransitions++;
    }
  }
  // Cynic -> Ace (if VWBE + Wellness)
  if (w.type === 'cynic' && policyActive('vwbe') && hasBuilding('wellness')) {
    if (Math.random() < 0.02) {
      w.type = 'ace';
      w.will = 65; w.capability = 65; w.happiness = 55;
      w.bubble = SPEECH.transition_cynic_ace[0];
      w.bubbleTimer = 120;
      G.totalCynicRecoveries++;
      G.totalAceTransitions++;
    }
  }
  // Ace -> Cynic (burnout, if no wellness and high workload)
  if (w.type === 'ace' && !hasBuilding('wellness') && !hasBuilding('cafeteria')) {
    if (Math.random() < 0.008) {
      w.type = 'cynic';
      w.will -= 20; w.happiness -= 20;
      w.bubble = SPEECH.transition_ace_cynic[0];
      w.bubbleTimer = 120;
    }
  }
  // Rookie -> Disengaged (neglect, if no academy and no OJT)
  if (w.type === 'rookie' && !hasBuilding('academy') && !policyActive('ojt')) {
    if (Math.random() < 0.01) {
      w.type = 'disengaged';
      w.will -= 15; w.happiness -= 15;
    }
  }
}

function assignSpeech(w) {
  var lines = null;
  if (w.type === 'disengaged') {
    if (G.welfareJustBuilt) lines = SPEECH.after_welfare;
    else if (hasBuilding('academy')) lines = SPEECH.disengaged_academy;
    else lines = SPEECH.disengaged_no_welfare;
  } else if (w.type === 'cynic') {
    if (policyActive('vwbe')) lines = SPEECH.cynic_vwbe;
    else lines = SPEECH.cynic_no_vwbe;
  } else if (w.type === 'rookie') {
    if (policyActive('ojt')) lines = SPEECH.rookie_ojt;
    else lines = SPEECH.rookie_no_ojt;
  } else if (w.type === 'ace') {
    if (G.empHap > 60) lines = SPEECH.ace_good;
    else lines = SPEECH.ace_scout;
  } else if (w.type === 'leader') {
    if (G.empHap > 50) lines = SPEECH.leader_good;
    else lines = SPEECH.leader_overwhelmed;
  }
  if (lines) {
    w.bubble = lines[Math.floor(Math.random() * lines.length)];
    w.bubbleTimer = 120;
  }
}

function maybeSpawnWorker() {
  var hrCount = countBuilding('hr');
  if (hrCount <= 0) return;
  var aliveCount = G.workers.filter(function(w) { return !w.quitting; }).length;
  if (aliveCount >= hrCount * 6 + 12) return; // cap
  var hx = Math.floor(GRID / 2), hy = Math.floor(GRID / 2);
  var type = Math.random() < 0.6 ? 'rookie' : 'cynic';
  spawnWorker(type, hx, hy);
  showToast('\uC0C8 \uC9C1\uC6D0\uC774 \uC785\uC0AC\uD588\uC2B5\uB2C8\uB2E4! (' + type + ')', 'info');
}

function updatePolicies() {
  var keys = Object.keys(G.activatingPolicies);
  for (var i = 0; i < keys.length; i++) {
    var pid = keys[i];
    G.activatingPolicies[pid] -= G.gSpeed / 60;
    if (G.activatingPolicies[pid] <= 0) {
      delete G.activatingPolicies[pid];
      G.activePolicies[pid] = true;
      showToast(POLICIES.find(function(p){return p.id===pid;}).nameKo + ' \uD65C\uC131\uD654!', 'success');
      renderPolicyPanel();
    }
  }
}

function checkWinLose() {
  if (G.gameOver) return;
  // Lose: money <= 0
  if (G.money <= 0) {
    G.gameOver = true;
    G.gameWon = false;
    showReport();
    return;
  }
  // Lose: all quit
  var alive = G.workers.filter(function(w) { return !w.quitting; });
  if (alive.length === 0 && G.gDay > 2) {
    G.gameOver = true;
    G.gameWon = false;
    showReport();
    return;
  }
  // Win: rating >= 3.0 for 30 days
  if (G.rating >= 3.0) {
    G.winDays += G.gSpeed / 1440;
    if (G.winDays >= 30) {
      G.gameOver = true;
      G.gameWon = true;
      showReport();
    }
  } else {
    G.winDays = Math.max(0, G.winDays - G.gSpeed / 1440 * 0.5);
  }
}

function renderPolicyPanel() {
  var panel = document.getElementById('policy-panel');
  while (panel.firstChild) panel.removeChild(panel.firstChild);

  var title = document.createElement('h3');
  title.textContent = 'SKMS \uACBD\uC601 \uC81C\uB3C4';
  panel.appendChild(title);

  for (var i = 0; i < POLICIES.length; i++) {
    (function(pol) {
      var div = document.createElement('div');
      div.className = 'pol-item';

      var isActive = !!G.activePolicies[pol.id];
      var isActivating = !!G.activatingPolicies[pol.id];
      var meetsPrereqs = checkPolicyPrereqs(pol);

      if (isActive) div.classList.add('active');
      else if (isActivating) div.classList.add('activating');
      else if (!meetsPrereqs) div.classList.add('locked');

      var nameEl = document.createElement('div');
      nameEl.className = 'pol-name';
      nameEl.textContent = (isActive ? '\u2705 ' : isActivating ? '\u23F3 ' : !meetsPrereqs ? '\u{1F512} ' : '') + pol.nameKo;
      div.appendChild(nameEl);

      var costEl = document.createElement('div');
      costEl.className = 'pol-cost';
      costEl.textContent = isActive ? '\uD65C\uC131\uD654\uB428' : isActivating ? '\uD65C\uC131\uD654 \uC911...' : '$' + pol.cost + ' \u00B7 ' + pol.time + 's';
      div.appendChild(costEl);

      var descEl = document.createElement('div');
      descEl.className = 'pol-desc';
      descEl.textContent = pol.desc;
      div.appendChild(descEl);

      if (!meetsPrereqs && !isActive && !isActivating) {
        var reqEl = document.createElement('div');
        reqEl.className = 'pol-req';
        reqEl.textContent = '\uD544\uC694: ' + getPrereqText(pol);
        div.appendChild(reqEl);
      }

      if (isActivating) {
        var progWrap = document.createElement('div');
        progWrap.className = 'pol-progress';
        var progBar = document.createElement('div');
        progBar.className = 'pol-progress-bar';
        var remain = G.activatingPolicies[pol.id] || 0;
        var pct = Math.max(0, 100 - (remain / pol.time * 100));
        progBar.style.width = pct + '%';
        progWrap.appendChild(progBar);
        div.appendChild(progWrap);
      }

      if (!isActive && !isActivating && meetsPrereqs) {
        div.addEventListener('click', function() {
          if (G.money < pol.cost) {
            showToast('\uB3C8\uC774 \uBD80\uC871\uD569\uB2C8\uB2E4!', 'warn');
            return;
          }
          G.money -= pol.cost;
          G.activatingPolicies[pol.id] = pol.time;
          showToast(pol.nameKo + ' \uD65C\uC131\uD654 \uC2DC\uC791!', 'info');
          renderPolicyPanel();
          updateHUD();
        });
      }

      panel.appendChild(div);
    })(POLICIES[i]);
  }
}

function checkPolicyPrereqs(pol) {
  for (var i = 0; i < pol.prereqs.length; i++) {
    var req = pol.prereqs[i];
    // Check if it's a policy prereq
    var isPol = POLICIES.some(function(p) { return p.id === req; });
    if (isPol) {
      if (!G.activePolicies[req]) return false;
    } else {
      // Building prereq
      if (!hasBuilding(req)) return false;
    }
  }
  return true;
}

function getPrereqText(pol) {
  var texts = [];
  var buildingNames = {
    planning: '\uAE30\uD68D\uBD80\uC11C', rnd: 'R&D \uBD80\uC11C', hr: 'HR \uBD80\uC11C',
    wellness: '\uBCF5\uC9C0\uC2DC\uC124', social: '\uC0AC\uD68C\uACF5\uD5CC \uBD80\uC11C',
    supex: 'SUPEX \uCD94\uAD6C', vwbe: 'VWBE \uBB38\uD654'
  };
  for (var i = 0; i < pol.prereqs.length; i++) {
    texts.push(buildingNames[pol.prereqs[i]] || pol.prereqs[i]);
  }
  return texts.join(' + ');
}

      effect: w.capability > 80 ? '\uB9AC\uB354\uB85C \uC2B9\uC9C4!' : '\uC5ED\uB7C9 80+ \uD544\uC694',
      toast: w.capability > 80 ? '\uB9AC\uB354\uB85C \uC2B9\uC9C4!' : '\uC544\uC9C1 \uC5ED\uB7C9\uC774 \uBD80\uC871\uD569\uB2C8\uB2E4',
      apply: function(w) { if (w.capability > 80) { w.type = 'leader'; w.will = 80; G.totalLeaderPromotions++; } }
    });
    choices.push({
      text: '"\uC9C0\uAE08 \uC5C5\uBB34 \uAC15\uB3C4\uB294 \uAD1C\uCC2E\uB098\uC694?"',

      toast: '\uC5C5\uBB34 \uAC15\uB3C4\uB97C \uD30C\uC545\uD588\uC2B5\uB2C8\uB2E4',
      apply: function(w) { w.happiness = Math.min(100, w.happiness + 5); }
    });
  } else if (w.type === 'leader') {
    choices.push({
      text: '"\uD300 \uC0C1\uD669\uC740 \uC5B4\uB5A4\uAC00\uC694?"',
      effect: '\uBD80\uC11C \uC0AC\uAE30 \uD30C\uC545',
      toast: '\uD300 \uC0C1\uD669\uC744 \uD30C\uC545\uD588\uC2B5\uB2C8\uB2E4',
      apply: function(w) { w.happiness = Math.min(100, w.happiness + 3); }
    });
    choices.push({
      text: '"\uD544\uC694\uD55C \uC9C0\uC6D0\uC774 \uC788\uB098\uC694?"',
      effect: '\uD300 \uD6A8\uC728 +',
      toast: '\uC9C0\uC6D0 \uBC29\uC548\uC744 \uB17C\uC758\uD588\uC2B5\uB2C8\uB2E4',
      apply: function(w) { w.will = Math.min(100, w.will + 5); w.capability = Math.min(100, w.capability + 3); }
    });
    choices.push({
      text: '"\uCF54\uCE6D \uC5ED\uB7C9\uC744 \uD0A4\uC6CC\uBD05\uC2DC\uB2E4"',
      effect: hasBuilding('academy') ? '\uB9AC\uB354\uC2ED +' : '\uC544\uCE74\uB370\uBBF8 \uD544\uC694',
      toast: hasBuilding('academy') ? '\uCF54\uCE6D \uAD50\uC721 \uC2DC\uC791!' : '\uC544\uCE74\uB370\uBBF8\uB97C \uBA3C\uC800 \uAC74\uC124\uD558\uC138\uC694',
      apply: function(w) { if (hasBuilding('academy')) { w.capability = Math.min(100, w.capability + 10); } }
    });
  }
  return choices;
}

function triggerRandomEvent() {
  if (G.eventActive || G.gameOver) return;
  // Pick unused event, or cycle
  var available = EVENTS.filter(function(e) { return G.usedEvents.indexOf(e.id) === -1; });
  if (available.length === 0) {
    G.usedEvents = [];
    available = EVENTS.slice();
  }
  var evt = available[Math.floor(Math.random() * available.length)];
  G.usedEvents.push(evt.id);
  G.currentEvent = evt;
  G.eventActive = true;
  G.eventCountdown = 15;
  showEventModal(evt);
}

function showEventModal(evt) {
  var overlay = document.getElementById('event-overlay');
  while (overlay.firstChild) overlay.removeChild(overlay.firstChild);

  var card = document.createElement('div');
  card.className = 'event-card';

  // Timer
  var timer = document.createElement('div');
  timer.className = 'event-timer';
  timer.id = 'event-timer-display';
  timer.textContent = '15s';
  card.appendChild(timer);

  // Tag
  var tag = document.createElement('div');
  tag.className = 'event-tag';
  tag.textContent = '\u{1F4F0} NEWS';
  card.appendChild(tag);

  // Headline
  var headline = document.createElement('div');
  headline.className = 'event-headline';
  headline.textContent = evt.headline;
  card.appendChild(headline);

  // Description
  var desc = document.createElement('div');
  desc.className = 'event-desc';
  desc.textContent = evt.desc;
  card.appendChild(desc);

  // Choices
  for (var c = 0; c < evt.choices.length; c++) {
    (function(choice, idx) {
      var btn = document.createElement('button');
      btn.className = 'event-choice';

      var textEl = document.createElement('span');
      textEl.textContent = choice.text;
      btn.appendChild(textEl);

      var previewEl = document.createElement('span');
      previewEl.className = 'preview';

      var previewText = choice.preview;
      var disabled = false;

      // Check policy requirement
      if (choice.reqPolicy && !policyActive(choice.reqPolicy)) {
        disabled = true;
        var reqSpan = document.createElement('span');
        reqSpan.className = 'req';
        var polName = POLICIES.find(function(p){return p.id===choice.reqPolicy;});
        reqSpan.textContent = ' [\uD544\uC694: ' + (polName ? polName.nameKo : choice.reqPolicy) + ']';
        previewEl.textContent = previewText;
        previewEl.appendChild(reqSpan);
      } else if (choice.reqBuilding && !hasBuilding(choice.reqBuilding)) {
        disabled = true;
        previewEl.textContent = previewText + ' [\uD544\uC694: ' + (DEFS[choice.reqBuilding] ? DEFS[choice.reqBuilding].lbl : choice.reqBuilding) + ']';
      } else if (choice.condition && !choice.condition(G)) {
        disabled = true;
        previewEl.textContent = previewText + ' [\uC870\uAC74 \uBBF8\uCDA9\uC871]';
      } else {
        previewEl.textContent = previewText;
      }

      btn.appendChild(previewEl);
      btn.disabled = disabled;

      if (!disabled) {
        btn.addEventListener('click', function() {
          choice.apply(G);
          G.choiceLog.push({event: G.currentEvent.id, choice: idx});
          closeEvent();
          updateHUD();
        });
      }

      card.appendChild(btn);
    })(evt.choices[c], c);
  }

  overlay.appendChild(card);
  overlay.classList.add('show');
}

function updateEventTimer() {
  var el = document.getElementById('event-timer-display');
  if (el) el.textContent = Math.ceil(G.eventCountdown) + 's';
}

function autoPickWorst() {
  // Pick last choice (worst option)
  if (!G.currentEvent) { closeEvent(); return; }
  var choices = G.currentEvent.choices;
  var lastValid = null;
  for (var i = choices.length - 1; i >= 0; i--) {
    var c = choices[i];
    var disabled = false;
    if (c.reqPolicy && !policyActive(c.reqPolicy)) disabled = true;
    if (c.reqBuilding && !hasBuilding(c.reqBuilding)) disabled = true;
    if (c.condition && !c.condition(G)) disabled = true;
    if (!disabled) { lastValid = c; break; }
  }
  if (lastValid) {
    lastValid.apply(G);
    G.choiceLog.push({event: G.currentEvent.id, choice: 'auto'});
  }
  closeEvent();
  showToast('\uC2DC\uAC04 \uCD08\uACFC! \uCD5C\uC545\uC758 \uC120\uD0DD\uC774 \uC801\uC6A9\uB418\uC5C8\uC2B5\uB2C8\uB2E4.', 'warn');
  updateHUD();
}

function closeEvent() {
  G.eventActive = false;
  G.currentEvent = null;
  document.getElementById('event-overlay').classList.remove('show');
}

function getManagementStyle() {
  var polCount = Object.keys(G.activePolicies).length;
  if (polCount >= 7 && G.empHap >= 70 && G.socVal >= 50) return '\uC774\uD574\uAD00\uACC4\uC790 \uC911\uC2EC \uACBD\uC601\uC790';
  if (G.custSat >= 70 && G.empHap < 50) return '\uC131\uACFC \uC911\uC2EC \uC2E4\uC6A9\uC8FC\uC758\uC790';
  if (G.socVal >= 60) return '\uC0AC\uD68C\uC801 \uAC00\uCE58 \uACBD\uC601\uC790';
  if (G.empHap >= 60) return '\uAD6C\uC131\uC6D0 \uD589\uBCF5 \uC6B0\uC120 \uACBD\uC601\uC790';
  if (polCount >= 4) return '\uADE0\uD615 \uC7A1\uD78C \uACBD\uC601\uC790';
  return '\uC0DD\uC874 \uC911\uC2EC \uACBD\uC601\uC790';
}

function calcSKMSAlignment() {
  var score = 0;
  // +10 per active policy
  score += Object.keys(G.activePolicies).length * 10;
  // +5 if emp > 70
  if (G.empHap > 70) score += 5;
  // +5 if no neglect quits (approximate: if totalQuits <= 2)
  if (G.totalQuits <= 2) score += 5;
  // -10 per ignore
  score -= G.ignoreCount * 10;
  // -5 per pressure
  score -= G.pressureCount * 5;
  return clamp(0, 100, score);
}

canvas.addEventListener('mousedown', function(e) {
  initAudio();
  if (e.button === 0) {
    G.drag = true;
    G.dragStart = {x: e.clientX, y: e.clientY};
    G.camStart = {x: G.camX, y: G.camY};
  }
});

canvas.addEventListener('mousemove', function(e) {
  G.mouseX = e.clientX;
  G.mouseY = e.clientY;
  var grd = toGrd(e.clientX, e.clientY);
  G.mouseGX = grd.x;
  G.mouseGY = grd.y;

  if (G.drag) {
    var dx = e.clientX - G.dragStart.x;
    var dy = e.clientY - G.dragStart.y;
    G.camX = G.camStart.x + dx;
    G.camY = G.camStart.y + dy;
  }
});

canvas.addEventListener('mouseup', function(e) {
  if (!G.drag) return;
  var dx = Math.abs(e.clientX - G.dragStart.x);
  var dy = Math.abs(e.clientY - G.dragStart.y);
  G.drag = false;

  // Only act if not dragging (click)
  if (dx < 5 && dy < 5) {
    handleClick(e.clientX, e.clientY);
  }
});

canvas.addEventListener('wheel', function(e) {
  e.preventDefault();
  var oldZm = G.zm;
  G.zm = clamp(0.3, 3, G.zm - e.deltaY * 0.001);
  // Zoom toward mouse
  var ratio = G.zm / oldZm;
  G.camX = e.clientX - (e.clientX - G.camX) * ratio;
  G.camY = e.clientY - (e.clientY - G.camY) * ratio;
}, {passive: false});

function handleClick(cx, cy) {
  var grd = toGrd(cx, cy);
  var gx = grd.x, gy = grd.y;
  if (!inBounds(gx, gy)) return;

  if (G.selTool === 'bulldoze') {
    bulldoze(gx, gy);
    return;
  }

  if (G.selTool && DEFS[G.selTool]) {
    placeBuild(gx, gy, G.selTool);
    return;
  }

  // Click on worker?
  var closest = null, closestDist = 999;
  for (var i = 0; i < G.workers.length; i++) {
    var w = G.workers[i];
    if (w.quitting) continue;
    var dx = w.x - gx, dy = w.y - gy;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 1.5 && dist < closestDist) {
      closest = w;
      closestDist = dist;
    }
  }
  if (closest) {
    openMeeting(closest);
  }
}

function placeBuild(gx, gy, type) {
  if (G.grid[gy][gx]) {
    sfxErr();
    showToast('\uC774\uBBF8 \uAC74\uBB3C\uC774 \uC788\uC2B5\uB2C8\uB2E4!', 'warn');
    return;
  }
  var def = DEFS[type];
  if (G.money < def.cost) {
    sfxErr();
    showToast('\uB3C8\uC774 \uBD80\uC871\uD569\uB2C8\uB2E4!', 'warn');
    return;
  }
  // Save undo
  G.undoStack.push({action:'build', x:gx, y:gy, type:type});
  G.redoStack = [];

  G.money -= def.cost;
  G.grid[gy][gx] = {type: type};
  G.bldgs.push({type: type, gx: gx, gy: gy});
  sfxPlace();

  // Check welfare buildings for speech trigger
  if (type === 'cafeteria' || type === 'wellness') {
    G.welfareJustBuilt = true;
    G.welfareTimer = 300;
  }

  updateHUD();
  renderPolicyPanel();
}

function bulldoze(gx, gy) {
  var cell = G.grid[gy][gx];
  if (!cell || cell.type === 'hq') {
    sfxErr();
    return;
  }
  var def = DEFS[cell.type];
  var refund = def ? Math.floor(def.cost * 0.5) : 0;

  G.undoStack.push({action:'bulldoze', x:gx, y:gy, type:cell.type});
  G.redoStack = [];

  G.grid[gy][gx] = null;
  for (var i = G.bldgs.length - 1; i >= 0; i--) {
    if (G.bldgs[i].gx === gx && G.bldgs[i].gy === gy) {
      G.bldgs.splice(i, 1);
      break;
    }
  }
  G.money += refund;
  sfxDel();
  showToast('\uCCA0\uAC70 (+$' + refund + ')', 'info');
  updateHUD();
  renderPolicyPanel();
}

// Undo/Redo
document.addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.key === 'z' && !e.shiftKey) {
    e.preventDefault();
    undoAction();
  }
  if (e.ctrlKey && e.shiftKey && (e.key === 'z' || e.key === 'Z')) {
    e.preventDefault();
    redoAction();
  }
});

function undoAction() {
  if (G.undoStack.length === 0) return;
  var action = G.undoStack.pop();
  G.redoStack.push(action);
  if (action.action === 'build') {
    // Remove building
    G.grid[action.y][action.x] = null;
    for (var i = G.bldgs.length - 1; i >= 0; i--) {
      if (G.bldgs[i].gx === action.x && G.bldgs[i].gy === action.y) {
        G.bldgs.splice(i, 1); break;
      }
    }
    G.money += DEFS[action.type].cost;
  } else if (action.action === 'bulldoze') {
    // Restore building
    G.grid[action.y][action.x] = {type: action.type};
    G.bldgs.push({type: action.type, gx: action.x, gy: action.y});
    G.money -= Math.floor(DEFS[action.type].cost * 0.5);
  }
  updateHUD();
  showToast('Undo', 'info');
}

function redoAction() {
  if (G.redoStack.length === 0) return;
  var action = G.redoStack.pop();
  G.undoStack.push(action);
  if (action.action === 'build') {
    G.grid[action.y][action.x] = {type: action.type};
    G.bldgs.push({type: action.type, gx: action.x, gy: action.y});
    G.money -= DEFS[action.type].cost;
  } else if (action.action === 'bulldoze') {
    G.grid[action.y][action.x] = null;
    for (var i = G.bldgs.length - 1; i >= 0; i--) {
      if (G.bldgs[i].gx === action.x && G.bldgs[i].gy === action.y) {
        G.bldgs.splice(i, 1); break;
      }
    }
    G.money += Math.floor(DEFS[action.type].cost * 0.5);
  }
  updateHUD();
  showToast('Redo', 'info');
}

// ============================================================
// GAME LOOP
// ============================================================
var lastTime = 0;
function gameLoop(ts) {
  var dt = ts - lastTime;
  lastTime = ts;

  if (!G.gameOver) {
    G.tickAccum += dt;
    while (G.tickAccum >= 1000 / 60) {
      G.tickAccum -= 1000 / 60;
      gameTick();
    }
    // Update HUD periodically
    if (Math.floor(ts / 500) !== Math.floor((ts - dt) / 500)) {
      updateHUD();
      // Update policy progress bars
      if (G.policyOpen && Object.keys(G.activatingPolicies).length > 0) {
        renderPolicyPanel();
      }
    }
  }

  render();
  requestAnimationFrame(gameLoop);
}

// ============================================================
// INITIALIZATION
// ============================================================
function init() {
  setupCrisisScenario();
  buildTopBar();
  buildBuildPanel();
  buildPolicyToggle();
  renderPolicyPanel();
  centerCamera();
  showTutorial();
  updateHUD();
  requestAnimationFrame(gameLoop);
}

init();
</script>
