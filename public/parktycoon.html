function showFollowupModal(followupEvt) {
  sfxEvent();
  var savedSpeed = G.gSpeed;
  G.gSpeed = 0;
  var overlay = document.getElementById('event-overlay');
  while (overlay.firstChild) overlay.removeChild(overlay.firstChild);

  var card = document.createElement('div');
  card.className = 'event-card';

  // Badge
  var badge = document.createElement('div');
  badge.style.cssText = 'background:rgba(251,191,36,0.15);color:#fbbf24;padding:3px 8px;border-radius:4px;font-size:10px;font-weight:700;display:inline-block;margin-bottom:8px;';
  badge.textContent = '\uD83D\uDCF0 \uD6C4\uC18D \uBCF4\uB3C4';
  card.appendChild(badge);

  // Headline
  var headline = document.createElement('div');
  headline.className = 'event-headline';
  headline.textContent = followupEvt.headline;
  card.appendChild(headline);

  // Body
  var desc = document.createElement('div');
  desc.className = 'event-desc';
  desc.textContent = followupEvt.body;
  card.appendChild(desc);

  // Source reference
  var sourceHeadline = '';
  for (var ei = 0; ei < EVENTS.length; ei++) {
    if (EVENTS[ei].id === followupEvt.sourceEvent) {
      sourceHeadline = EVENTS[ei].headline;
      break;
    }
  }
  if (sourceHeadline) {
    var ref = document.createElement('div');
    ref.style.cssText = 'font-size:10px;color:rgba(255,255,255,0.3);font-style:italic;margin-top:8px;';
    ref.textContent = '\uC9C0\uB09C \'' + sourceHeadline + '\' \uACB0\uC815\uC758 \uACB0\uACFC\uC785\uB2C8\uB2E4';
    card.appendChild(ref);
  }

  // Confirm button
  var btn = document.createElement('button');
  btn.className = 'event-choice-btn';
  btn.style.cssText = 'margin-top:12px;text-align:center;';
  btn.textContent = '\uD655\uC778';
  btn.addEventListener('click', function() {
    // Apply effects
    var eff = followupEvt.effects || {};
    var alive = getAliveWorkers();
    if (eff.empHap) G.empHap = clamp(0, 100, G.empHap + eff.empHap);
    if (eff.will) {
      for (var wi = 0; wi < alive.length; wi++) {
        alive[wi].will = clamp(0, 100, alive[wi].will + eff.will);
      }
    }
    if (eff.capability) {
      for (var wi = 0; wi < alive.length; wi++) {
        alive[wi].capability = clamp(0, 100, alive[wi].capability + eff.capability);
      }
    }
    if (eff.custSat) G.custSat = clamp(0, 100, G.custSat + eff.custSat);
    if (eff.socVal) G.socVal = clamp(0, 100, G.socVal + eff.socVal);
    // Special conversions
    if (eff.convertDisengaged) convertRandom(G, 'rookie', 'disengaged', eff.convertDisengaged);
    if (eff.convertAce) convertRandom(G, 'rookie', 'ace', eff.convertAce);
    if (eff.convertRookie) convertRandom(G, 'disengaged', 'rookie', eff.convertRookie);
    if (eff.quitCount) quitRandom(G, eff.quitCount);
    if (eff.quitRisk) {
      for (var wi = 0; wi < alive.length; wi++) {
        if (Math.random() < 0.15) alive[wi].will = clamp(0, 100, alive[wi].will - 5);
      }
    }
    // Gauge delta animations for followup effects
    if (eff.empHap) showGaugeDelta('hud-emp', eff.empHap);
    if (eff.custSat) showGaugeDelta('hud-cust', eff.custSat);
    if (eff.socVal) showGaugeDelta('hud-soc', eff.socVal);
    // Screen flash based on net effect
    var netEffect = (eff.empHap || 0) + (eff.custSat || 0) + (eff.socVal || 0);
    flashScreen(netEffect >= 0 ? 'positive' : 'negative');
    // Worker emoji reactions
    showWorkerReactions(netEffect >= 0 ? '\uD83D\uDE0A' : '\uD83D\uDE21');
    addHistoryEntry(followupEvt.headline, '\uD6C4\uC18D \uBCF4\uB3C4', '\uD83D\uDCF0');
    overlay.classList.remove('show');
    G.gSpeed = savedSpeed || 1;
    updateHUD();
    saveGame();
  });
  card.appendChild(btn);

  overlay.appendChild(card);
  overlay.classList.add('show');
}

      apply: function() {
        G.money -= 200;
        worker.quitting = true;
        worker.bubble = SPEECH.quitting[0];
        worker.bubbleTimer = 120;
        G.totalQuits = (G.totalQuits || 0) + 1;

      apply: function() {
        var depts = G.bldgs.filter(function(b) { var d = DEFS[b.type]; return d && d.cat === 'dept'; });

          return !(worker.assignedDept && worker.assignedDept.gx === d.gx && worker.assignedDept.gy === d.gy);
        });

          showToast('\uC804\uD658\uD560 \uC218 \uC788\uB294 \uBD80\uC11C\uAC00 \uC5C6\uC2B5\uB2C8\uB2E4!', 'warn');
          return;
        }
        var newDept = otherDepts[Math.floor(Math.random() * otherDepts.length)];
        worker.assignedDept = {gx: newDept.gx, gy: newDept.gy, type: newDept.type};

        worker.will = Math.min(100, worker.will + 5);

        document.getElementById('btn-speed').textContent = '1x';

  overlay.appendChild(card);

}

  while (overlay.firstChild) overlay.removeChild(overlay.firstChild);

  var card = document.createElement('div');
  card.className = 'event-card';

  var tag = document.createElement('div');
  tag.className = 'event-tag';
  tag.textContent = '\uD83D\uDCCB \uC5F0\uBD09 \uD611\uC0C1';
  card.appendChild(tag);

  var headline = document.createElement('div');
  headline.className = 'event-headline';
  var typeNames = {ace:'\uC5D0\uC774\uC2A4', leader:'\uB9AC\uB354'};
  headline.textContent = '\uC5F0\uBD09 \uD611\uC0C1 \uC694\uCCAD';
  card.appendChild(headline);

  var currentLevel = (worker.salaryLevel || 1);
  var requestLevel = Math.round((currentLevel + 0.3) * 100) / 100;
  var counterLevel = Math.round((currentLevel + 0.15) * 100) / 100;

  var desc = document.createElement('div');
  desc.className = 'event-desc';
  desc.textContent = '\uC9C1\uC6D0 #' + worker.id + ' (' + (typeNames[worker.type] || worker.type) + ')\uAC00 \uC5F0\uBD09 \uC778\uC0C1\uC744 \uC694\uCCAD\uD569\uB2C8\uB2E4.\n\uD604\uC7AC \uC5F0\uBD09 \uC218\uC900: ' + currentLevel.toFixed(1) + 'x \u2192 \uC694\uCCAD: ' + requestLevel.toFixed(1) + 'x';
  card.appendChild(desc);

  var choices = [
    {
      text: '\uC218\uB77D',
      preview: '\uAE09\uC5EC +30%, \uD589\uBCF5 +20, \uC758\uC695 +10, \uB2E4\uB978 \uC9C1\uC6D0 \uD589\uBCF5 -3',
      apply: function() {
        worker.salaryLevel = requestLevel;
        worker.lastRaiseDay = G.gDay;
        worker.happiness = Math.min(100, worker.happiness + 20);
        worker.will = Math.min(100, worker.will + 10);
        worker.bubble = SPEECH.raise_happy[0];
        worker.bubbleTimer = 150;
        // Other workers may feel inequity
        var others = G.workers.filter(function(ww) { return !ww.quitting && ww.id !== worker.id; });
        for (var i = 0; i < others.length; i++) {
          others[i].happiness = Math.max(0, others[i].happiness - 3);
        }
        G.empHap = Math.max(0, G.empHap - 3);
        showToast('\uC9C1\uC6D0 #' + worker.id + ' \uC5F0\uBD09 ' + requestLevel.toFixed(1) + 'x \uC2B9\uC778', 'success');
      }
    },
    {
      text: '\uAC70\uC808',
      preview: '\uD589\uBCF5 -15, 30\uC77C \uB0B4 \uD1EC\uC0AC \uAC00\uB2A5\uC131 60%',
      apply: function() {
        worker.happiness = Math.max(0, worker.happiness - 15);
        worker.lastRaiseDay = G.gDay;
        // 60% chance quit within 30 days
        if (Math.random() < 0.6) {
          worker.quitTimer = 30;
          worker.preventQuitDays = 0;
        }
        showToast('\uC9C1\uC6D0 #' + worker.id + ' \uC5F0\uBD09 \uC694\uCCAD \uAC70\uC808', 'warn');
      }
    },
    {
      text: '\uCE74\uC6B4\uD130 \uC81C\uC548 ' + counterLevel.toFixed(2) + 'x',
      preview: '\uAE09\uC5EC +15%, \uD589\uBCF5 +8',
      apply: function() {
        worker.salaryLevel = counterLevel;
        worker.lastRaiseDay = G.gDay;
        worker.happiness = Math.min(100, worker.happiness + 8);
        showToast('\uC9C1\uC6D0 #' + worker.id + ' \uC5F0\uBD09 ' + counterLevel.toFixed(2) + 'x \uD569\uC758', 'info');
      }
    }
  ];

  for (var c = 0; c < choices.length; c++) {
    (function(choice) {
      var btn = document.createElement('button');
      btn.className = 'event-choice';
      var textEl = document.createElement('span');
      textEl.textContent = choice.text;
      btn.appendChild(textEl);
      var previewEl = document.createElement('span');
      previewEl.className = 'preview';
      previewEl.textContent = choice.preview;
      btn.appendChild(previewEl);
      btn.addEventListener('click', function() {
        choice.apply();
        G.eventActive = false;
        overlay.classList.remove('show');
        G.gSpeed = 1;
        document.getElementById('btn-speed').textContent = '1x';
        updateHUD();
      });
      card.appendChild(btn);
    })(choices[c]);
  }

  overlay.appendChild(card);
  overlay.classList.add('show');
}

      apply: function() {
        G.laborTension = Math.min(100, G.laborTension + 20);

        G.strikeActive = true;
        G.strikeDays = 3;
        showToast('\uAC15\uACBD \uB300\uC751! \uD30C\uC5C5 3\uC77C \uC9C0\uC18D', 'warn');

    },
    {
      text: '\uC804\uBA74 \uC591\uBCF4',
      preview: '$5000 \uBE44\uC6A9, \uB178\uC0AC\uAC08\uB4F1 = 0, \uD589\uBCF5 +25',
      apply: function() {
        if (G.money < 5000) { showToast('\uC790\uAE08\uC774 \uBD80\uC871\uD569\uB2C8\uB2E4!', 'warn'); return; }
        G.money -= 5000;
        G.laborTension = 0;
        G.empHap = Math.min(100, G.empHap + 25);
        G.strikeActive = false;
        G.strikeDays = 0;
        showToast('\uC804\uBA74 \uC591\uBCF4\uB85C \uD30C\uC5C5 \uD574\uACB0 (-$5000)', 'success');

      previewEl.className = 'preview';

      btn.appendChild(previewEl);
      btn.addEventListener('click', function() {
        choice.apply();
        G.eventActive = false;

        document.getElementById('btn-speed').textContent = '1x';
        updateHUD();
      });
      card.appendChild(btn);
    })(choices[c]);
  }

  overlay.appendChild(card);
  overlay.classList.add('show');
}

// QUARTERLY STRATEGY MEETING
// ============================================================
function showStrategyMeeting() {
  if (G.gameOver) return;
  sfxMeeting();
  G.gSpeed = 0; // Pause game during meeting

  var overlay = document.getElementById('strat-overlay');
  while (overlay.firstChild) overlay.removeChild(overlay.firstChild);

  var card = document.createElement('div');
  card.className = 'strat-card';

  var quarter = Math.ceil(G.gDay / 30);
  var alive = G.workers.filter(function(w) { return !w.quitting; });

  // Title
  var title = document.createElement('div');
  title.className = 'strat-title';
  title.textContent = '\uD83D\uDCCB Q' + quarter + ' \uACBD\uC601\uC804\uB7B5\uD68C\uC758';
  card.appendChild(title);

  var sub = document.createElement('div');
  sub.className = 'strat-subtitle';
  sub.textContent = 'Day ' + G.gDay + ' \u2014 \uBD84\uAE30 \uACBD\uC601 \uC131\uACFC \uB9AC\uBDF0';
  card.appendChild(sub);

  // Section 1: Stakeholder metrics with trends
  var sec1 = document.createElement('div');
  sec1.className = 'strat-section';
  var h1 = document.createElement('h4');
  h1.textContent = '\uC774\uD574\uAD00\uACC4\uC790 \uC9C0\uD45C';
  sec1.appendChild(h1);

  var metrics = [
    { label: '\uACE0\uAC1D \uB9CC\uC871', val: Math.round(G.custSat), prev: G.prevCust, color: '#42A5F5' },
    { label: '\uAD6C\uC131\uC6D0 \uD589\uBCF5', val: Math.round(G.empHap), prev: G.prevEmp, color: '#66BB6A' },
    { label: '\uC0AC\uD68C\uC801 \uAC00\uCE58', val: Math.round(G.socVal), prev: G.prevSoc, color: '#26A69A' }
  ];

  for (var i = 0; i < metrics.length; i++) {
    var m = metrics[i];
    var row = document.createElement('div');
    row.className = 'strat-metric';

    var lbl = document.createElement('span');
    lbl.className = 'label';
    lbl.textContent = m.label;
    row.appendChild(lbl);

    var bar = document.createElement('div');
    bar.className = 'bar';
    var fill = document.createElement('div');
    fill.className = 'bar-fill';
    fill.style.width = m.val + '%';
    fill.style.background = m.color;
    bar.appendChild(fill);
    row.appendChild(bar);

    var val = document.createElement('span');
    val.className = 'val';
    val.textContent = m.val;
    row.appendChild(val);

    var diff = m.val - m.prev;
    var trend = document.createElement('span');
    trend.className = 'strat-trend ' + (diff > 2 ? 'up' : diff < -2 ? 'down' : 'flat');
    trend.textContent = diff > 0 ? '\u25B2+' + diff : diff < 0 ? '\u25BC' + diff : '\u25AC 0';
    row.appendChild(trend);

    sec1.appendChild(row);
  }
  card.appendChild(sec1);

  // Section 2: Company status
  var sec2 = document.createElement('div');
  sec2.className = 'strat-section';
  var h2 = document.createElement('h4');
  h2.textContent = '\uD68C\uC0AC \uD604\uD669';
  sec2.appendChild(h2);

  var moneyDiff = G.money - G.prevMoney;
  var workerDiff = alive.length - G.prevWorkerCount;
  var polCount = Object.keys(G.activePolicies).length;

  var stats = [
    { emoji: '\uD83D\uDCB0', text: '\uC790\uAE08: $' + G.money.toLocaleString() + (moneyDiff >= 0 ? ' (\u25B2+$' + moneyDiff.toLocaleString() + ')' : ' (\u25BC$' + moneyDiff.toLocaleString() + ')') },
    { emoji: '\uD83D\uDC65', text: '\uAD6C\uC131\uC6D0: ' + alive.length + '\uBA85' + (workerDiff >= 0 ? ' (+' + workerDiff + ')' : ' (' + workerDiff + ')') },
    { emoji: '\u2B50', text: '\uBCC4\uC810: ' + G.rating.toFixed(1) + ' / 5.0' },
    { emoji: '\uD83D\uDCDC', text: 'SKMS \uC815\uCC45: ' + polCount + '/9 \uD65C\uC131\uD654' }
  ];

  // Type breakdown
  var tc = { ace: 0, rookie: 0, cynic: 0, disengaged: 0, leader: 0 };
  for (var j = 0; j < alive.length; j++) tc[alive[j].type] = (tc[alive[j].type] || 0) + 1;
  stats.push({ emoji: '\uD83D\uDD25', text: '\uC5D0\uC774\uC2A4 ' + (tc.ace||0) + ' / \uC2E0\uC785 ' + (tc.rookie||0) + ' / \uB0C9\uC18C ' + (tc.cynic||0) + ' / \uBB34\uAE30\uB825 ' + (tc.disengaged||0) + ' / \uB9AC\uB354 ' + (tc.leader||0) });

  for (var k = 0; k < stats.length; k++) {
    var item = document.createElement('div');
    item.className = 'strat-agenda-item';
    var em = document.createElement('span');
    em.className = 'emoji';
    em.textContent = stats[k].emoji;
    item.appendChild(em);
    var tx = document.createElement('span');
    tx.textContent = stats[k].text;
    item.appendChild(tx);
    sec2.appendChild(item);
  }
  card.appendChild(sec2);

  // Section 2.5: Performance Evaluation
  var perfGradeSelections = {};
  var secPerf = document.createElement('div');
  secPerf.className = 'strat-section';
  var hPerf = document.createElement('h4');
  hPerf.textContent = '\uC131\uACFC \uD3C9\uAC00';
  secPerf.appendChild(hPerf);

  var perfSub = document.createElement('div');
  perfSub.style.cssText = 'font-size:10px;color:rgba(255,255,255,0.4);margin-bottom:8px';
  perfSub.textContent = '\uAD6C\uC131\uC6D0\uBCC4 \uC131\uACFC \uB4F1\uAE09\uC744 \uD3C9\uAC00\uD558\uC138\uC694. \uC790\uB3D9 \uCD94\uCC9C \uB4F1\uAE09\uC774 \uC120\uD0DD\uB418\uC5B4 \uC788\uC2B5\uB2C8\uB2E4.';
  secPerf.appendChild(perfSub);

  var grades = ['S','A','B','C','D'];
  var typeNames = {ace:'\uC5D0\uC774\uC2A4', rookie:'\uC2E0\uC785', cynic:'\uC2DC\uB2C8\uD06C', disengaged:'\uBC29\uAD00\uC790', leader:'\uB9AC\uB354'};

  function suggestGrade(w) {
    if (w.will > 80 && w.capability > 80) return 'S';
    if (w.will > 60 && w.capability > 60) return 'A';
    if (w.will > 40 && w.capability > 40) return 'B';
    if (w.will > 25 || w.capability > 25) return 'C';
    return 'D';
  }

  for (var pi = 0; pi < alive.length; pi++) {
    (function(w, idx) {
      var suggested = suggestGrade(w);
      perfGradeSelections[w.id] = suggested;

      var row = document.createElement('div');
      row.className = 'perf-row' + (w.pipActive ? ' pip-active' : '');

      var tc = EMP_TYPES[w.type] || EMP_TYPES.disengaged;
      var nameEl = document.createElement('span');
      nameEl.className = 'perf-name';
      nameEl.textContent = tc.emoji + ' #' + w.id;
      row.appendChild(nameEl);

      var deptEl = document.createElement('span');
      deptEl.className = 'perf-dept';
      if (w.assignedDept) {
        var ddef = DEFS[w.assignedDept.type];
        deptEl.textContent = ddef ? ddef.lbl : w.assignedDept.type;
      } else {
        deptEl.textContent = '\uBBF8\uBC30\uC815';
      }
      row.appendChild(deptEl);

      if (w.pipActive) {
        var pipBadge = document.createElement('span');
        pipBadge.className = 'pip-badge';
        pipBadge.textContent = 'PIP';
        row.appendChild(pipBadge);
      }

      var gradesDiv = document.createElement('div');
      gradesDiv.className = 'perf-grades';

      for (var gi = 0; gi < grades.length; gi++) {
        (function(grade) {
          var gBtn = document.createElement('button');
          gBtn.className = 'perf-grade grade-' + grade.toLowerCase();
          if (grade === suggested) gBtn.classList.add('selected');
          gBtn.textContent = grade;
          gBtn.addEventListener('click', function() {
            perfGradeSelections[w.id] = grade;
            var siblings = gradesDiv.querySelectorAll('.perf-grade');
            for (var s = 0; s < siblings.length; s++) siblings[s].classList.remove('selected');
            gBtn.classList.add('selected');
          });
          gradesDiv.appendChild(gBtn);
        })(grades[gi]);
      }
      row.appendChild(gradesDiv);

      secPerf.appendChild(row);
    })(alive[pi], pi);
  }

  card.appendChild(secPerf);

  // Section 3: AI Insights (context-sensitive advice)
  var sec3 = document.createElement('div');
  sec3.className = 'strat-section';
  var h3 = document.createElement('h4');
  h3.textContent = '\uACBD\uC601 \uC9C4\uB2E8 & \uC81C\uC548';
  sec3.appendChild(h3);

  var insights = [];

  if (G.empHap < 30) insights.push({ text: '\uAD6C\uC131\uC6D0 \uD589\uBCF5\uC774 \uC704\uD5D8 \uC218\uC900\uC785\uB2C8\uB2E4. <strong>\uBCF5\uC9C0\uC2DC\uC124 \uAC74\uC124</strong>\uACFC <strong>VWBE \uBB38\uD654 \uB3C4\uC785</strong>\uC744 \uAC80\uD1A0\uD558\uC138\uC694. \uBC29\uCE58\uD558\uBA74 \uB300\uB7C9 \uD1EC\uC0AC\uAC00 \uBC1C\uC0DD\uD569\uB2C8\uB2E4.', priority: 'high' });
  else if (G.empHap < 50) insights.push({ text: '\uAD6C\uC131\uC6D0 \uD589\uBCF5\uC774 \uBCF4\uD1B5 \uC218\uC900\uC785\uB2C8\uB2E4. <strong>\uAD6C\uB0B4\uC2DD\uB2F9</strong>\uC774\uB098 <strong>\uC6F0\uB2C8\uC2A4 \uC13C\uD130</strong>\uB97C \uCD94\uAC00\uD558\uBA74 \uAC1C\uC120\uB429\uB2C8\uB2E4.', priority: 'med' });

  if (G.custSat < 30) insights.push({ text: '\uACE0\uAC1D \uB9CC\uC871\uC774 \uB9E4\uC6B0 \uB0AE\uC2B5\uB2C8\uB2E4. <strong>\uB9C8\uCF00\uD305 \uBD80\uC11C</strong>\uC640 <strong>\uC0DD\uC0B0\uBD80\uC11C</strong>\uC5D0 \uC5D0\uC774\uC2A4 \uC9C1\uC6D0\uC744 \uBC30\uCE58\uD558\uC138\uC694.', priority: 'high' });

  if (G.socVal < 20) insights.push({ text: '\uC0AC\uD68C\uC801 \uAC00\uCE58\uAC00 \uC704\uD5D8 \uC218\uC900\uC785\uB2C8\uB2E4. <strong>\uC0AC\uD68C\uACF5\uD5CC \uBD80\uC11C</strong>\uB97C \uC124\uB9BD\uD558\uACE0 <strong>\uC0AC\uD68C\uC801 \uAC00\uCE58 \uACBD\uC601</strong> \uC815\uCC45\uC744 \uD65C\uC131\uD654\uD558\uC138\uC694.', priority: 'high' });

  if (tc.disengaged > 3) insights.push({ text: '\uBB34\uAE30\uB825 \uAD6C\uC131\uC6D0\uC774 ' + tc.disengaged + '\uBA85\uC73C\uB85C \uB9CE\uC2B5\uB2C8\uB2E4. <strong>\uAD50\uC721\uC6D0</strong>\uACFC <strong>O.J.T \uC815\uCC45</strong>\uC744 \uD1B5\uD574 \uC5ED\uB7C9\uC744 \uD0A4\uC6CC\uC8FC\uC138\uC694.', priority: 'med' });

  if (tc.cynic > 2 && !policyActive('vwbe')) insights.push({ text: '\uB0C9\uC18C\uD30C \uC9C1\uC6D0\uC774 ' + tc.cynic + '\uBA85\uC785\uB2C8\uB2E4. <strong>VWBE \uBB38\uD654</strong>\uB97C \uD65C\uC131\uD654\uD558\uBA74 \uC5D0\uC774\uC2A4\uB85C \uC804\uD658\uB420 \uC218 \uC788\uC2B5\uB2C8\uB2E4.', priority: 'med' });

  if (polCount === 0) insights.push({ text: 'SKMS \uC815\uCC45\uC774 \uD558\uB098\uB3C4 \uD65C\uC131\uD654\uB418\uC9C0 \uC54A\uC558\uC2B5\uB2C8\uB2E4. <strong>\uC131\uACFC \uBCF4\uC0C1 \uCCB4\uACC4</strong>($500)\uBD80\uD130 \uC2DC\uC791\uD574\uBCF4\uC138\uC694.', priority: 'high' });
  else if (polCount >= 3 && !policyActive('supex')) insights.push({ text: '\uC815\uCC45 \uAE30\uBC18\uC774 \uAC16\uCDB0\uC84C\uC2B5\uB2C8\uB2E4. <strong>SUPEX \uCD94\uAD6C</strong>\uB97C \uD65C\uC131\uD654\uD558\uBA74 \uC131\uACFC \uCC9C\uC7A5\uC744 \uB3CC\uD30C\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4.', priority: 'med' });

  if (moneyDiff < -2000) insights.push({ text: '\uC790\uAE08\uC774 \uBE60\uB974\uAC8C \uC904\uACE0 \uC788\uC2B5\uB2C8\uB2E4. \uBD88\uD544\uC694\uD55C \uC9C0\uCD9C\uC744 \uC904\uC774\uACE0 <strong>\uC0DD\uC0B0 \uBD80\uC11C</strong>\uC5D0 \uC9D1\uC911\uD558\uC138\uC694.', priority: 'high' });

  if (G.laborTension > 40) insights.push({ text: '\uB178\uC0AC \uAC08\uB4F1\uC774 \uC2EC\uD654\uB418\uACE0 \uC788\uC2B5\uB2C8\uB2E4. <strong>\uB178\uC0AC\uD611\uC758\uD68C</strong> \uC815\uCC45 \uB3C4\uC785\uC744 \uAC80\uD1A0\uD558\uC138\uC694.', priority: 'high' });

  if (tc.disengaged > tc.ace) agenda.push('\uD83D\uDD25 \uBB34\uAE30\uB825 \uAD6C\uC131\uC6D0 \uD65C\uC131\uD654 \uD504\uB85C\uADF8\uB7A8');

  if (G.money < 5000) agenda.push('\uD83D\uDCB0 \uC7AC\uBB34 \uAC74\uC804\uC131 \uD655\uBCF4');

  var agendaDiv = document.createElement('div');
  agendaDiv.className = 'strat-agenda';
  for (var a = 0; a < agenda.length; a++) {
    var ag = document.createElement('div');
    ag.className = 'strat-agenda-item';
    ag.textContent = agenda[a];

  }

  // Close button
  var closeBtn = document.createElement('button');
  closeBtn.className = 'strat-close';
  closeBtn.textContent = '\uD68C\uC758 \uC885\uB8CC \u2014 \uACBD\uC601 \uC7AC\uAC1C';
  closeBtn.addEventListener('click', function() {
    // Apply performance grade effects
    var gradeCounts = {S:0, A:0, B:0, C:0, D:0};
    var aliveNow = G.workers.filter(function(w) { return !w.quitting; });
    for (var gi = 0; gi < aliveNow.length; gi++) {
      var w = aliveNow[gi];
      var grade = perfGradeSelections[w.id];
      if (!grade) continue;
      gradeCounts[grade]++;
      w.perfGrade = grade;
      if (!w.perfHistory) w.perfHistory = [];
      w.perfHistory.push(grade);
      if (grade === 'S') {
        w.will = Math.min(100, w.will + 10);
        w.happiness = Math.min(100, w.happiness + 15);
        G.money -= 50;
      } else if (grade === 'A') {
        w.will = Math.min(100, w.will + 5);
        w.happiness = Math.min(100, w.happiness + 8);
        G.money -= 30;
      } else if (grade === 'C') {
        w.will = Math.max(0, w.will - 5);
        w.happiness = Math.max(0, w.happiness - 5);
      } else if (grade === 'D') {
        w.will = Math.max(0, w.will - 10);
        w.happiness = Math.max(0, w.happiness - 15);
        if (!w.pipActive) {
          w.pipActive = true;
          w.pipDays = 30;
        }
        G.laborTension = Math.min(100, G.laborTension + 3);
      }
    }
    showToast('\uC131\uACFC \uD3C9\uAC00 \uC644\uB8CC: S ' + gradeCounts.S + '\uBA85, A ' + gradeCounts.A + '\uBA85, B ' + gradeCounts.B + '\uBA85, C ' + gradeCounts.C + '\uBA85, D ' + gradeCounts.D + '\uBA85', 'success');

    overlay.classList.remove('show');
    G.gSpeed = 1;
    // Save current values for next quarter comparison
    G.prevCust = Math.round(G.custSat);
    G.prevEmp = Math.round(G.empHap);
    G.prevSoc = Math.round(G.socVal);
    G.prevMoney = G.money;
    G.prevWorkerCount = alive.length;
    sfxClick();
    document.getElementById('btn-speed').textContent = '1x';
  });
  card.appendChild(closeBtn);

  overlay.appendChild(card);
  overlay.classList.add('show');
}

function getTop3Choices() {
  if (!G.choiceLog || G.choiceLog.length === 0) return [];
  var eventMap = {};
  for (var ei = 0; ei < EVENTS.length; ei++) { eventMap[EVENTS[ei].id] = EVENTS[ei]; }
  var scored = [];
  for (var i = 0; i < G.choiceLog.length; i++) {
    var log = G.choiceLog[i];
    var evtData = eventMap[log.event];
    if (!evtData) continue;
    var impact = i + 1;
    if (log.choice !== 'auto') impact += 10;
    scored.push({log: log, evt: evtData, impact: impact});
  }
  scored.sort(function(a, b) { return b.impact - a.impact; });
  return scored.slice(0, 3);
}

    badBody.textContent = '\uC5B5\uC555\uC801 \uC120\uD0DD\uC774 ' + G.pressureCount + '\uD68C \uBC18\uBCF5\uB418\uC5C8\uC2B5\uB2C8\uB2E4. VWBE \uBB38\uD654\uC640 \uC0C1\uCDA9\uD569\uB2C8\uB2E4.';
    hasBadChoice = true;
    badTag = 'vwbe';
  } else if (!hasBadChoice && G.ignoreCount >= 2) {
    badBody.textContent = '\uBB38\uC81C\uB97C ' + G.ignoreCount + '\uD68C \uBB34\uC2DC\uD588\uC2B5\uB2C8\uB2E4. \uC801\uADF9\uC801\uC778 \uB300\uC751\uC774 \uD544\uC694\uD569\uB2C8\uB2E4.';
    hasBadChoice = true;
    badTag = 'rational';
  }
  if (!hasBadChoice) {
    badBody.textContent = '\uC544\uC26C\uC6B4 \uC810\uC774 \uC5C6\uC2B5\uB2C8\uB2E4. \uD6CC\uB96D\uD55C \uACBD\uC601\uC774\uC5C8\uC2B5\uB2C8\uB2E4!';
    badBody.style.color = 'rgba(255,255,255,0.4)';
  }
  badCard.appendChild(badBody);
  if (hasBadChoice) {
    var suggest = document.createElement('div');
    suggest.style.cssText = 'margin-top:6px;font-size:11px;color:#f59e0b';
    suggest.textContent = '\uD83D\uDCA1 \uD301: \uC774\uBCA4\uD2B8\uC5D0 \uC801\uADF9\uC801\uC73C\uB85C \uB300\uC751\uD558\uACE0, SKMS \uC815\uCC45\uC744 \uD65C\uC131\uD654\uD558\uBA74 \uB354 \uB9CE\uC740 \uC120\uD0DD\uC9C0\uAC00 \uC5F4\uB9BD\uB2C8\uB2E4.';
    badCard.appendChild(suggest);
    var badQuote = findCoachingQuote(badTag || 'vwbe');
    if (badQuote) {
      var bq = document.createElement('div');
      bq.className = 'rpt-quote';
      bq.textContent = badQuote.quote;
      var bqs = document.createElement('span');
      bqs.className = 'rpt-source';
      bqs.textContent = '\u2014 ' + badQuote.source;
      bq.appendChild(bqs);
      badCard.appendChild(bq);
    }
  }
  card.appendChild(badCard);

  // Next try card
  var nextCard = document.createElement('div');
  nextCard.className = 'rpt-coaching-card coaching-next';
  var nextTitleEl = document.createElement('div');
  nextTitleEl.className = 'coaching-title';
  nextTitleEl.textContent = '\uD83D\uDE80 \uB2E4\uC74C\uC5D0 \uC2DC\uB3C4\uD574\uBCF4\uC138\uC694';
  nextCard.appendChild(nextTitleEl);
  var nextBody = document.createElement('div');
  nextBody.className = 'coaching-body';

  var weakest = 'empHap';

  if (G.custSat < weakVal) { weakest = 'custSat'; weakVal = G.custSat; }
  if (G.socVal < weakVal) { weakest = 'socVal'; weakVal = G.socVal; }

  var allHigh = G.custSat >= 70 && G.empHap >= 70 && G.socVal >= 70;

    nextBody.textContent = '\uBAA8\uB4E0 \uC9C0\uD45C\uAC00 \uC6B0\uC218\uD569\uB2C8\uB2E4! \uB2E4\uC74C\uC5D0\uB294 \uB354 \uBE60\uB978 \uC18D\uB3C4\uB85C \uB3C4\uC804\uD574\uBCF4\uC138\uC694.';

    nextBody.textContent = '\uACE0\uAC1D \uB9CC\uC871\uB3C4\uAC00 \uB0AE\uC2B5\uB2C8\uB2E4. R&D \uBD80\uC11C \uAC15\uD654 + \uACE0\uAC1D\uC911\uC2EC \uC815\uCC45\uC744 \uCD94\uCC9C\uD569\uB2C8\uB2E4.';

function getReportText(style, alignment) {
  var won = G.gameWon ? '\uD83C\uDFC6 \uC2B9\uB9AC!' : '\uD83D\uDCC9 \uD328\uBC30';
  var dna = calcDNABreakdown();
  var pLabels = {human_centered:'\uC778\uAC04\uC911\uC2EC', supex:'\uC131\uACFC\uCD94\uAD6C', vwbe:'\uC790\uAE30\uC8FC\uB3C4', social_value:'\uC0AC\uD68C\uAC00\uCE58', rational:'\uD569\uB9AC\uACBD\uC601'};
  var pKeys = ['human_centered','supex','vwbe','social_value','rational'];
  var topP = pKeys.slice().sort(function(a,b){return dna[b]-dna[a];})[0];
  var text = won + ' SKMS Company Builder\n\n'
    + '\uACBD\uC601 \uC2A4\uD0C0\uC77C: ' + style + '\n'
    + 'SKMS \uC815\uD569\uC131: ' + alignment + '%\n'
    + '\uBCC4\uC810: ' + G.rating.toFixed(1) + '\u2B50 | '
    + G.gDay + '\uC77C \uC18C\uC694\n'
    + '\uACBD\uC601 DNA: ' + pLabels[topP] + '\n\n'
    + '\uD83D\uDC65 \uACE0\uAC1D ' + Math.round(G.custSat)
    + ' | \uD83D\uDC9A \uAD6C\uC131\uC6D0 ' + Math.round(G.empHap)
    + ' | \uD83C\uDF0D \uC0AC\uD68C ' + Math.round(G.socVal) + '\n'
    + '\uD83D\uDD25 \uC5D0\uC774\uC2A4 ' + G.totalAceTransitions + '\uBA85'
    + ' | \uD83D\uDC4B \uD1EC\uC0AC ' + G.totalQuits + '\uBA85';
  // Add TOP 3 headlines
  var top3 = getTop3Choices();
  if (top3.length > 0) {
    text += '\n\uD83C\uDFAF TOP: ';
    for (var i = 0; i < top3.length; i++) {
      if (i > 0) text += ', ';
      var h = top3[i].evt.headline;
      text += h.length > 15 ? h.substring(0, 15) + '..' : h;
    }
  }
  text += '\n\n#SKMSCompanyBuilder #SKMS\uACBD\uC601\uCCB4\uACC4';
  return text;
}

function shareTwitter(style, alignment) {
  var text = getReportText(style, alignment);
  var url = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text);
  window.open(url, '_blank', 'width=600,height=400');
}

function shareLinkedIn(style, alignment) {
  var text = getReportText(style, alignment);
  var url = 'https://www.linkedin.com/sharing/share-offsite/?url=' + encodeURIComponent('https://skmsai.netlify.app/parktycoon.html')
    + '&summary=' + encodeURIComponent(text);
  window.open(url, '_blank', 'width=600,height=500');
}

function copyReportText(style, alignment) {
  var text = getReportText(style, alignment);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() {
      showToast('\uD074\uB9BD\uBCF4\uB4DC\uC5D0 \uBCF5\uC0AC\uB418\uC5C8\uC2B5\uB2C8\uB2E4!', 'success');
    });
  } else {
    // Fallback for older browsers
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('\uD074\uB9BD\uBCF4\uB4DC\uC5D0 \uBCF5\uC0AC\uB418\uC5C8\uC2B5\uB2C8\uB2E4!', 'success');
  }
}

function getManagementStyle() {
  var polCount = Object.keys(G.activePolicies).length;
  if (polCount >= 7 && G.empHap >= 70 && G.socVal >= 50) return '\uC774\uD574\uAD00\uACC4\uC790 \uC911\uC2EC \uACBD\uC601\uC790';
  if (G.custSat >= 70 && G.empHap < 50) return '\uC131\uACFC \uC911\uC2EC \uC2E4\uC6A9\uC8FC\uC758\uC790';
  if (G.socVal >= 60) return '\uC0AC\uD68C\uC801 \uAC00\uCE58 \uACBD\uC601\uC790';
  if (G.empHap >= 60) return '\uAD6C\uC131\uC6D0 \uD589\uBCF5 \uC6B0\uC120 \uACBD\uC601\uC790';
  if (polCount >= 4) return '\uADE0\uD615 \uC7A1\uD78C \uACBD\uC601\uC790';
  return '\uC0DD\uC874 \uC911\uC2EC \uACBD\uC601\uC790';
}

function calcSKMSBreakdown() {
  var result = {human_centered:0, supex:0, vwbe:0, social_value:0, rational:0, overall:0};
  if (!G.skmsChoices || G.skmsChoices.length === 0) {
    // Fallback for early game: use policy count
    var score = Object.keys(G.activePolicies).length * 8;
    if (G.empHap > 70) score += 10;
    if (G.totalQuits <= 2) score += 5;
    score -= G.ignoreCount * 8;
    result.overall = clamp(0, 100, score);
    return result;
  }
  var totalTagged = 0;
  var tagCounts = {human_centered:0, supex:0, vwbe:0, social_value:0, rational:0};
  for (var i = 0; i < G.skmsChoices.length; i++) {
    var t = G.skmsChoices[i].tag;
    if (tagCounts[t] !== undefined) {
      tagCounts[t]++;
      totalTagged++;
    }
  }
  if (totalTagged === 0) {
    result.overall = clamp(0, 100, Object.keys(G.activePolicies).length * 8);
    return result;
  }
  // Each of 5 principles has equal weight (20%)
  var principles = ['human_centered', 'supex', 'vwbe', 'social_value', 'rational'];
  var principleScore = 0;
  for (var p = 0; p < principles.length; p++) {
    // 1 choice=33%, 2=66%, 3+=100% for that principle
    var pScore = Math.min(100, tagCounts[principles[p]] * 33);
    result[principles[p]] = pScore;
    principleScore += pScore * 0.2;
  }
  // Bonus for policy count (minor)
  principleScore += Math.min(15, Object.keys(G.activePolicies).length * 2);
  // Penalty for ignoring events
  principleScore -= G.ignoreCount * 5;
  result.overall = clamp(0, 100, Math.round(principleScore));
  return result;
}

function calcDNABreakdown() {
  var bd = calcSKMSBreakdown();
  return {human_centered: bd.human_centered, supex: bd.supex, vwbe: bd.vwbe, social_value: bd.social_value, rational: bd.rational};
}

function calcSKMSAlignment() {
  return calcSKMSBreakdown().overall;
}

function showTutorial() {
  var steps = G.scenario === 2 ? TUTORIAL_STEPS_S2 : TUTORIAL_STEPS;
  if (G.tutDone || G.tutStep >= steps.length) return;
  var el = document.getElementById('tutorial');
  while (el.firstChild) el.removeChild(el.firstChild);

  var step = document.createElement('div');
  step.className = 'step';
  step.textContent = 'Step ' + (G.tutStep + 1) + '/' + steps.length;
  el.appendChild(step);

  var msg = document.createElement('div');
  msg.className = 'msg';
  msg.textContent = steps[G.tutStep];
  el.appendChild(msg);

  var dismiss = document.createElement('div');
  dismiss.className = 'dismiss';
  dismiss.textContent = '\uC54C\uACA0\uC2B5\uB2C8\uB2E4 \u2192';
  dismiss.addEventListener('click', function() {
    G.tutStep++;
    var curSteps = G.scenario === 2 ? TUTORIAL_STEPS_S2 : TUTORIAL_STEPS;
    if (G.tutStep >= curSteps.length) {
      G.tutDone = true;
      el.classList.remove('show');

  });
  el.appendChild(dismiss);

  el.classList.add('show');
}

canvas.addEventListener('mousedown', function(e) {
  initAudio();
  if (e.button === 0) {
    G.drag = true;
    G.dragStart = {x: e.clientX, y: e.clientY};
    G.camStart = {x: G.camX, y: G.camY};
  }
});

canvas.addEventListener('mousemove', function(e) {
  G.mouseX = e.clientX;
  G.mouseY = e.clientY;
  var grd = toGrd(e.clientX, e.clientY);
  G.mouseGX = grd.x;
  G.mouseGY = grd.y;

  if (G.drag) {
    var dx = e.clientX - G.dragStart.x;
    var dy = e.clientY - G.dragStart.y;
    G.camX = G.camStart.x + dx;
    G.camY = G.camStart.y + dy;
  }
});

canvas.addEventListener('mouseup', function(e) {
  if (!G.drag) return;
  var dx = Math.abs(e.clientX - G.dragStart.x);
  var dy = Math.abs(e.clientY - G.dragStart.y);
  G.drag = false;

  // Only act if not dragging (click)
  if (dx < 5 && dy < 5) {
    handleClick(e.clientX, e.clientY);
  }
});

canvas.addEventListener('wheel', function(e) {
  e.preventDefault();
  var oldZm = G.zm;
  G.zm = clamp(0.3, 3, G.zm - e.deltaY * 0.001);
  // Zoom toward mouse
  var ratio = G.zm / oldZm;
  G.camX = e.clientX - (e.clientX - G.camX) * ratio;
  G.camY = e.clientY - (e.clientY - G.camY) * ratio;
}, {passive: false});

function openDeptPanel(bldg) {

  title.className = 'dept-title';

  card.appendChild(subtitle);

  var sections = document.createElement('div');

    el.appendChild(stats);

    el.addEventListener('dragstart', function(e) {
      e.dataTransfer.setData('text/plain', String(w.id));
      el.classList.add('dragging');
    });
    el.addEventListener('dragend', function() {
      el.classList.remove('dragging');
    });
    return el;
  }

  function makeSection(titleText, workers, dropTarget) {
    var sec = document.createElement('div');
    sec.className = 'dept-section';
    var secTitle = document.createElement('div');
    secTitle.className = 'dept-section-title';
    secTitle.textContent = titleText + ' (' + workers.length + '\uBA85)';
    sec.appendChild(secTitle);

    for (var i = 0; i < workers.length; i++) {
      sec.appendChild(makeWorkerCard(workers[i]));

    sec.addEventListener('dragover', function(e) {
      e.preventDefault();
      sec.classList.add('drag-over');
    });
    sec.addEventListener('dragleave', function() {
      sec.classList.remove('drag-over');
    });
    sec.addEventListener('drop', function(e) {
      e.preventDefault();
      sec.classList.remove('drag-over');
      var wid = parseInt(e.dataTransfer.getData('text/plain'));
      var worker = G.workers.find(function(w) { return w.id === wid; });

      if (dropTarget === null) {

        worker.assignedDept = {gx: dropTarget.gx, gy: dropTarget.gy, type: dropTarget.type};

  overlay.appendChild(card);
  overlay.classList.add('show');

  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) overlay.classList.remove('show');
  });

function handleClick(cx, cy) {
  var grd = toGrd(cx, cy);
  var gx = grd.x, gy = grd.y;
  if (!inBounds(gx, gy)) return;

  if (G.selTool === 'bulldoze') {
    bulldoze(gx, gy);
    return;
  }

  if (G.selTool && DEFS[G.selTool]) {
    placeBuild(gx, gy, G.selTool);
    return;
  }

  // Click on worker?
  var closest = null, closestDist = 999;
  for (var i = 0; i < G.workers.length; i++) {
    var w = G.workers[i];
    if (w.quitting) continue;
    var dx = w.x - gx, dy = w.y - gy;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 3.0 && dist < closestDist) {
      closest = w;
      closestDist = dist;
    }
  }
  if (closest) {
    openMeeting(closest);
    return;
  }

  // Click on department building?
  if (G.grid[gy] && G.grid[gy][gx]) {
    var bType = G.grid[gy][gx].type;
    var bDef = DEFS[bType];
    if (bDef && bDef.cat === 'dept') {
      var bldg = G.bldgs.find(function(b) { return b.gx === gx && b.gy === gy; });
      if (bldg) openDeptPanel(bldg);
    }
  }
}

function placeBuild(gx, gy, type) {
  if (G.grid[gy][gx]) {
    sfxErr();
    var existing = DEFS[G.grid[gy][gx].type];
    showToast('\uC774\uBBF8 ' + (existing ? existing.lbl : '\uAC74\uBB3C') + '\uC774(\uAC00) \uC788\uC2B5\uB2C8\uB2E4. \uBE48 \uD0C0\uC77C\uC5D0 \uBC30\uCE58\uD558\uC138\uC694!', 'warn');
    return;
  }
  var def = DEFS[type];
  if (G.money < def.cost) {
    sfxErr();
    showToast('\uB3C8\uC774 \uBD80\uC871\uD569\uB2C8\uB2E4!', 'warn');
    return;
  }
  // Save undo
  G.undoStack.push({action:'build', x:gx, y:gy, type:type});
  G.redoStack = [];

  G.money -= def.cost;
  G.grid[gy][gx] = {type: type};
  G.bldgs.push({type: type, gx: gx, gy: gy});

    // Connection warning for departments and facilities
    if (def.cat === 'dept' || def.cat === 'facility') {
      var dirs = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
      var connected = false;
      for (var d = 0; d < dirs.length; d++) {
        var nx = gx + dirs[d].x, ny = gy + dirs[d].y;
        if (nx >= 0 && ny >= 0 && nx < GRID && ny < GRID) {
          var adj = G.grid[ny][nx];
          if (adj && (adj.type === 'corridor' || adj.type === 'hq')) { connected = true; break; }
        }
      }
      if (!connected) showToast('\u26A0 \uBCF5\uB3C4\uC640 \uC5F0\uACB0\uB418\uC9C0 \uC54A\uC558\uC2B5\uB2C8\uB2E4!', 'warn');
    }

  sfxPlace();
  saveGame();

  // Check welfare buildings for speech trigger
  if (type === 'cafeteria' || type === 'wellness') {
    G.welfareJustBuilt = true;
    G.welfareTimer = 300;
  }

  updateHUD();
  renderPolicyPanel();
}

function bulldoze(gx, gy) {
  var cell = G.grid[gy][gx];
  if (!cell || cell.type === 'hq') {
    sfxErr();
    return;
  }
  var def = DEFS[cell.type];
  var refund = def ? Math.floor(def.cost * 0.5) : 0;

  G.undoStack.push({action:'bulldoze', x:gx, y:gy, type:cell.type});
  G.redoStack = [];

  G.grid[gy][gx] = null;
  for (var i = G.bldgs.length - 1; i >= 0; i--) {
    if (G.bldgs[i].gx === gx && G.bldgs[i].gy === gy) {
      G.bldgs.splice(i, 1);
      break;
    }
  }
  G.money += refund;
  sfxDel();
  showToast('\uCCA0\uAC70 (+$' + refund + ')', 'info');
  updateHUD();
  renderPolicyPanel();
}

// Undo/Redo
document.addEventListener('keydown', function(e) {
  if (e.code === 'Space' && !e.metaKey && !e.ctrlKey) {
    e.preventDefault();
    if (G.gSpeed === 0) { G.gSpeed = 1; showToast('Resumed', 'info'); }
    else { G.gSpeed = 0; showToast('Paused', 'info'); }
    var sBtn = document.getElementById('btn-speed');
    if (sBtn) sBtn.textContent = G.gSpeed === 0 ? '||' : G.gSpeed + 'x';
  }
  if (e.ctrlKey && e.key === 'z' && !e.shiftKey) {
    e.preventDefault();
    undoAction();
  }
  if (e.ctrlKey && e.shiftKey && (e.key === 'z' || e.key === 'Z')) {
    e.preventDefault();
    redoAction();
  }
  if (e.key === 'Escape') {
    document.getElementById('hire-panel').classList.remove('open');
    document.getElementById('mgmt-panel').classList.remove('open');
  }
});

function undoAction() {
  if (G.undoStack.length === 0) return;
  var action = G.undoStack.pop();
  G.redoStack.push(action);
  if (action.action === 'build') {
    // Remove building
    G.grid[action.y][action.x] = null;
    for (var i = G.bldgs.length - 1; i >= 0; i--) {
      if (G.bldgs[i].gx === action.x && G.bldgs[i].gy === action.y) {
        G.bldgs.splice(i, 1); break;
      }
    }
    G.money += DEFS[action.type].cost;
  } else if (action.action === 'bulldoze') {
    // Restore building
    G.grid[action.y][action.x] = {type: action.type};
    G.bldgs.push({type: action.type, gx: action.x, gy: action.y});
    G.money -= Math.floor(DEFS[action.type].cost * 0.5);
  }
  updateHUD();
  showToast('Undo', 'info');
}

function redoAction() {
  if (G.redoStack.length === 0) return;
  var action = G.redoStack.pop();
  G.undoStack.push(action);
  if (action.action === 'build') {
    G.grid[action.y][action.x] = {type: action.type};
    G.bldgs.push({type: action.type, gx: action.x, gy: action.y});
    G.money -= DEFS[action.type].cost;
  } else if (action.action === 'bulldoze') {
    G.grid[action.y][action.x] = null;
    for (var i = G.bldgs.length - 1; i >= 0; i--) {
      if (G.bldgs[i].gx === action.x && G.bldgs[i].gy === action.y) {
        G.bldgs.splice(i, 1); break;
      }
    }
    G.money += Math.floor(DEFS[action.type].cost * 0.5);
  }
  updateHUD();
  showToast('Redo', 'info');
}

var lastTime = 0;
function gameLoop(ts) {
  var dt = ts - lastTime;
  lastTime = ts;

  if (!G.gameOver) {
    G.tickAccum += dt;
    while (G.tickAccum >= 1000 / 60) {
      G.tickAccum -= 1000 / 60;
      gameTick();
    }
    // Update HUD periodically
    if (Math.floor(ts / 500) !== Math.floor((ts - dt) / 500)) {
      updateHUD();
      // Update policy progress bars
      if (G.policyOpen && Object.keys(G.activatingPolicies).length > 0) {
        renderPolicyPanel();
      }
    }
  }

  render();
  requestAnimationFrame(gameLoop);
}

  var beforeChars = [
    {col:'#BDBDBD',size:0.7,label:'\uBB34\uAE30\uB825',bubble:'\uB9E4\uC77C \uB611\uAC19\uC740 \uD558\uB8E8...'},
    {col:'#78909C',size:0.9,label:'\uB0C9\uC18C\uD30C',bubble:'\uD574\uBD24\uC790 \uB2EC\uB77C\uC9C0\uB294 \uAC74 \uC5C6\uC5B4'},
    {col:'#66BB6A',size:0.6,label:'\uC2E0\uC785',bubble:'\uBB50\uBD80\uD130 \uD574\uC57C \uD560\uC9C0...'}
  ];
  var successChars = [
    {col:'#66BB6A',size:0.8,label:'\uD68C\uBCF5',bubble:'\uB2E4\uC2DC \uD574\uBCFC\uAC8C\uC694!'},
    {col:'#FF7043',size:1.0,label:'\uC5D0\uC774\uC2A4',bubble:'\uC131\uACFC \uB0B4\uACE0 \uC788\uC5B4\uC694!'},
    {col:'#FFD54F',size:1.2,label:'\uB9AC\uB354',bubble:'SUPEX \uCD94\uAD6C!'}
  ];
  var failChars = [
    {col:'#BDBDBD',size:0.5,label:'\uD1F4\uC0AC',bubble:'\uB354\uB294 \uBABB\uD558\uACA0\uC5B4\uC694...'},
    {col:'#9E9E9E',size:0.4,label:'\uC794\uB958',bubble:'...'}
  ];
  var previewFrame = 0;
  var speakingIdx = 0;
  var speakTimer = 0;
  var speakDuration = 120;

  function drawIsoChar(ctx, cx, cy, ch, isSpeaking, isDark) {
    var sc = ch.size;
    var bobble = Math.sin(previewFrame * 0.025 + cx * 0.01) * 3;
    var baseAlpha = isDark ? 0.55 : 1.0;
    var bY = cy + bobble; // base Y with bobble

    // Ground shadow (isometric ellipse)
    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    ctx.beginPath();
    ctx.ellipse(cx, cy + 26 * sc, 18 * sc, 6 * sc, 0, 0, Math.PI * 2);
    ctx.fill();

    // Leader golden glow
    if (sc >= 1.2) {
      ctx.save();
      var grd = ctx.createRadialGradient(cx, bY - 6 * sc, 0, cx, bY - 6 * sc, 26 * sc);
      grd.addColorStop(0, 'rgba(255,213,79,0.35)');
      grd.addColorStop(1, 'rgba(255,213,79,0)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(cx, bY - 6 * sc, 26 * sc, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    ctx.globalAlpha = baseAlpha;

    // Legs (two small rods)
    ctx.strokeStyle = ch.col;
    ctx.lineWidth = 2.5 * sc;
    ctx.lineCap = 'round';
    var legSpread = 5 * sc;
    var legTop = bY + 10 * sc;
    var legBot = bY + 20 * sc;
    ctx.beginPath();
    ctx.moveTo(cx - legSpread, legTop); ctx.lineTo(cx - legSpread - 1, legBot);
    ctx.moveTo(cx + legSpread, legTop); ctx.lineTo(cx + legSpread + 1, legBot);
    ctx.stroke();

    // Shoes
    ctx.fillStyle = isDark ? '#777' : '#444';
    ctx.beginPath();
    ctx.ellipse(cx - legSpread - 1, legBot + 1, 4 * sc, 2 * sc, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + legSpread + 1, legBot + 1, 4 * sc, 2 * sc, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body (rounded torso)
    ctx.fillStyle = ch.col;
    ctx.beginPath();
    ctx.ellipse(cx, bY + 2 * sc, 13 * sc, 14 * sc, 0, 0, Math.PI * 2);
    ctx.fill();
    // Body outline
    ctx.strokeStyle = 'rgba(0,0,0,0.12)';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    // Arms
    ctx.strokeStyle = ch.col;
    ctx.lineWidth = 2.5 * sc;
    ctx.lineCap = 'round';
    var armWave = Math.sin(previewFrame * 0.04 + cx * 0.02) * 4;
    // Left arm
    ctx.beginPath();
    ctx.moveTo(cx - 12 * sc, bY - 2 * sc);
    ctx.lineTo(cx - 18 * sc, bY + 6 * sc + armWave);
    ctx.stroke();
    // Right arm
    ctx.beginPath();
    ctx.moveTo(cx + 12 * sc, bY - 2 * sc);
    ctx.lineTo(cx + 18 * sc, bY + 6 * sc - armWave);
    ctx.stroke();

  // selectScenario toggles active class
  function selectScenario(num) {
    selectedScenario = num;
    if (num === 1) {
      sc1.className = 'sc-card-new active';
      sc2.className = 'sc-card-new';

  sc1.addEventListener('click', function() { selectScenario(1); });

  slides.push(s2);

  // Add slides to container
  for (var si = 0; si < slides.length; si++) slideContainer.appendChild(slides[si]);
  card.appendChild(slideContainer);

  // ── Navigation: dots + prev/next ──
  var nav = document.createElement('div');
  nav.className = 'onboard-nav';

  var prevBtn = document.createElement('button');
  prevBtn.className = 'onboard-nav-btn';
  prevBtn.textContent = '\u2190 \uC774\uC804';
  prevBtn.style.visibility = 'hidden';

  var dots = [];
  for (var di = 0; di < slides.length; di++) {
    var dot = document.createElement('button');
    dot.className = 'onboard-dot' + (di === 0 ? ' active' : '');
    (function(idx) {
      dot.addEventListener('click', function() { goToSlide(idx); });
    })(di);
    dots.push(dot);
  }

  var nextBtn = document.createElement('button');
  nextBtn.className = 'onboard-nav-btn primary';
  nextBtn.textContent = '\uB2E4\uC74C \u2192';

  // Start game function (shared by nav button and start button)
  function startNewGame() {
    stopOnboardingBGM();
    initAudio(); startBGM(); sfxPlace();
    clearSave();
    G = createInitialState();
    if (selectedScenario === 2) { setupAIScenario(); } else { setupCrisisScenario(); }
    buildTopBar(); buildControlsHUD(); buildHistoryPanel(); buildBuildPanel(); buildPolicyToggle(); renderPolicyPanel(); centerCamera(); updateHUD();
    if(previewRAF)cancelAnimationFrame(previewRAF);overlay.removeChild(card); overlay.remove();
    G.gSpeed = 1;
    var sb = document.getElementById('btn-speed'); if (sb) sb.textContent = '1x';
    showTutorial();
  }

  function goToSlide(idx) {
    slides[currentSlide].className = 'onboard-slide';
    dots[currentSlide].className = 'onboard-dot';
    currentSlide = idx;
    slides[currentSlide].className = 'onboard-slide active';
    dots[currentSlide].className = 'onboard-dot active';
    prevBtn.style.visibility = currentSlide === 0 ? 'hidden' : 'visible';
    // Last slide: show start buttons in nav
    if (currentSlide === slides.length - 1) {
      nextBtn.textContent = '\uD83C\uDFAC \uACBD\uC601 \uC2DC\uC791!';
      nextBtn.style.background = '#0052A2';
      nextBtn.style.color = '#fff';
      if (navContBtn) navContBtn.style.display = '';
    } else {
      nextBtn.textContent = '\uB2E4\uC74C \u2192';
      nextBtn.style.background = '';
      nextBtn.style.color = '';
      if (navContBtn) navContBtn.style.display = 'none';
    }
    // Re-trigger Slide 2 entrance
    if (idx === 1) {
      sc1.style.opacity = '0'; sc1.style.animation = 'fadeInUp 0.4s ease-out 0.1s forwards';
      sc2.style.opacity = '0'; sc2.style.animation = 'fadeInUp 0.4s ease-out 0.2s forwards';
      playStrip.style.opacity = '0'; playStrip.style.animation = 'fadeInUp 0.3s ease-out 0.4s forwards';
    }
    card.scrollTop = 0;
  }

  prevBtn.addEventListener('click', function() { if (currentSlide > 0) goToSlide(currentSlide - 1); });
  nextBtn.addEventListener('click', function() {
    if (currentSlide < slides.length - 1) {
      goToSlide(currentSlide + 1);
    } else {
      startNewGame();
    }
  });

  // Continue button in nav (only if save exists)
  var navContBtn = null;
  if (saveInfo) {
    navContBtn = document.createElement('button');
    navContBtn.className = 'onboard-nav-btn';
    navContBtn.style.cssText = 'background:var(--green);color:#1a1a2e;font-weight:800;display:none;';
    navContBtn.textContent = '\u25B6 \uC774\uC5B4\uD558\uAE30 Day ' + saveInfo.gDay;
    navContBtn.addEventListener('click', function() {
      stopOnboardingBGM();
      initAudio(); startBGM();
      G = createInitialState();
      loadGame(saveInfo);
      if(previewRAF)cancelAnimationFrame(previewRAF);
      overlay.remove();
      buildTopBar(); buildControlsHUD(); buildHistoryPanel(); buildBuildPanel(); buildPolicyToggle(); renderPolicyPanel(); centerCamera(); updateHUD();
      G.gSpeed = 1;
      var sBtn = document.getElementById('btn-speed'); if (sBtn) sBtn.textContent = '1x';
      showToast('Day ' + G.gDay + '\uBD80\uD130 \uC774\uC5B4\uC11C \uD50C\uB808\uC774\uD569\uB2C8\uB2E4.', 'success');
    });
  }

  nav.appendChild(prevBtn);
  for (var ni = 0; ni < dots.length; ni++) nav.appendChild(dots[ni]);
  if (navContBtn) nav.appendChild(navContBtn);
  nav.appendChild(nextBtn);
  card.appendChild(nav);

  overlay.appendChild(card);
}

// ============================================================
// MOBILE TOUCH SUPPORT
// ============================================================
var touchDragStart = null, touchCamStart = null, lastPinchDist = 0;
canvas.addEventListener('touchstart', function(e) {
  e.preventDefault(); initAudio();
  if (e.touches.length === 1) {
    var t = e.touches[0];
    G.mouseX = t.clientX; G.mouseY = t.clientY;
    var g = toGrd(t.clientX, t.clientY);
    G.mouseGX = g.x; G.mouseGY = g.y;
    touchDragStart = {x: t.clientX, y: t.clientY};
    touchCamStart = {x: G.camX, y: G.camY};
  }
}, {passive: false});

canvas.addEventListener('touchmove', function(e) {
  e.preventDefault();
  if (e.touches.length === 2) {
    var dx = e.touches[0].clientX - e.touches[1].clientX;
    var dy = e.touches[0].clientY - e.touches[1].clientY;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (lastPinchDist > 0) {
      var scale = dist / lastPinchDist;
      var oldZm = G.zm;
      G.zm = clamp(0.3, 3, G.zm * scale);
      var mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      var my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      G.camX = mx - (mx - G.camX) * (G.zm / oldZm);
      G.camY = my - (my - G.camY) * (G.zm / oldZm);
    }
    lastPinchDist = dist;
    touchDragStart = null;
    return;
  }
  if (e.touches.length === 1 && touchDragStart) {
    var t = e.touches[0];
    G.mouseX = t.clientX; G.mouseY = t.clientY;
    var g = toGrd(t.clientX, t.clientY);
    G.mouseGX = g.x; G.mouseGY = g.y;
    G.camX = touchCamStart.x + (t.clientX - touchDragStart.x);
    G.camY = touchCamStart.y + (t.clientY - touchDragStart.y);
  }
}, {passive: false});

canvas.addEventListener('touchend', function(e) {
  lastPinchDist = 0;
  if (touchDragStart && e.changedTouches.length === 1) {
    var t = e.changedTouches[0];
    var dx = Math.abs(t.clientX - touchDragStart.x);
    var dy = Math.abs(t.clientY - touchDragStart.y);
    if (dx < 10 && dy < 10) {
      handleClick(t.clientX, t.clientY);
    }
  }
  touchDragStart = null;
}, {passive: false});

// ============================================================
// LOCALSTORAGE SAVE / LOAD
// ============================================================
function saveGame() {
  try {
    var save = {
      v: 3, scenario: G.scenario, money: G.money,
      gDay: G.gDay, gTime: G.gTime,
      custSat: G.custSat, empHap: G.empHap, socVal: G.socVal,
      rating: G.rating, ratingBonus: G.ratingBonus || 0,
      laborTension: G.laborTension || 0,
      winDays: G.winDays || 0,
      activePolicies: G.activePolicies,
      ignoreCount: G.ignoreCount, pressureCount: G.pressureCount,
      totalAceTransitions: G.totalAceTransitions,
      totalCynicRecoveries: G.totalCynicRecoveries,
      totalQuits: G.totalQuits,
      totalLeaderPromotions: G.totalLeaderPromotions,
      choiceLog: (G.choiceLog || []).slice(-10),
      skmsChoices: (G.skmsChoices || []).slice(-20),
      pendingFollowups: G.pendingFollowups || [],
      compStrategy: G.compStrategy || null,
      bldgs: G.bldgs.map(function(b) { return {t: b.type, x: b.gx, y: b.gy}; }),
      workers: G.workers.filter(function(w) { return !w.quitting; }).map(function(w) {
        return {id: w.id, t: w.type, w: Math.round(w.will), c: Math.round(w.capability),
                h: Math.round(w.happiness), ad: w.assignedDept, sl: w.salaryLevel || 1,
                pg: w.perfGrade, ph: w.perfHistory || [], pip: w.pipActive || false,
                ob: w.onboardDays || 0};
      }),
      ts: Date.now()
    };
    localStorage.setItem('skms_save', JSON.stringify(save));
  } catch (e) { /* quota exceeded or private mode */ }
}

function hasSavedGame() {
  try {
    var d = localStorage.getItem('skms_save');
    if (!d) return null;
    var s = JSON.parse(d);
    if (s.v !== 2 && s.v !== 3) return null;
    return s;
  } catch (e) { return null; }
}

function loadGame(save) {
  G.scenario = save.scenario || 1;
  G.money = save.money;
  G.gDay = save.gDay; G.gTime = save.gTime;
  G.custSat = save.custSat; G.empHap = save.empHap; G.socVal = save.socVal;
  G.rating = save.rating; G.ratingBonus = save.ratingBonus || 0;
  G.laborTension = save.laborTension || 0;
  G.winDays = save.winDays || 0;
  G.activePolicies = save.activePolicies || {};
  G.ignoreCount = save.ignoreCount || 0;
  G.pressureCount = save.pressureCount || 0;
  G.totalAceTransitions = save.totalAceTransitions || 0;
  G.totalCynicRecoveries = save.totalCynicRecoveries || 0;
  G.totalQuits = save.totalQuits || 0;
  G.totalLeaderPromotions = save.totalLeaderPromotions || 0;
  G.choiceLog = save.choiceLog || [];
  G.skmsChoices = save.skmsChoices || [];
  G.pendingFollowups = save.pendingFollowups || [];
  G.compStrategy = save.compStrategy || null;
  G.emojiReactions = [];
  // Rebuild grid
  for (var y = 0; y < GRID; y++) for (var x = 0; x < GRID; x++) G.grid[y][x] = null;
  var cx = Math.floor(GRID / 2), cy = Math.floor(GRID / 2);
  G.grid[cy][cx] = {type: 'hq'};
  G.bldgs = [];
  for (var i = 0; i < save.bldgs.length; i++) {
    var b = save.bldgs[i];
    if (inBounds(b.x, b.y)) {
      G.grid[b.y][b.x] = {type: b.t};
      G.bldgs.push({type: b.t, gx: b.x, gy: b.y});
    }
  }
  // Restore workers
  G.workers = [];
  for (var j = 0; j < save.workers.length; j++) {
    var wd = save.workers[j];
    G.workerID++;
    G.workers.push({
      id: wd.id || G.workerID,
      x: cx + (Math.random() - 0.5) * 2, y: cy + (Math.random() - 0.5) * 2,
      type: wd.t, will: wd.w, capability: wd.c, happiness: wd.h,
      path: [], pathIdx: 0, state: 'idle', stateTimer: 0,
      bubble: '', bubbleTimer: 0, dept: null,
      assignedDept: wd.ad || null,
      fadeOut: 1, quitting: false, preventQuitDays: 0,
      onboardDays: wd.ob || 0, hunger: 0,
      salaryLevel: wd.sl || 1, lastRaiseDay: 0, quitTimer: 0,
      perfGrade: wd.pg || null, perfHistory: wd.ph || [],
      pipActive: wd.pip || false, pipDays: 0
    });
  }
}

function clearSave() {
  try { localStorage.removeItem('skms_save'); } catch (e) {}
}

function saveRanking() {
  try {
    var list = JSON.parse(localStorage.getItem('skms_ranks') || '[]');
    list.push({
      d: new Date().toISOString().slice(0, 10),
      sc: G.scenario, won: G.gameWon,
      day: G.gDay, r: G.rating,
      a: calcSKMSAlignment(), st: getManagementStyle(),
      c: Math.round(G.custSat), e: Math.round(G.empHap), s: Math.round(G.socVal),
      q: G.totalQuits, ac: G.totalAceTransitions
    });
    if (list.length > 20) list = list.slice(-20);
    localStorage.setItem('skms_ranks', JSON.stringify(list));
  } catch (e) {}
}

// Auto-save every 30 seconds
setInterval(function() { if (!G.gameOver && G.gSpeed > 0) saveGame(); }, 30000);
