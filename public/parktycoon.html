<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKMS Company Builder</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --hud-bg:rgba(18,18,30,0.88);
  --hud-border:rgba(255,255,255,0.08);
  --accent:#FFB830;
  --green:#4ADE80;
  --red:#F87171;
  --blue:#60A5FA;
  --cust:#42A5F5;
  --emp:#66BB6A;
  --soc:#26A69A;
}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#e8e8f0}
canvas{display:block;cursor:default}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
#ui>*{pointer-events:auto}

/* Top bar */
.topbar{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--hud-bg);backdrop-filter:blur(12px);border-bottom:1px solid var(--hud-border);flex-wrap:wrap}
.topbar .logo{font-weight:800;font-size:16px;color:var(--accent);letter-spacing:-0.5px;white-space:nowrap}
.topbar .logo small{font-size:10px;color:rgba(255,255,255,0.4);font-weight:500;margin-left:4px}
.topbar .stat{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:8px;background:rgba(255,255,255,0.06)}
.topbar .stat .val{font-variant-numeric:tabular-nums}
.topbar .stat.money .val{color:var(--green)}
.topbar .stat.rating .val{color:#FBBF24}
.topbar .stat .val.cust{color:var(--cust)}
.topbar .stat .val.emp{color:var(--emp)}
.topbar .stat .val.soc{color:var(--soc)}
.topbar .time-display{margin-left:auto;display:flex;align-items:center;gap:8px}
.topbar .day{font-size:11px;color:rgba(255,255,255,0.5)}
.topbar .clock{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.speed-btn{background:rgba(255,255,255,0.08);border:1px solid var(--hud-border);color:#fff;border-radius:6px;padding:3px 10px;font-size:12px;cursor:pointer;font-weight:600;transition:all .15s}
.speed-btn:hover,.speed-btn.active{background:var(--accent);color:#1a1a2e;border-color:var(--accent)}

.back-btn{background:none;border:1px solid var(--hud-border);color:rgba(255,255,255,0.5);border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer;text-decoration:none;font-weight:500;transition:all .15s}
.back-btn:hover{color:#fff;border-color:rgba(255,255,255,0.3)}

/* Build panel */
.build-panel{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 14px 10px;background:var(--hud-bg);backdrop-filter:blur(12px);border:1px solid var(--hud-border);border-radius:16px;z-index:20;max-width:96vw}
.build-btn{width:60px;height:62px;border:2px solid transparent;border-radius:10px;background:rgba(255,255,255,0.05);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:all 0.15s ease-out;position:relative;color:#e8e8f0;font-family:inherit}
.build-btn:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.15);transform:translateY(-2px)}
.build-btn.active{border-color:var(--accent);background:rgba(255,184,48,0.15)}
.build-btn .icon{font-size:22px}
.build-btn .label{font-size:8px;font-weight:600;letter-spacing:0.3px;text-transform:uppercase;color:rgba(255,255,255,0.5)}
.build-btn .cost{position:absolute;top:-7px;right:-3px;font-size:9px;font-weight:700;background:var(--green);color:#111;padding:1px 5px;border-radius:5px}

/* Minimap */
.minimap{position:fixed;bottom:20px;right:16px;width:140px;height:105px;background:rgba(18,18,30,0.9);border:1px solid var(--hud-border);border-radius:8px;overflow:hidden}
.minimap canvas{width:100%;height:100%}

/* Toast */
.toast{position:fixed;top:55px;left:50%;transform:translateX(-50%) translateY(-20px);padding:8px 20px;border-radius:8px;font-size:12px;font-weight:600;opacity:0;transition:all 0.3s ease-out;z-index:100;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.warn{background:#F59E0B;color:#1a1a2e}
.toast.info{background:var(--blue);color:#fff}
.toast.success{background:var(--green);color:#1a1a2e}

/* Tutorial */
.tutorial{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(18,18,30,0.95);border:1px solid var(--accent);border-radius:10px;padding:12px 20px;font-size:12px;max-width:400px;text-align:center;line-height:1.5;z-index:50;display:none}
.tutorial.show{display:block}
.tutorial .step{color:var(--accent);font-weight:700;font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
.tutorial .dismiss{margin-top:6px;font-size:10px;color:rgba(255,255,255,0.4);cursor:pointer;transition:color .15s}
.tutorial .dismiss:hover{color:#fff}

/* Policy panel */
.policy-toggle{position:fixed;right:16px;top:65px;background:var(--hud-bg);backdrop-filter:blur(12px);border:1px solid var(--hud-border);border-radius:8px;padding:6px 12px;font-size:11px;color:var(--accent);cursor:pointer;font-weight:700;z-index:25;transition:all .15s}
.policy-toggle:hover{background:rgba(255,184,48,0.15)}
.policy-panel{position:fixed;right:16px;top:100px;width:260px;max-height:calc(100vh - 230px);overflow-y:auto;background:var(--hud-bg);backdrop-filter:blur(12px);border:1px solid var(--hud-border);border-radius:12px;padding:14px;z-index:24;transform:translateX(300px);transition:transform .3s ease;font-size:11px}
.policy-panel.open{transform:translateX(0)}
.policy-panel h3{font-size:13px;font-weight:700;margin-bottom:10px;color:var(--accent)}
.pol-item{padding:8px;margin-bottom:6px;border-radius:8px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);transition:all .2s;cursor:pointer}
.pol-item:hover{background:rgba(255,255,255,0.08)}
.pol-item.active{border-color:var(--accent);background:rgba(255,184,48,0.1);box-shadow:0 0 10px rgba(255,184,48,0.15)}
.pol-item.locked{opacity:0.5;cursor:not-allowed}
.pol-item.activating{border-color:#60A5FA;background:rgba(96,165,250,0.1)}
.pol-name{font-weight:700;font-size:12px;margin-bottom:2px}
.pol-cost{font-size:10px;color:rgba(255,255,255,0.4)}
.pol-req{font-size:9px;color:#F87171;margin-top:2px}
.pol-desc{font-size:9px;color:rgba(255,255,255,0.5);margin-top:2px}
.pol-progress{height:3px;background:rgba(255,255,255,0.1);border-radius:2px;margin-top:4px;overflow:hidden}
.pol-progress-bar{height:100%;background:var(--blue);border-radius:2px;transition:width .3s}

/* Tab bar */
.tab-bar{display:flex;gap:4px;margin-bottom:8px;width:100%}
.tab-btn{flex:1;padding:6px 0;border:1px solid rgba(255,255,255,0.08);border-radius:8px;background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.5);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;text-align:center}
.tab-btn:hover{background:rgba(255,255,255,0.08)}
.tab-btn.active{background:rgba(255,184,48,0.15);border-color:rgba(255,184,48,0.3);color:#FFB830}

/* Hire panel */
.hire-panel{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);width:520px;max-width:94vw;max-height:60vh;overflow-y:auto;background:var(--hud-bg);backdrop-filter:blur(16px);border:1px solid var(--hud-border);border-radius:14px;padding:20px;z-index:28;display:none}
.hire-panel.open{display:block}
.hire-title{font-size:15px;font-weight:800;color:var(--accent);margin-bottom:4px}
.hire-sub{font-size:11px;color:rgba(255,255,255,0.4);margin-bottom:14px}
.hire-card{display:flex;gap:14px;align-items:flex-start;padding:12px;margin-bottom:8px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;transition:all .15s}
.hire-card:hover{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.12)}
.hire-portrait{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.hire-info{flex:1;min-width:0}
.hire-name{font-weight:700;font-size:13px;margin-bottom:2px}
.hire-desc{font-size:11px;color:rgba(255,255,255,0.5);margin-bottom:6px;font-style:italic}
.hire-stats{display:flex;gap:12px;font-size:11px;margin-bottom:6px}
.hire-stats span{color:rgba(255,255,255,0.6)}
.hire-stats strong{color:#e8e8f0}
.hire-warn{font-size:10px;color:#F87171;margin-bottom:4px}
.hire-btn{padding:5px 14px;border:none;border-radius:6px;background:var(--accent);color:#1a1a2e;font-weight:700;font-size:11px;cursor:pointer;font-family:inherit;transition:opacity .15s}
.hire-btn:hover{opacity:0.85}
.hire-refresh{display:block;width:100%;padding:8px;border:1px dashed rgba(255,255,255,0.15);border-radius:8px;background:none;color:rgba(255,255,255,0.4);font-size:11px;cursor:pointer;font-family:inherit;text-align:center;transition:all .15s;margin-top:4px}
.hire-refresh:hover{color:#fff;border-color:rgba(255,255,255,0.3)}
.hire-close{position:absolute;top:10px;right:14px;background:none;border:none;color:rgba(255,255,255,0.4);font-size:18px;cursor:pointer;transition:color .15s}
.hire-close:hover{color:#fff}

/* Meeting panel */
.meeting-panel{position:fixed;right:0;top:0;width:320px;height:100%;background:var(--hud-bg);backdrop-filter:blur(16px);border-left:1px solid var(--hud-border);z-index:30;transform:translateX(340px);transition:transform .3s ease;padding:24px 20px;overflow-y:auto}
.meeting-panel.open{transform:translateX(0)}
.meeting-close{position:absolute;top:12px;right:12px;background:rgba(255,255,255,0.08);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.meeting-close:hover{background:rgba(255,255,255,0.2)}
.meeting-portrait{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:20px auto 10px;font-size:28px;border:3px solid var(--accent)}
.meeting-name{text-align:center;font-weight:700;font-size:15px;margin-bottom:2px}
.meeting-type{text-align:center;font-size:11px;color:rgba(255,255,255,0.5);margin-bottom:16px;text-transform:capitalize}
.meeting-stats{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.meeting-stat{text-align:center;padding:4px 8px;border-radius:6px;background:rgba(255,255,255,0.05);font-size:10px}
.meeting-stat .v{font-weight:700;font-size:13px;display:block}
.meeting-choice{width:100%;padding:10px 14px;margin-bottom:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:#e8e8f0;cursor:pointer;text-align:left;font-size:11px;line-height:1.4;transition:all .15s;font-family:inherit}
.meeting-choice:hover{background:rgba(255,184,48,0.12);border-color:var(--accent)}
.meeting-choice .effect{display:block;font-size:9px;color:rgba(255,255,255,0.4);margin-top:2px}

/* Event modal */
.event-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:40;display:none;align-items:center;justify-content:center}
.event-overlay.show{display:flex}
.event-card{background:#FFFEF5;color:#1a1a2e;border-radius:12px;width:420px;max-width:90vw;padding:28px 24px;box-shadow:0 20px 60px rgba(0,0,0,0.5);border:2px solid #E8E0D0;position:relative}
.event-headline{font-size:18px;font-weight:800;margin-bottom:8px;line-height:1.3;color:#2C1810}
.event-desc{font-size:13px;color:#5C4A3A;margin-bottom:16px;line-height:1.5}
.event-timer{position:absolute;top:12px;right:16px;font-size:12px;font-weight:700;color:#D32F2F}
.event-choice{width:100%;padding:10px 14px;margin-bottom:6px;border-radius:8px;border:1px solid #D7CCC8;background:#FFF;color:#2C1810;cursor:pointer;text-align:left;font-size:12px;line-height:1.4;transition:all .15s;font-family:inherit}
.event-choice:hover{background:#FFF3E0;border-color:#FFB830}
.event-choice:disabled{opacity:0.4;cursor:not-allowed}
.event-choice .preview{display:block;font-size:10px;color:#8D6E63;margin-top:2px}
.event-choice .req{color:#D32F2F;font-weight:600}
.event-tag{display:inline-block;font-size:9px;font-weight:700;background:#EFEBE9;color:#5D4037;padding:2px 8px;border-radius:4px;margin-bottom:10px;letter-spacing:0.5px}

/* Strategy meeting */
.meeting-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:42;display:none;align-items:center;justify-content:center}
.meeting-overlay.show{display:flex}
.strat-card{background:linear-gradient(180deg,#1e2a4a 0%,#15203a 100%);color:#e8e8f0;border-radius:14px;width:520px;max-width:92vw;padding:28px 24px;box-shadow:0 20px 60px rgba(0,0,0,0.6);border:1px solid rgba(100,160,255,0.15);max-height:85vh;overflow-y:auto}
.strat-title{font-size:18px;font-weight:800;color:var(--accent);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.strat-subtitle{font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:20px}
.strat-section{margin-bottom:18px}
.strat-section h4{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:0.8px;text-transform:uppercase;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,0.06)}
.strat-metric{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px}
.strat-metric .label{min-width:90px;color:rgba(255,255,255,0.6)}
.strat-metric .bar{flex:1;height:8px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden}
.strat-metric .bar-fill{height:100%;border-radius:4px;transition:width 0.6s ease-out}
.strat-metric .val{min-width:35px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.strat-trend{font-size:11px;margin-left:4px}
.strat-trend.up{color:#4ADE80}
.strat-trend.down{color:#F87171}
.strat-trend.flat{color:rgba(255,255,255,0.3)}
.strat-insight{background:rgba(255,184,48,0.08);border:1px solid rgba(255,184,48,0.15);border-radius:8px;padding:12px 14px;font-size:12px;line-height:1.6;color:rgba(255,255,255,0.8);margin-bottom:10px}
.strat-insight strong{color:var(--accent)}
.strat-agenda{display:flex;flex-direction:column;gap:6px}
.strat-agenda-item{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(255,255,255,0.04);border-radius:8px;font-size:12px}
.strat-agenda-item .emoji{font-size:16px}
.strat-close{display:block;width:100%;margin-top:16px;padding:12px;border:none;border-radius:10px;background:var(--accent);color:#1a1a2e;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;transition:opacity 0.15s}
.strat-close:hover{opacity:0.85}

/* Report card */
.report-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:50;display:none;align-items:center;justify-content:center;overflow-y:auto;padding:20px}
.report-overlay.show{display:flex}
.report-card{background:rgba(255,255,255,0.04);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.08);border-radius:12px;max-width:700px;width:95vw;padding:28px 24px;color:#e8e8f0}
.report-btn{width:100%;padding:12px;border:none;border-radius:10px;background:var(--accent);color:#1a1a2e;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s;font-family:inherit}
.report-btn:hover{opacity:0.85}
.rpt-header{width:100%;text-align:center;padding:20px;margin-bottom:16px;border-radius:10px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06)}
.rpt-section-title{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.rpt-gauges{display:flex;gap:12px;justify-content:space-between;margin-bottom:16px}
.rpt-gauge-col{flex:1;text-align:center}
.rpt-gauge-col .gauge-label{font-size:11px;color:rgba(255,255,255,0.6);margin-bottom:6px}
.rpt-gauge-col .gauge-icon{font-size:18px;display:block;margin-bottom:4px}
.rpt-gauge-col .gauge-bar{height:10px;border-radius:5px;background:rgba(255,255,255,0.08);overflow:hidden;margin-bottom:6px}
.rpt-gauge-col .gauge-fill{height:100%;border-radius:5px;transition:width .5s}
.rpt-gauge-col .gauge-val{font-size:20px;font-weight:800}
.rpt-stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.rpt-stat-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);padding:12px;border-radius:10px;text-align:center}
.rpt-stat-number{font-size:24px;font-weight:800}
.rpt-stat-label{font-size:11px;color:rgba(255,255,255,0.5);margin-top:4px}
.num-up{color:#4ade80}
.num-down{color:#f87171}
.num-neutral{color:rgba(255,255,255,0.6)}
.rpt-top3-row{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px}
.rpt-top3-card{min-width:140px;flex:1;padding:12px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06)}
.rpt-top3-card .t3-headline{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rpt-top3-card .t3-choice{font-size:11px;color:rgba(255,255,255,0.7);margin-bottom:4px}
.rpt-top3-card .t3-effect{font-size:10px;color:rgba(255,255,255,0.4)}
.rpt-coaching-card{background:rgba(255,255,255,0.03);border-left:3px solid;padding:14px;border-radius:0 10px 10px 0;margin-bottom:10px}
.coaching-good{border-left-color:#4ade80}
.coaching-bad{border-left-color:#f59e0b}
.coaching-next{border-left-color:#60a5fa}
.rpt-coaching-card .coaching-title{font-size:12px;font-weight:700;margin-bottom:6px}
.rpt-coaching-card .coaching-body{font-size:11px;color:rgba(255,255,255,0.7);line-height:1.5}
.rpt-quote{font-style:italic;color:rgba(255,255,255,0.5);font-size:11px;margin-top:8px}
.rpt-source{color:rgba(255,255,255,0.3);font-size:10px;display:block;margin-top:4px}
.rpt-dna-bar{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11px}
.rpt-dna-bar .dna-label{min-width:60px;color:rgba(255,255,255,0.6)}
.rpt-dna-bar .dna-track{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,0.08);overflow:hidden}
.rpt-dna-bar .dna-fill{height:100%;border-radius:4px;transition:width .5s}
.rpt-dna-bar .dna-val{min-width:30px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* Onboarding overlay */
.onboard-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#E8F5E9 0%,#FFF8E1 50%,#E3F2FD 100%);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;animation:fadeIn .5s cubic-bezier(0.16,1,0.3,1) forwards}
.onboard-hero{text-align:center;margin-bottom:14px;animation:slideUp .5s cubic-bezier(0.16,1,0.3,1) forwards}
.onboard-hero-title{font-size:44px;font-weight:900;letter-spacing:-1.5px;color:#1F2937;line-height:1.1;margin-bottom:6px}
.onboard-hero-title .accent{color:#0052A2}
.onboard-hero-sub{font-size:15px;color:#6B7280;letter-spacing:0.2px}
@keyframes fadeIn{to{opacity:1}}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 20px rgba(255,184,48,0.1)}50%{box-shadow:0 0 40px rgba(255,184,48,0.2)}}
@keyframes skms-pulse{0%,100%{box-shadow:0 0 20px rgba(0,82,162,0.2)}50%{box-shadow:0 0 40px rgba(0,82,162,0.5)}}
@keyframes fadeInUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes bounceIn{0%{transform:translateY(30px);opacity:0}60%{transform:translateY(-6px);opacity:1}100%{transform:translateY(0)}}
@keyframes shakeIn{0%{transform:translateX(-8px);opacity:0}25%{transform:translateX(6px)}50%{transform:translateX(-4px);opacity:1}75%{transform:translateX(2px)}100%{transform:translateX(0)}}
@keyframes twinkle{0%,100%{opacity:0}50%{opacity:1}}
.slide1-layout{display:flex;align-items:center;justify-content:center;gap:16px;width:100%;position:relative;padding:8px 0}
.skms-panel{width:150px;flex:0 0 auto;background:linear-gradient(180deg,#EBF2FA,#F0F7FF);border-radius:14px;padding:16px 12px;border:2px solid rgba(0,82,162,0.3);text-align:center;box-shadow:0 4px 20px rgba(0,82,162,0.1)}
.after-area{width:140px;flex:0 0 auto;display:flex;flex-direction:column;gap:8px}
.success-path{background:rgba(34,197,94,0.08);border:1.5px solid rgba(34,197,94,0.25);border-radius:10px;padding:8px;text-align:center}
.failure-path{background:rgba(220,38,38,0.06);border:1.5px solid rgba(220,38,38,0.15);border-radius:10px;padding:8px;text-align:center}
.sc-card-new{flex:1;padding:20px;border-radius:12px;border:2px solid #E2E8F0;background:#FAFAFA;cursor:pointer;transition:all .2s ease-out;display:flex;flex-direction:column;align-items:center;gap:8px}
.sc-card-new:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,0.08)}
.sc-card-new.active{border-color:#0052A2;background:linear-gradient(135deg,#EBF2FA,#F0F7FF);box-shadow:0 4px 20px rgba(0,82,162,0.12)}
.play-strip{display:flex;flex-direction:column;gap:10px;padding:16px 18px;border-radius:14px;background:linear-gradient(135deg,#F0F7FF,#EBF2FA);border:1px solid rgba(0,82,162,0.12);margin-top:12px}
.play-strip .strip-label{font-size:12px;font-weight:800;color:#0052A2;text-align:center;letter-spacing:0.5px}
.play-strip .strip-steps{display:flex;gap:8px;flex:1;justify-content:center;align-items:stretch}
.play-strip .strip-chip{flex:1;background:#fff;padding:12px 10px;border-radius:10px;font-size:11px;color:#1F2937;font-weight:600;text-align:center;box-shadow:0 2px 8px rgba(0,82,162,0.08);border:1px solid rgba(0,82,162,0.08);line-height:1.4;display:flex;flex-direction:column;align-items:center;gap:4px}
.play-strip .strip-arrow{color:#0052A2;font-size:16px;font-weight:800;display:flex;align-items:center}
.difficulty-badge{margin-top:4px;padding:3px 10px;border-radius:5px;font-size:9px;font-weight:600}
.onboard-card{background:rgba(255,255,255,0.97);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:none;border-radius:24px;width:1060px;max-width:97vw;max-height:80vh;overflow-y:auto;padding:24px 44px 36px;color:#1F2937;box-shadow:0 25px 80px rgba(0,0,0,0.1),0 0 0 1px rgba(0,0,0,0.03);animation:slideUp .6s cubic-bezier(0.16,1,0.3,1) forwards}
.sc-visual{display:flex;align-items:center;gap:16px}
.sc-visual svg{flex-shrink:0}
.sc-visual-text{flex:1}
.onboard-preview{width:100%;height:260px;border-radius:14px;background:#f8f9fa;margin-bottom:16px;overflow:hidden;position:relative;margin-top:4px}
.onboard-preview canvas{width:100%;height:100%;display:block}
.onboard-card::-webkit-scrollbar{width:3px}
.onboard-card::-webkit-scrollbar-thumb{background:rgba(255,184,48,0.2);border-radius:2px}
.onboard-slides{position:relative;width:100%;min-height:400px}
.onboard-slide{display:none;animation:fadeIn .3s ease-out}
.onboard-slide.active{display:flex;flex-direction:column;justify-content:center;min-height:400px}
.onboard-nav{display:flex;justify-content:center;gap:8px;margin-top:20px;align-items:center}
.onboard-dot{width:10px;height:10px;border-radius:50%;background:#D1D5DB;border:none;cursor:pointer;transition:all .2s;padding:0}
.onboard-dot.active{background:#0052A2;transform:scale(1.2)}
.onboard-nav-btn{background:none;border:1px solid #D1D5DB;color:#6B7280;border-radius:8px;padding:6px 16px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:600;transition:all .15s}
.onboard-nav-btn:hover{border-color:#0052A2;color:#0052A2}
.onboard-nav-btn.primary{background:#0052A2;color:#fff;border-color:#0052A2}
.onboard-nav-btn.primary:hover{background:#003d7a}
.onboard-flow{display:flex;gap:12px;margin:16px 0;align-items:stretch}
.onboard-flow-step{flex:1;padding:18px 14px;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:14px;text-align:center;position:relative}
.onboard-flow-num{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#0052A2;color:#fff;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:800;line-height:22px}
.onboard-flow-icon{font-size:32px;margin:8px 0 6px;display:block}
.onboard-flow-title{font-size:14px;font-weight:800;color:#1F2937;margin-bottom:4px}
.onboard-flow-items{text-align:left;padding:6px 0 0;display:flex;flex-direction:column;gap:5px}
.onboard-flow-item{font-size:11px;color:#374151;background:#EFF6FF;border:1px solid #DBEAFE;border-radius:8px;padding:5px 8px;display:flex;align-items:center;gap:6px;line-height:1.3}
.onboard-flow-item .fi-icon{font-size:13px;flex-shrink:0}
.onboard-flow-arrow{display:flex;align-items:center;font-size:24px;color:#0052A2;font-weight:800;padding:0 2px}
.onboard-scenarios{display:flex;gap:12px;margin-bottom:8px;margin-top:12px}
.onboard-scenario-card{flex:1;padding:18px;border-radius:16px;border:2px solid #E2E8F0;background:#FAFAFA;cursor:pointer;transition:all .2s ease-out}
.onboard-scenario-card:hover{border-color:#94A3B8;transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,0.08)}
.onboard-scenario-card.active{border-color:#0052A2;background:linear-gradient(135deg,#EBF2FA 0%,#F0F7FF 100%);box-shadow:0 4px 20px rgba(0,82,162,0.12)}
.onboard-scenario-card.locked{opacity:0.4;cursor:default}
.onboard-scenario-card.locked:hover{transform:none;border-color:#E2E8F0;box-shadow:none}
.onboard-scenario-card .sc-badge{font-size:11px;font-weight:800;letter-spacing:0.8px;text-transform:uppercase;margin-bottom:6px;display:block}
.onboard-scenario-card .sc-title-line{font-size:16px;font-weight:800;color:#1F2937;margin-bottom:2px}
.onboard-scenario-card .sc-desc-line{font-size:14px;font-weight:500;color:#4B5563;line-height:1.5}
.onboard-scenario-card .lock-label{font-size:10px;color:#9CA3AF;margin-top:8px;font-style:italic}
.onboard-title{font-size:40px;font-weight:900;text-align:center;margin-bottom:8px;letter-spacing:-1.5px;line-height:1.1;color:#1F2937;margin-top:4px}
.onboard-title .accent{color:#0052A2}
.onboard-sub{text-align:center;font-size:15px;color:#6B7280;margin-bottom:30px;letter-spacing:0.3px}
.onboard-controls{background:#F1F5F9;border:1px solid #E2E8F0;border-radius:12px;padding:14px 16px;margin-bottom:22px;font-size:12px;color:#6B7280;line-height:1.8;display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:center}
.onboard-controls span{color:#0052A2;font-weight:700;background:#EBF2FA;padding:2px 8px;border-radius:4px;font-size:11px}
.onboard-start{display:block;width:100%;padding:16px;border:none;border-radius:14px;background:linear-gradient(135deg,#0052A2 0%,#0073E6 100%);color:#fff;font-weight:900;font-size:17px;cursor:pointer;font-family:inherit;transition:all .2s cubic-bezier(0.16,1,0.3,1);letter-spacing:-0.3px;box-shadow:0 4px 20px rgba(0,82,162,0.25)}
.onboard-start:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 8px 30px rgba(0,82,162,0.35)}
.onboard-start:active{transform:translateY(0) scale(0.99)}

/* Scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px}

/* Performance Grade Buttons */
.perf-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:11px}
.perf-name{min-width:80px;font-weight:600}
.perf-dept{min-width:60px;color:rgba(255,255,255,0.4);font-size:10px}
.perf-grades{display:flex;gap:3px}
.perf-grade{width:24px;height:24px;border:1px solid rgba(255,255,255,0.1);border-radius:4px;background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.5);font-size:10px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:all .12s}
.perf-grade:hover{background:rgba(255,255,255,0.1)}
.perf-grade.selected{border-color:var(--accent);color:var(--accent);background:rgba(255,184,48,0.15)}
.perf-grade.grade-s.selected{border-color:#4ADE80;color:#4ADE80;background:rgba(74,222,128,0.1)}
.perf-grade.grade-d.selected{border-color:#F87171;color:#F87171;background:rgba(248,113,113,0.1)}
.pip-badge{font-size:9px;color:#F87171;font-weight:700;margin-left:4px}
.perf-row.pip-active{background:rgba(248,113,113,0.08);border-radius:4px;padding-left:4px}

/* Rankings overlay */
.rank-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:55;display:none;align-items:center;justify-content:center}
.rank-overlay.show{display:flex}
.rank-card{background:var(--hud-bg);backdrop-filter:blur(16px);border:1px solid var(--hud-border);border-radius:14px;width:600px;max-width:95vw;max-height:80vh;overflow-y:auto;padding:24px;color:#e8e8f0}
.rank-title{font-size:18px;font-weight:800;color:var(--accent);text-align:center;margin-bottom:16px}
.rank-table{width:100%;border-collapse:collapse;font-size:11px}
.rank-table th{text-align:left;padding:6px 8px;border-bottom:2px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.5);font-size:10px;text-transform:uppercase;letter-spacing:0.5px}
.rank-table td{padding:5px 8px;border-bottom:1px solid rgba(255,255,255,0.04)}
.rank-table .current{background:rgba(255,184,48,0.1)}
.rank-table .won{color:var(--green)}
.rank-table .lost{color:var(--red)}

/* Mobile responsive */
@media (max-width: 768px) {
  .topbar{padding:6px 10px;gap:6px;font-size:10px}
  .topbar .logo{font-size:13px}
  .topbar .stat{padding:2px 6px;font-size:10px}
  .build-panel{bottom:10px;padding:6px 8px;border-radius:12px}
  .build-btn{width:48px;height:50px;min-width:44px;min-height:44px}
  .build-btn .icon{font-size:18px}
  .build-btn .label{font-size:7px}
  .build-btn .cost{font-size:8px}
  .tab-btn{font-size:9px;padding:4px 0;min-height:44px}
  .policy-panel{width:220px;font-size:10px}
  .meeting-panel{width:280px}
  .dept-sections{flex-direction:column}
  .dept-card{width:95vw;padding:16px}
  .minimap{width:100px;height:75px;bottom:70px}
  .onboard-card{width:95vw;padding:20px 16px}
  .onboard-flow{flex-direction:column}.onboard-flow-arrow{justify-content:center;transform:rotate(90deg)}
  .slide1-layout{flex-direction:column;gap:12px}
  .skms-panel{width:90%}
  .after-area{width:90%;flex-direction:row}
  .success-path,.failure-path{flex:1}
  .event-card{width:92vw;padding:20px 16px}
  .strat-card{width:95vw;padding:20px 16px}
  .hire-panel{width:95vw;bottom:80px}
  .mgmt-panel{width:95vw;bottom:80px}
  .tutorial{bottom:75px;max-width:300px;font-size:11px}
  .speed-btn{min-width:44px;min-height:44px}
  .policy-toggle{min-width:44px;min-height:44px}
  .pol-item{min-height:44px}
  .meeting-choice{min-height:44px}
  .event-choice{min-height:44px}
  .hire-btn{min-height:44px}
  .mgmt-grade-btn{min-width:28px;min-height:28px}
  .salary-btn{min-height:28px}
  .hud-controls{display:none}
}

/* Management panels */
.mgmt-panel{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);width:600px;max-width:95vw;max-height:55vh;overflow-y:auto;background:var(--hud-bg);backdrop-filter:blur(16px);border:1px solid var(--hud-border);border-radius:14px;padding:20px;z-index:28;display:none}
.mgmt-panel.open{display:block}
.mgmt-title{font-size:15px;font-weight:800;color:var(--accent);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.mgmt-close{background:none;border:none;color:rgba(255,255,255,0.4);font-size:18px;cursor:pointer}
.mgmt-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:11px}
.mgmt-row:hover{background:rgba(255,255,255,0.03)}
.mgmt-bar{height:4px;background:rgba(255,255,255,0.08);border-radius:2px;flex:1;max-width:60px}
.mgmt-bar-fill{height:100%;border-radius:2px}
.mgmt-grade-btn{width:22px;height:22px;border:1px solid rgba(255,255,255,0.1);border-radius:4px;background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.5);font-size:9px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .12s;display:flex;align-items:center;justify-content:center}
.mgmt-grade-btn:hover{background:rgba(255,255,255,0.1)}
.perf-quota-bar{display:flex;gap:6px;padding:8px 12px;background:rgba(255,255,255,0.03);border-radius:6px;margin-bottom:8px;flex-wrap:wrap;align-items:center;font-size:10px;color:rgba(255,255,255,0.5)}
.perf-quota-item{display:flex;gap:2px;align-items:center}
.perf-quota-item.over{color:#f87171;font-weight:700}
.perf-quota-item.under{color:#fbbf24;font-weight:700}
.perf-quota-item.ok{color:#4ade80}
.perf-confirm-btn{width:100%;margin-top:10px;padding:10px;border:1px solid rgba(74,222,128,0.3);border-radius:8px;background:rgba(74,222,128,0.1);color:#4ade80;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.perf-confirm-btn:hover{background:rgba(74,222,128,0.2)}
.perf-confirm-btn:disabled{opacity:0.3;cursor:not-allowed;color:rgba(255,255,255,0.3);border-color:rgba(255,255,255,0.1);background:rgba(255,255,255,0.03)}
.perf-warning{font-size:10px;color:#fbbf24;text-align:center;padding:4px 0}
.comp-cards{display:flex;gap:8px;padding:4px 0}
.comp-card{flex:1;padding:12px 10px;border:1px solid rgba(255,255,255,0.08);border-radius:10px;background:rgba(255,255,255,0.03);cursor:pointer;transition:all .15s;text-align:center}
.comp-card:hover{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.15)}
.comp-card.active{border-color:rgba(255,184,48,0.4);background:rgba(255,184,48,0.08)}
.comp-card.disabled{opacity:0.5;cursor:not-allowed}
.comp-card-icon{font-size:24px;margin-bottom:6px}
.comp-card-name{font-size:12px;font-weight:700;color:rgba(255,255,255,0.9);margin-bottom:4px}
.comp-card-desc{font-size:9px;color:rgba(255,255,255,0.4);line-height:1.4;white-space:pre-line}
.comp-card-badge{display:inline-block;padding:2px 6px;background:rgba(255,184,48,0.15);color:#FFB830;border-radius:4px;font-size:8px;font-weight:700;margin-top:6px}
.comp-footer{margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.1);font-size:11px;color:rgba(255,255,255,0.5)}
.comp-readonly-notice{text-align:center;padding:8px;font-size:10px;color:rgba(255,255,255,0.3);background:rgba(255,255,255,0.02);border-radius:6px;margin-bottom:8px}
.mgmt-stat{display:flex;justify-content:space-between;padding:4px 0;font-size:11px;border-bottom:1px solid rgba(255,255,255,0.04)}
.mgmt-stat .k{color:rgba(255,255,255,0.5)}
.mgmt-stat .v{font-weight:700}
.salary-btn{padding:3px 8px;border:1px solid rgba(255,255,255,0.1);border-radius:4px;background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.6);font-size:9px;cursor:pointer;font-family:inherit;transition:all .12s}
.salary-btn:hover{background:rgba(255,255,255,0.1);color:#fff}
.history-panel{position:fixed;left:0;top:44px;width:240px;height:calc(100vh - 104px);background:rgba(26,26,46,0.94);backdrop-filter:blur(14px);border-right:1px solid rgba(255,255,255,0.08);z-index:90;display:flex;flex-direction:column;transition:transform .3s ease;overflow:hidden;font-size:12px;transform:translateX(0)}
.history-panel.hidden{transform:translateX(-100%)}
.history-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.06)}
.history-header-title{font-size:11px;font-weight:700;color:rgba(255,255,255,0.5);letter-spacing:0.5px}
.history-close{background:none;border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:rgba(255,255,255,0.4);font-size:10px;cursor:pointer;padding:3px 8px;font-family:inherit;transition:all .15s}
.history-close:hover{color:#fff;border-color:rgba(255,255,255,0.3)}
.history-profile{padding:14px;border-bottom:1px solid rgba(255,255,255,0.08)}
.history-style-tag{display:inline-block;padding:4px 12px;border-radius:12px;font-size:11px;font-weight:700;margin-top:4px}
.history-gauges{display:flex;gap:8px;margin-top:10px}
.history-gauge{flex:1;text-align:center}
.history-gauge-label{font-size:9px;color:rgba(255,255,255,0.4);margin-bottom:3px;display:block}
.history-gauge-bar{height:4px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden}
.history-gauge-fill{height:100%;border-radius:2px;transition:width .5s}
.history-gauge-val{font-size:10px;font-weight:700;margin-top:2px;display:block}
.history-list{flex:1;overflow-y:auto;padding:8px}
.history-item{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,0.06);color:rgba(255,255,255,0.8);font-size:11px;line-height:1.5;display:flex;gap:8px;align-items:flex-start}
.history-item .hi-icon{font-size:14px;flex-shrink:0;margin-top:1px}
.history-item .hi-body{flex:1}
.history-item .hi-time{color:var(--accent);font-weight:700;font-size:9px;display:block;margin-bottom:1px}
.history-item .hi-action{display:block;color:rgba(255,255,255,0.7)}
.hud-controls{position:fixed;left:12px;bottom:12px;z-index:80;background:rgba(26,26,46,0.88);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:8px 12px;font-size:11px;color:rgba(255,255,255,0.6);transition:all .3s;max-width:200px}
.hud-controls.collapsed .hud-controls-body{display:none}
.hud-controls-toggle{background:none;border:none;color:rgba(255,255,255,0.5);cursor:pointer;font-size:11px;padding:2px 4px;width:100%;text-align:left;font-family:inherit}
.hud-controls-body{margin-top:6px;line-height:1.8}
.hud-controls-body kbd{display:inline-block;background:rgba(255,255,255,0.1);padding:1px 6px;border-radius:4px;font-size:10px;font-family:inherit;margin-right:4px}
.dept-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:95;display:none;align-items:center;justify-content:center}
.dept-overlay.show{display:flex}
.dept-card{background:var(--hud-bg);backdrop-filter:blur(16px);border:1px solid var(--hud-border);border-radius:16px;width:560px;max-width:95vw;max-height:85vh;overflow-y:auto;padding:24px;color:#e8e8f0}
.dept-title{font-size:18px;font-weight:800;margin-bottom:4px}
.dept-subtitle{font-size:12px;color:rgba(255,255,255,0.5);margin-bottom:16px}
.dept-sections{display:flex;gap:12px;min-height:200px;flex-wrap:wrap}
.dept-section{flex:1;background:rgba(255,255,255,0.04);border:2px dashed rgba(255,255,255,0.1);border-radius:12px;padding:10px;min-height:180px;min-width:140px;transition:border-color .2s}
.dept-section.drag-over{border-color:var(--accent);background:rgba(255,184,48,0.06)}
.dept-section-title{font-size:11px;font-weight:700;color:rgba(255,255,255,0.4);letter-spacing:0.5px;margin-bottom:8px;text-align:center}
.dept-worker{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:grab;display:flex;align-items:center;gap:8px;font-size:12px;transition:all .15s;user-select:none}
.dept-worker:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2)}
.dept-worker.dragging{opacity:0.4;transform:scale(0.95)}
.dept-worker .dw-emoji{font-size:16px}
.dept-worker .dw-name{font-weight:700;flex:1}
.dept-worker .dw-stats{font-size:10px;color:rgba(255,255,255,0.5)}
.dept-close{position:absolute;top:12px;right:12px;background:none;border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:rgba(255,255,255,0.5);font-size:14px;cursor:pointer;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:all .15s}
.dept-close:hover{color:#fff;border-color:rgba(255,255,255,0.3)}

// SCENARIO: CRISIS COMPANY SETUP
// ============================================================
function setupCrisisScenario() {
  var cx = Math.floor(GRID / 2), cy = Math.floor(GRID / 2);
  // HQ at center
  G.grid[cy][cx] = {type:'hq'};
  // Corridors: a cross pattern
  for (var i = 1; i <= 5; i++) {
    placeCell(cx + i, cy, 'corridor');
    placeCell(cx - i, cy, 'corridor');
    placeCell(cx, cy + i, 'corridor');
    placeCell(cx, cy - i, 'corridor');
  }
  // Production at right
  placeCell(cx + 6, cy, 'production');
  // Marketing at left
  placeCell(cx - 6, cy, 'marketing');
  // Employees: mixed realistic crisis company
  // 3 disengaged, 3 cynic, 3 rookie, 2 ace (struggling but not dead), 1 leader (overwhelmed)
  var types = [];
  for (var i = 0; i < 3; i++) types.push('disengaged');
  for (var i = 0; i < 3; i++) types.push('cynic');
  for (var i = 0; i < 3; i++) types.push('rookie');
  for (var i = 0; i < 2; i++) types.push('ace');
  types.push('leader');
  for (var i = 0; i < types.length; i++) {
    spawnWorker(types[i], cx, cy);
  }
}

function setupAIScenario() {
  var cx = Math.floor(GRID / 2), cy = Math.floor(GRID / 2);
  G.grid[cy][cx] = {type:'hq'};
  // Well-established company: more corridors, more departments
  for (var i = 1; i <= 6; i++) {
    placeCell(cx + i, cy, 'corridor');
    placeCell(cx - i, cy, 'corridor');
    placeCell(cx, cy + i, 'corridor');
    placeCell(cx, cy - i, 'corridor');
  }
  // Existing departments
  placeCell(cx + 7, cy, 'production');
  placeCell(cx - 7, cy, 'marketing');
  placeCell(cx, cy + 7, 'hr');
  placeCell(cx, cy - 7, 'rnd');
  placeCell(cx + 4, cy + 3, 'planning');
  // Facilities
  placeCell(cx - 3, cy + 3, 'cafeteria');
  placeCell(cx + 3, cy - 3, 'wellness');
  // Starting money and metrics — stable company
  G.money = 20000;
  G.custSat = 60; G.empHap = 55; G.socVal = 45;
  // Mixed team: 4 ace, 3 rookie, 2 cynic, 1 leader, 2 disengaged
  var types = ['ace','ace','ace','ace','rookie','rookie','rookie','cynic','cynic','leader','disengaged','disengaged'];
  for (var i = 0; i < types.length; i++) {

function placeCell(x, y, type) {
  if (x < 0 || y < 0 || x >= GRID || y >= GRID) return;
  G.grid[y][x] = {type: type};
  G.bldgs.push({type: type, gx: x, gy: y});
}

function spawnWorker(type, nearX, nearY) {
  G.workerID++;

    id: G.workerID,

    x: nearX + (Math.random() - 0.5) * 2,
    y: nearY + (Math.random() - 0.5) * 2,

    capability: 20 + Math.random() * 40,

    pathIdx: 0,
    state: 'idle',
    stateTimer: 0,
    bubble: null,
    bubbleTimer: 0,
    speechCooldown: Math.random() * 200,
    quitTimer: 0,
    quitting: false,
    fadeOut: 1,
    preventQuitDays: 0,
    transitionCooldown: 0,

// HELPERS
// ============================================================
function toScr(gx, gy) {
  return {x: (gx - gy) * TW / 2, y: (gx + gy) * TH / 2};
}
function toGrd(sx, sy) {
  var wx = (sx - G.camX) / G.zm, wy = (sy - G.camY) / G.zm;
  return {x: Math.floor(wx / TW + wy / TH), y: Math.floor(wy / TH - wx / TW)};
}
function inBounds(x, y) { return x >= 0 && y >= 0 && x < GRID && y < GRID; }
function hasBuilding(type) {
  return G.bldgs.some(function(b) { return b.type === type; });
}
function countBuilding(type) {
  return G.bldgs.filter(function(b) { return b.type === type; }).length;
}
function policyActive(id) { return !!G.activePolicies[id]; }

function removeOneByType(state, type) {
  for (var i = state.workers.length - 1; i >= 0; i--) {
    if (state.workers[i].type === type && !state.workers[i].quitting) {
      state.workers[i].quitting = true;
      state.workers[i].bubble = SPEECH.quitting[0];
      state.workers[i].bubbleTimer = 120;
      state.totalQuits++;
      return;
    }
  }
}

function quitRandom(state, count) {
  var alive = state.workers.filter(function(w) { return !w.quitting; });
  for (var i = 0; i < count && i < alive.length; i++) {
    var idx = Math.floor(Math.random() * alive.length);
    alive[idx].quitting = true;
    alive[idx].bubble = SPEECH.quitting[0];
    alive[idx].bubbleTimer = 120;
    state.totalQuits++;
    alive.splice(idx, 1);
  }
}

function convertRandom(state, fromType, toType, count) {
  var matching = state.workers.filter(function(w) { return w.type === fromType && !w.quitting; });
  for (var i = 0; i < count && i < matching.length; i++) {
    matching[i].type = toType;
    if (toType === 'cynic') {
      matching[i].will = Math.max(20, matching[i].will - 20);
      matching[i].happiness = Math.max(10, matching[i].happiness - 15);
    }
  }
}

function clamp(lo, hi, v) { return Math.max(lo, Math.min(hi, v)); }

function showToast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (type || 'info');
  clearTimeout(el._tid);
  el._tid = setTimeout(function() { el.className = 'toast'; }, 2500);

function classifyChoiceEffect(preview) {
  var negTerms = ['\uD1EC\uC0AC', '-$', '-20', '-15', '-10', '-5', '\uAC10\uC18C', '\uBD88\uB9CC', '\uC2DC\uB2C8\uD06C', '\uBB34\uAE30\uB825'];
  var posTerms = ['+', '\uC131\uC7A5', '\uBB34\uB8CC', '\uD68C\uBCF5', '\uC720\uC9C0', '\uD589\uBCF5'];
  var negCount = 0, posCount = 0;
  for (var i = 0; i < negTerms.length; i++) if (preview.indexOf(negTerms[i]) >= 0) negCount++;
  for (var i = 0; i < posTerms.length; i++) if (preview.indexOf(posTerms[i]) >= 0) posCount++;
  return posCount >= negCount ? 'positive' : 'negative';
}

function showGaugeDelta(gaugeId, delta) {
  if (delta === 0) return;
  var gauge = document.getElementById(gaugeId);
  if (!gauge) return;
  var el = document.createElement('span');
  el.className = 'gauge-delta ' + (delta > 0 ? 'positive' : 'negative');
  el.textContent = delta > 0 ? '+' + delta + '\u25B2' : delta + '\u25BC';
  gauge.parentElement.style.position = 'relative';
  el.style.right = '-4px';
  el.style.top = '-14px';
  gauge.parentElement.appendChild(el);
  setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 1500);
}

function showWorkerReactions(emoji, filterFn) {
  var now = Date.now();
  var targets = G.workers.filter(function(w) { return !w.quitting && (!filterFn || filterFn(w)); });
  if (!filterFn && targets.length > 5) {
    targets.sort(function() { return Math.random() - 0.5; });
    targets = targets.slice(0, 5);
  }
  for (var i = 0; i < targets.length; i++) {
    G.emojiReactions.push({ workerId: targets[i].id, emoji: emoji, startTime: now });
  }
}

var bgmActive = false, bgmTimer = null;
function startBGM() {
  if (!G.audioCtx || bgmActive) return;
  bgmActive = true;
  // Warm corporate ambient — chord progression: Cmaj7, Fmaj7, Am7, G
  var chords = [
    [261, 329, 392, 494],  // Cmaj7
    [349, 440, 523, 659],  // Fmaj7
    [220, 261, 329, 392],  // Am7
    [196, 247, 294, 392],  // G
  ];
  var ci = 0, ni = 0;
  function playNote() {
    if (!bgmActive) return;
    var chord = chords[ci];
    var note = chord[ni % chord.length];
    // Gentle arpeggio
    if (G.audioCtx) {
      var o = G.audioCtx.createOscillator();

      o.type = 'sine';

      o.connect(g);
      g.connect(G.audioCtx.destination);
      o.start();
      o.stop(G.audioCtx.currentTime + 1.2);
      // Soft pad layer (octave below, quieter)
      var o2 = G.audioCtx.createOscillator();
      var g2 = G.audioCtx.createGain();
      o2.type = 'sine';
      o2.frequency.value = note / 2;
      g2.gain.setValueAtTime(0.008, G.audioCtx.currentTime);

      o2.connect(g2);
      g2.connect(G.audioCtx.destination);
      o2.start();
      o2.stop(G.audioCtx.currentTime + 2.0);
    }
    ni++;
    if (ni >= chord.length) { ni = 0; ci = (ci + 1) % chords.length; }
    bgmTimer = setTimeout(playNote, 450 + Math.random() * 100);
  }
  playNote();
}
