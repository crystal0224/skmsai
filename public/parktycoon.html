// ============================================================
// CANVAS SETUP
// ============================================================
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var mmC = document.getElementById('minimap');
var mmX = mmC.getContext('2d');

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
addEventListener('resize', resize);
resize();

// Center camera on HQ
function centerCamera() {
  var hx = Math.floor(GRID / 2), hy = Math.floor(GRID / 2);
  var s = toScr(hx, hy);
  G.camX = canvas.width / 2 - s.x * G.zm;
  G.camY = canvas.height / 2 - s.y * G.zm;
}

// ============================================================
// BFS PATHFINDING
// ============================================================
function bfsPath(sx, sy, tx, ty) {
  var s_gx = Math.round(sx), s_gy = Math.round(sy);
  var t_gx = Math.round(tx), t_gy = Math.round(ty);
  if (s_gx === t_gx && s_gy === t_gy) return [];
  if (!inBounds(t_gx, t_gy)) return [];

  var visited = {};
  var queue = [{x: s_gx, y: s_gy, path: []}];
  visited[s_gx + ',' + s_gy] = true;
  var dirs = [[1,0],[-1,0],[0,1],[0,-1]];

  while (queue.length > 0) {
    var cur = queue.shift();
    for (var d = 0; d < 4; d++) {
      var nx = cur.x + dirs[d][0], ny = cur.y + dirs[d][1];
      if (!inBounds(nx, ny)) continue;
      var key = nx + ',' + ny;
      if (visited[key]) continue;
      var cell = G.grid[ny][nx];
      if (!cell) continue; // can only walk on placed tiles
      visited[key] = true;
      var newPath = cur.path.concat([{x: nx, y: ny}]);
      if (nx === t_gx && ny === t_gy) return newPath;
      queue.push({x: nx, y: ny, path: newPath});
    }
  }
  return []; // no path
}

// ============================================================
// RENDERING
// ============================================================
function dayLight() {
  var h = G.gTime / 60;
  if (h < 6) return 0.2;
  if (h < 8) return 0.2 + (h - 6) / 2 * 0.5;
  if (h < 17) return 0.7 + Math.sin((h - 8) / 9 * Math.PI) * 0.3;
  if (h < 20) return 0.7 - (h - 17) / 3 * 0.5;
  return 0.2;
}

function drawTile(gx, gy) {
  var s = toScr(gx, gy);
  var sx = s.x * G.zm + G.camX, sy = s.y * G.zm + G.camY;
  var tw = TW * G.zm, th = TH * G.zm;
  // Check if on screen
  if (sx + tw < 0 || sx - tw > canvas.width || sy + th < -50 || sy - 50 > canvas.height) return;
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.lineTo(sx + tw / 2, sy + th / 2);
  ctx.lineTo(sx, sy + th);
  ctx.lineTo(sx - tw / 2, sy + th / 2);
  ctx.closePath();
  var d = dayLight();
  var gr = 120 * d + 50 | 0, gg = 190 * d + 40 | 0, gb = 90 * d + 30 | 0;
  ctx.fillStyle = 'rgb(' + gr + ',' + gg + ',' + gb + ')';
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,' + (0.03 + (1 - d) * 0.06) + ')';
  ctx.lineWidth = 0.5;
  ctx.stroke();
  // In build mode, show a subtle dot on empty tiles to indicate buildable
  if (G.selTool && !G.grid[gy][gx]) {
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath();
    ctx.arc(sx, sy + th / 2, 2 * G.zm, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawBuilding(gx, gy, cell) {
  var s = toScr(gx, gy);
  var sx = s.x * G.zm + G.camX, sy = s.y * G.zm + G.camY;
  var tw = TW * G.zm, th = TH * G.zm;
  var d = dayLight();

  if (cell.type === 'hq') {
    var bh = 42 * G.zm;
    // Top face
    ctx.beginPath();
    ctx.moveTo(sx, sy - bh); ctx.lineTo(sx + tw / 2, sy + th / 2 - bh);
    ctx.lineTo(sx, sy + th - bh); ctx.lineTo(sx - tw / 2, sy + th / 2 - bh);
    ctx.closePath();
    ctx.fillStyle = 'rgb(' + (255 * d | 0) + ',' + (200 * d | 0) + ',' + (100 * d | 0) + ')';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 2 * G.zm; ctx.stroke();
    // Right face
    ctx.beginPath();
    ctx.moveTo(sx, sy + th - bh); ctx.lineTo(sx + tw / 2, sy + th / 2 - bh);
    ctx.lineTo(sx + tw / 2, sy + th / 2); ctx.lineTo(sx, sy + th);
    ctx.closePath();
    ctx.fillStyle = 'rgb(' + (160 * d | 0) + ',' + (120 * d | 0) + ',' + (50 * d | 0) + ')';
    ctx.fill(); ctx.stroke();
    // Left face
    ctx.beginPath();
    ctx.moveTo(sx, sy + th - bh); ctx.lineTo(sx - tw / 2, sy + th / 2 - bh);
    ctx.lineTo(sx - tw / 2, sy + th / 2); ctx.lineTo(sx, sy + th);
    ctx.closePath();
    ctx.fillStyle = 'rgb(' + (200 * d | 0) + ',' + (155 * d | 0) + ',' + (65 * d | 0) + ')';
    ctx.fill(); ctx.stroke();
    // Label
    ctx.font = 'bold ' + Math.max(9, 10 * G.zm) + 'px system-ui';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,' + d + ')';
    ctx.fillText('COMPANY HQ', sx, sy - bh + 10 * G.zm);
    ctx.font = Math.max(16, 22 * G.zm) + 'px serif';
    ctx.fillText('\u{1F3E2}', sx, sy - bh - 2 * G.zm);
    return;
  }

  if (cell.type === 'corridor') {
    var ch = 4 * G.zm;
    // Flat raised tile
    ctx.beginPath();
    ctx.moveTo(sx, sy - ch); ctx.lineTo(sx + tw / 2 - 4 * G.zm, sy + th / 2 - ch);
    ctx.lineTo(sx, sy + th - ch - 2 * G.zm); ctx.lineTo(sx - tw / 2 + 4 * G.zm, sy + th / 2 - ch);
    ctx.closePath();
    var pc = 200 * d + 50 | 0;
    ctx.fillStyle = 'rgb(' + pc + ',' + (pc - 8) + ',' + (pc - 16) + ')';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.1)'; ctx.lineWidth = 1; ctx.stroke();
    return;
  }

  if (cell.type === 'tree') {
    // Trunk
    ctx.fillStyle = 'rgb(' + (100 * d + 30 | 0) + ',' + (70 * d + 20 | 0) + ',' + (40 * d + 10 | 0) + ')';
    ctx.fillRect(sx - 3 * G.zm, sy - 10 * G.zm, 6 * G.zm, 14 * G.zm);
    // Canopy
    ctx.beginPath();
    ctx.arc(sx, sy - 18 * G.zm, 12 * G.zm, 0, Math.PI * 2);
    ctx.fillStyle = 'rgb(' + (60 * d + 30 | 0) + ',' + (190 * d + 30 | 0) + ',' + (70 * d + 20 | 0) + ')';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 1.5 * G.zm; ctx.stroke();
    return;
  }

  var def = DEFS[cell.type];
  if (!def) return;
  var bh = def.height * G.zm;
  var r = parseInt(def.col.slice(1, 3), 16);
  var g = parseInt(def.col.slice(3, 5), 16);
  var b = parseInt(def.col.slice(5, 7), 16);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,' + (0.08 + (1 - d) * 0.08) + ')';
  ctx.beginPath();
  ctx.moveTo(sx, sy + th); ctx.lineTo(sx + tw / 2, sy + th / 2);
  ctx.lineTo(sx + tw / 2 + 6 * G.zm, sy + th / 2 + 4 * G.zm);
  ctx.lineTo(sx + 6 * G.zm, sy + th + 4 * G.zm);
  ctx.closePath(); ctx.fill();

  // Top face (bright)
  ctx.beginPath();
  ctx.moveTo(sx, sy - bh); ctx.lineTo(sx + tw / 2, sy + th / 2 - bh);
  ctx.lineTo(sx, sy + th - bh); ctx.lineTo(sx - tw / 2, sy + th / 2 - bh);
  ctx.closePath();
  ctx.fillStyle = 'rgb(' + Math.min(255, r * d + 40 | 0) + ',' + Math.min(255, g * d + 40 | 0) + ',' + Math.min(255, b * d + 40 | 0) + ')';
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 2 * G.zm; ctx.stroke();

  // Right face (dark)
  ctx.beginPath();
  ctx.moveTo(sx, sy + th - bh); ctx.lineTo(sx + tw / 2, sy + th / 2 - bh);
  ctx.lineTo(sx + tw / 2, sy + th / 2); ctx.lineTo(sx, sy + th);
  ctx.closePath();
  ctx.fillStyle = 'rgb(' + (r * 0.55 * d + 15 | 0) + ',' + (g * 0.55 * d + 15 | 0) + ',' + (b * 0.55 * d + 15 | 0) + ')';
  ctx.fill(); ctx.stroke();

  // Left face (medium)
  ctx.beginPath();
  ctx.moveTo(sx, sy + th - bh); ctx.lineTo(sx - tw / 2, sy + th / 2 - bh);
  ctx.lineTo(sx - tw / 2, sy + th / 2); ctx.lineTo(sx, sy + th);
  ctx.closePath();
  ctx.fillStyle = 'rgb(' + (r * 0.72 * d + 22 | 0) + ',' + (g * 0.72 * d + 22 | 0) + ',' + (b * 0.72 * d + 22 | 0) + ')';
  ctx.fill(); ctx.stroke();

  // Emoji
  ctx.font = Math.max(14, 18 * G.zm) + 'px serif';
  ctx.textAlign = 'center';
  ctx.fillText(def.emoji, sx, sy - bh + 6 * G.zm);
  // Label
  ctx.font = 'bold ' + Math.max(7, 8 * G.zm) + 'px system-ui';
  ctx.fillStyle = 'rgba(255,255,255,' + (d * 0.9) + ')';
  ctx.fillText(def.lbl, sx, sy - bh + 18 * G.zm);
}

function drawWorker(w) {
  var s = toScr(w.x, w.y);
  var sx = s.x * G.zm + G.camX, sy = s.y * G.zm + G.camY;
  var d = dayLight();
  var tc = EMP_TYPES[w.type] || EMP_TYPES.disengaged;
  var sm = tc.size; // size multiplier
  var z = G.zm;     // zoom shorthand
  var alpha = w.fadeOut;
  if (w.onboardDays > 0) alpha *= 0.7;
  if (w.type === 'disengaged') alpha *= 0.6;

  var skinR = (245 * d + 10) | 0, skinG2 = (215 * d + 20) | 0, skinB = (185 * d + 20) | 0;
  var skin = 'rgb(' + skinR + ',' + skinG2 + ',' + skinB + ')';
  var animT = G.gTime * 0.15 + w.id * 37; // per-worker animation phase

  // Ground shadow
  ctx.fillStyle = 'rgba(0,0,0,' + (0.12 * alpha) + ')';
  ctx.beginPath();
  ctx.ellipse(sx + 1 * z, sy + 2 * z, 6 * z * sm, 2.5 * z * sm, 0, 0, Math.PI * 2);
  ctx.fill();

  // Leader golden glow
  if (w.type === 'leader') {
    ctx.save();
    ctx.globalAlpha = 0.25 * alpha;
    ctx.fillStyle = '#FFD54F';
    ctx.beginPath();
    ctx.arc(sx, sy - 5 * z * sm, 10 * z * sm, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  ctx.globalAlpha = alpha;

  // Legs
  ctx.strokeStyle = tc.color;
  ctx.lineWidth = Math.max(1, 1.2 * z * sm);
  ctx.lineCap = 'round';
  var legSp = 2 * z * sm;
  var legTop = sy + 1 * z * sm;
  var legBot = sy + 5 * z * sm;
  ctx.beginPath();
  ctx.moveTo(sx - legSp, legTop); ctx.lineTo(sx - legSp, legBot);
  ctx.moveTo(sx + legSp, legTop); ctx.lineTo(sx + legSp, legBot);
  ctx.stroke();

  // Shoes
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(sx - legSp, legBot, 1.8 * z * sm, 0.8 * z * sm, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(sx + legSp, legBot, 1.8 * z * sm, 0.8 * z * sm, 0, 0, Math.PI * 2);
  ctx.fill();

  // Body (torso)
  ctx.fillStyle = tc.color;
  ctx.beginPath();
  ctx.ellipse(sx, sy - 2 * z * sm, 4.5 * z * sm, 5 * z * sm, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.12)';
  ctx.lineWidth = Math.max(0.5, 0.5 * z);
  ctx.stroke();

  // Arms with swing
  var armWave = Math.sin(animT * 0.06) * 2 * z * sm;
  ctx.strokeStyle = tc.color;
  ctx.lineWidth = Math.max(1, 1.2 * z * sm);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(sx - 4.5 * z * sm, sy - 3 * z * sm);
  ctx.lineTo(sx - 6.5 * z * sm, sy + 1 * z * sm + armWave);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(sx + 4.5 * z * sm, sy - 3 * z * sm);
  ctx.lineTo(sx + 6.5 * z * sm, sy + 1 * z * sm - armWave);
  ctx.stroke();

  // Hands
  ctx.fillStyle = skin;
  ctx.beginPath();
  ctx.arc(sx - 6.5 * z * sm, sy + 1 * z * sm + armWave, 1.2 * z * sm, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(sx + 6.5 * z * sm, sy + 1 * z * sm - armWave, 1.2 * z * sm, 0, Math.PI * 2);
  ctx.fill();

  // PIP red dashed border (around torso)
  if (w.pipActive) {
    ctx.save();
    ctx.setLineDash([2 * z, 2 * z]);
    ctx.strokeStyle = '#F87171';
    ctx.lineWidth = 1.2 * z;
    ctx.beginPath();
    ctx.ellipse(sx, sy - 2 * z * sm, 6 * z * sm, 7 * z * sm, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  // Onboarding blue dashed border
  if (w.onboardDays > 0 && !w.pipActive) {
    ctx.save();
    ctx.setLineDash([2 * z, 2 * z]);
    ctx.strokeStyle = '#60A5FA';
    ctx.lineWidth = 1.2 * z;
    ctx.beginPath();
    ctx.ellipse(sx, sy - 2 * z * sm, 6 * z * sm, 7 * z * sm, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  // Neck
  ctx.fillStyle = skin;
  ctx.fillRect(sx - 1 * z * sm, sy - 7.5 * z * sm, 2 * z * sm, 2 * z * sm);

  // Head
  ctx.fillStyle = skin;
  ctx.beginPath();
  ctx.arc(sx, sy - 9 * z * sm, 3.5 * z * sm, 0, Math.PI * 2);
  ctx.fill();

  // Hair
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.beginPath();
  ctx.arc(sx, sy - 10 * z * sm, 3.5 * z * sm, Math.PI, 0);
  ctx.fill();

  // Eyes
  ctx.fillStyle = '#1F2937';
  var eyeY = sy - 9 * z * sm;
  var eyeR = Math.max(0.5, 0.7 * z * sm);
  ctx.beginPath();
  ctx.arc(sx - 1.3 * z * sm, eyeY, eyeR, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(sx + 1.3 * z * sm, eyeY, eyeR, 0, Math.PI * 2);
  ctx.fill();

  // Mouth (happy for ace/leader, neutral for others, sad for disengaged)
  if (z * sm > 0.4) { // only draw when big enough to see
    ctx.strokeStyle = '#1F2937';
    ctx.lineWidth = Math.max(0.4, 0.5 * z * sm);
    ctx.lineCap = 'round';
    var mY = sy - 7.5 * z * sm;
    var mW = 1.2 * z * sm;
    ctx.beginPath();
    if (w.type === 'ace' || w.type === 'leader') {
      ctx.moveTo(sx - mW, mY); ctx.quadraticCurveTo(sx, mY + 1.5 * z * sm, sx + mW, mY);
    } else if (w.type === 'disengaged') {
      ctx.moveTo(sx - mW, mY + 0.5 * z * sm); ctx.quadraticCurveTo(sx, mY - 1 * z * sm, sx + mW, mY + 0.5 * z * sm);
    } else {
      ctx.moveTo(sx - mW, mY); ctx.lineTo(sx + mW, mY);
    }
    ctx.stroke();
  }

  // Type emoji above head (when no speech bubble)
  if (!w.bubble || w.bubbleTimer <= 0) {
    ctx.font = Math.max(8, 7 * z * sm) + 'px serif';
    ctx.textAlign = 'center';
    ctx.fillText(tc.emoji, sx, sy - 14 * z * sm);
  }

  ctx.globalAlpha = 1;

  // Speech bubble
  if (w.bubble && w.bubbleTimer > 0) {
    drawBubble(sx, sy - 16 * z * sm, w.bubble);
  }

  // Emoji reaction bubble (dramatic feedback)
  if (G.emojiReactions) {
    var now = Date.now();
    for (var ei = 0; ei < G.emojiReactions.length; ei++) {
      var er = G.emojiReactions[ei];
      if (er.workerId === w.id) {
        var elapsed = now - er.startTime;
        if (elapsed < 2000) {
          var ealpha = 1 - elapsed / 2000;
          var floatY = -18 * z * sm - (elapsed / 2000) * 20 * z;
          ctx.save();
          ctx.globalAlpha = ealpha;
          ctx.font = Math.max(10, 14 * z * sm) + 'px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(er.emoji, sx, sy + floatY);
          ctx.restore();
        }
      }
    }
  }
}

function drawBubble(x, y, text) {
  ctx.font = Math.max(11, 10 * G.zm) + 'px system-ui';
  var tw = ctx.measureText(text).width + 14 * G.zm;
  var th = 18 * G.zm;
  var bx = x - tw / 2, by = y - th - 6 * G.zm;

  // Rounded rect
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.beginPath();
  var r = 6 * G.zm;
  ctx.moveTo(bx + r, by);
  ctx.lineTo(bx + tw - r, by);
  ctx.quadraticCurveTo(bx + tw, by, bx + tw, by + r);
  ctx.lineTo(bx + tw, by + th - r);
  ctx.quadraticCurveTo(bx + tw, by + th, bx + tw - r, by + th);
  ctx.lineTo(bx + r, by + th);
  ctx.quadraticCurveTo(bx, by + th, bx, by + th - r);
  ctx.lineTo(bx, by + r);
  ctx.quadraticCurveTo(bx, by, bx + r, by);
  ctx.closePath();
  ctx.fill();

  // Triangle
  ctx.beginPath();
  ctx.moveTo(x - 4 * G.zm, by + th);
  ctx.lineTo(x, by + th + 5 * G.zm);
  ctx.lineTo(x + 4 * G.zm, by + th);
  ctx.closePath();
  ctx.fill();

  // Text
  ctx.fillStyle = '#1a1a2e';
  ctx.textAlign = 'center';
  ctx.fillText(text, x, by + th - 5 * G.zm);
}

function drawGhost(gx, gy) {
  if (!G.selTool || G.selTool === 'bulldoze') return;
  if (!inBounds(gx, gy)) return;
  var s = toScr(gx, gy);
  var sx = s.x * G.zm + G.camX, sy = s.y * G.zm + G.camY;
  var tw = TW * G.zm, th = TH * G.zm;
  var canPlace = !G.grid[gy][gx] && G.money >= (DEFS[G.selTool] ? DEFS[G.selTool].cost : 0);
  ctx.globalAlpha = 0.5;
  ctx.beginPath();
  ctx.moveTo(sx, sy); ctx.lineTo(sx + tw / 2, sy + th / 2);
  ctx.lineTo(sx, sy + th); ctx.lineTo(sx - tw / 2, sy + th / 2);
  ctx.closePath();
  ctx.fillStyle = canPlace ? 'rgba(76,175,80,0.4)' : 'rgba(244,67,54,0.4)';
  ctx.fill();
  ctx.strokeStyle = canPlace ? '#4CAF50' : '#F44336';
  ctx.lineWidth = 2 * G.zm;
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawMinimap() {
  mmX.fillStyle = '#1a2a1a';
  mmX.fillRect(0, 0, 140, 105);
  var scale = 140 / GRID;
  for (var i = 0; i < G.bldgs.length; i++) {
    var b = G.bldgs[i];
    var def = DEFS[b.type];
    mmX.fillStyle = def ? def.col : '#FFD54F';
    mmX.fillRect(b.gx * scale, b.gy * scale, Math.max(2, scale), Math.max(2, scale));
  }
  // HQ
  var hx = Math.floor(GRID / 2), hy = Math.floor(GRID / 2);
  mmX.fillStyle = '#FFD54F';
  mmX.fillRect(hx * scale - 1, hy * scale - 1, 4, 4);
  // Workers
  for (var i = 0; i < G.workers.length; i++) {
    var w = G.workers[i];
    if (w.quitting && w.fadeOut <= 0) continue;
    var tc = EMP_TYPES[w.type];
    mmX.fillStyle = tc ? tc.color : '#aaa';
    mmX.fillRect(w.x * scale, w.y * scale, 2, 2);
  }
}

// ============================================================
// MAIN RENDER
// ============================================================
function render() {
  // Prune expired emoji reactions
  if (G.emojiReactions && G.emojiReactions.length > 0) {
    var now = Date.now();
    G.emojiReactions = G.emojiReactions.filter(function(r) { return now - r.startTime < 2000; });
  }
  var d = dayLight();
  // Sky gradient
  var skyR = 180 * d + 60 | 0, skyG = 210 * d + 50 | 0, skyB = 240 * d + 15 | 0;
  ctx.fillStyle = 'rgb(' + skyR + ',' + skyG + ',' + skyB + ')';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Collect all renderable items sorted by iso depth (painter's algorithm)
  var items = [];

  // Tiles and buildings
  for (var gy = 0; gy < GRID; gy++) {
    for (var gx = 0; gx < GRID; gx++) {
      items.push({type: 'tile', gx: gx, gy: gy, depth: gx + gy});
      if (G.grid[gy][gx]) {
        items.push({type: 'building', gx: gx, gy: gy, cell: G.grid[gy][gx], depth: gx + gy + 0.1});
      }
    }
  }

  // Workers
  for (var i = 0; i < G.workers.length; i++) {
    var w = G.workers[i];
    if (w.quitting && w.fadeOut <= 0) continue;
    items.push({type: 'worker', worker: w, depth: Math.round(w.x) + Math.round(w.y) + 0.2});
  }

  items.sort(function(a, b) { return a.depth - b.depth; });

  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    if (it.type === 'tile') drawTile(it.gx, it.gy);
    else if (it.type === 'building') drawBuilding(it.gx, it.gy, it.cell);
    else if (it.type === 'worker') drawWorker(it.worker);
  }

  // Ghost preview
  if (G.selTool && G.mouseGX >= 0) {
    drawGhost(G.mouseGX, G.mouseGY);
  }

  drawMinimap();
}

// ============================================================
// GAME TICK
// ============================================================
function gameTick() {
  if (G.gameOver) return;

  // Advance time
  G.gTime += G.gSpeed;
  if (G.gTime >= 1440) {
    G.gTime -= 1440;
    G.gDay++;
    dayTick();
  }

  // Event timer
  G.eventTimer += 1;
  if (!G.eventActive && G.eventTimer > (20 + Math.random() * 10) * 60) {
    G.eventTimer = 0;
    triggerRandomEvent();
  }

  // Event countdown
  if (G.eventActive && G.eventCountdown > 0) {
    G.eventCountdown -= G.gSpeed / 60;
    updateEventTimer();
    if (G.eventCountdown <= 0) {
      autoPickWorst();
    }
  }

  // Worker AI
  updateWorkers();

  // Spawn timer (disabled — workers now come from hiring panel)
  // G.spawnTimer += G.gSpeed;
  // if (G.spawnTimer > 600) {
  //   G.spawnTimer = 0;
  //   maybeSpawnWorker();
  // }

  // Policy activation
  updatePolicies();

  // Metric drift
  updateMetrics();

  // Buff timers (per day handled in dayTick)

  // Welfare just-built timer
  if (G.welfareTimer > 0) {
    G.welfareTimer -= G.gSpeed;
    if (G.welfareTimer <= 0) G.welfareJustBuilt = false;
  }

  // Win/lose check
  checkWinLose();
}

function dayTick() {
  // Revenue and expenses
  var rev = 0;
  for (var i = 0; i < G.bldgs.length; i++) {
    var def = DEFS[G.bldgs[i].type];
    if (def && def.rev > 0) rev += def.rev;
  }
  // Employee multiplier (only assigned workers contribute revenue)
  var empMult = 0;
  var aliveWorkers = G.workers.filter(function(w) { return !w.quitting; });
  var assignedWorkers = aliveWorkers.filter(function(w) { return w.assignedDept; });
  for (var i = 0; i < assignedWorkers.length; i++) {
    var tc = EMP_TYPES[assignedWorkers[i].type];
    var rm = tc ? tc.revMult : 0.5;
    if (assignedWorkers[i].onboardDays > 0) rm *= 0.5; // onboarding halved productivity
    empMult += rm;
  }
  if (assignedWorkers.length > 0) empMult /= assignedWorkers.length;
  else empMult = 0;
  // Labor tension slowdown (-20% at tension 60+)
  if (G.laborTension >= 60) empMult *= 0.8;

  // Onboarding countdown
  for (var i = 0; i < aliveWorkers.length; i++) {
    if (aliveWorkers[i].onboardDays > 0) {
      aliveWorkers[i].onboardDays--;
      if (aliveWorkers[i].onboardDays <= 0) {
        showToast('\uC9C1\uC6D0 #' + aliveWorkers[i].id + ' \uC218\uC2B5 \uC644\uB8CC! \uC815\uC2DD \uBC30\uCE58\uB418\uC5C8\uC2B5\uB2C8\uB2E4', 'success');
      }
    }
  }

  rev = Math.round(rev * empMult * G.revPenalty);
  if (policyActive('rewards')) rev = Math.round(rev * 1.1);
  if (policyActive('coordination')) rev = Math.round(rev * 1.15);
  rev += 40; // HQ base revenue

  // Strike: no revenue
  if (G.strikeActive) rev = 0;

  var expenses = 0;
  for (var i = 0; i < G.bldgs.length; i++) {
    var def = DEFS[G.bldgs[i].type];
    if (def) expenses += def.upkeep;
  }
  for (var j = 0; j < aliveWorkers.length; j++) {
    var salMap = {ace:6, rookie:3, cynic:4, disengaged:2, leader:8};
    var baseSal = salMap[aliveWorkers[j].type] || 3;
    expenses += Math.round(baseSal * (aliveWorkers[j].salaryLevel || 1));
  }

  G.money += rev - expenses;

  // Buff countdown
  if (G.revPenaltyDays > 0) {
    G.revPenaltyDays--;
    if (G.revPenaltyDays <= 0) G.revPenalty = 1;
  }
  if (G.rookieGrowthDays > 0) {
    G.rookieGrowthDays--;
    if (G.rookieGrowthDays <= 0) G.rookieGrowthBuff = 1;
  }
  if (G.delayedCustDays > 0) {
    G.delayedCustDays--;
    if (G.delayedCustDays <= 0 && G.delayedCust > 0) {
      G.custSat = Math.min(100, G.custSat + G.delayedCust);
      G.delayedCust = 0;
      showToast('\uD601\uC2E0 \uD22C\uC790 \uD6A8\uACFC \uBC1C\uC0DD! \uACE0\uAC1D\uB9CC\uC871 +', 'success');
    }
  }

  // --- Pending followup events ---
  if (G.pendingFollowups && G.pendingFollowups.length > 0) {
    var triggered = [];
    var remaining = [];
    for (var fi = 0; fi < G.pendingFollowups.length; fi++) {
      if (G.pendingFollowups[fi].triggerDay <= G.gDay) {
        triggered.push(G.pendingFollowups[fi].event);
      } else {
        remaining.push(G.pendingFollowups[fi]);
      }
    }
    G.pendingFollowups = remaining;
    // Queue followups through pendingModals to avoid overlap
    for (var ti = 0; ti < triggered.length; ti++) {
      G.pendingModals.push({type: 'followup', data: triggered[ti]});
    }
  }

  // Ongoing compensation strategy effects (quarterly check)
  if (G.compStrategy === 'equal' && G.gDay % 15 === 0 && G.gDay > 1) {
    var aliveForComp = getAliveWorkers();
    for (var ci = 0; ci < aliveForComp.length; ci++) {
      if (aliveForComp[ci].type === 'ace' && Math.random() < 0.1) {
        aliveForComp[ci].quitCountdown = aliveForComp[ci].quitCountdown || 30;
        showToast('\u26A0\uFE0F \uC5D0\uC774\uC2A4 #' + aliveForComp[ci].id + ' \uADE0\uB4F1\uBD84\uBC30\uC5D0 \uBD88\uB9CC \u2014 \uC774\uD0C8 \uC704\uD5D8!', 'warn');
      }
    }
  }

  // Auto-refresh hiring candidates every 15 days
  if (G.gDay % 15 === 0) generateCandidates();

  // Quarterly strategy meeting (every 15 days)
  if (G.gDay > 1 && G.gDay % 15 === 0 && !G.stratShownThisQ) {
    G.stratShownThisQ = true;
    setTimeout(function() { showStrategyMeeting(); }, 500);
  }
  if (G.gDay % 15 === 1) G.stratShownThisQ = false;

  // --- Labor tension ---
  if (G.empHap < 20) G.laborTension = Math.min(100, G.laborTension + 5);
  else if (G.empHap < 30) G.laborTension = Math.min(100, G.laborTension + 2);
  if (G.empHap > 60) G.laborTension = Math.max(0, G.laborTension - 1);
  if (G.hasWorksCouncil) G.laborTension = Math.max(0, G.laborTension - 2);
  if (policyActive('horizontal')) G.laborTension = Math.max(0, G.laborTension - 1);

  // Labor tension thresholds
  if (G.laborTension >= 30 && G.laborTension < 32) {
    showToast('\uB178\uC0AC \uAC08\uB4F1 \uC870\uC9D0\uC774 \uBCF4\uC785\uB2C8\uB2E4', 'warn');
  }
  // Strike check at 80+
  if (G.laborTension >= 80 && !G.strikeActive && !G.eventActive && Math.random() < 0.4) {
    showStrikeEvent();
  }

  // Strike countdown
  if (G.strikeActive) {
    G.strikeDays--;
    if (G.strikeDays <= 0) {
      G.strikeActive = false;
      showToast('\uD30C\uC5C5\uC774 \uC885\uB8CC\uB418\uC5C8\uC2B5\uB2C8\uB2E4', 'success');
    }
  }

  // --- Salary raise requests (aces and leaders, every 20-40 days) ---
  for (var ri = 0; ri < aliveWorkers.length; ri++) {
    var rw = aliveWorkers[ri];
    if (rw.type !== 'ace' && rw.type !== 'leader') continue;
    if ((G.gDay - (rw.lastRaiseDay || 0)) < 25) continue;
    if (Math.random() > 0.015) continue; // ~30% over 20 days ≈ 1.5% per day
    // Queue raise request
    G.pendingModals.push({type: 'raise', workerId: rw.id});
  }

  // --- Internal equity complaint ---
  for (var ei = 0; ei < aliveWorkers.length; ei++) {
    var ew = aliveWorkers[ei];
    if ((ew.salaryLevel || 1) > 1.3) {
      // Check if same-type workers at 1.0 exist
      var sameTypeWorkers = aliveWorkers.filter(function(ww) {
        return ww.id !== ew.id && ww.type === ew.type && (ww.salaryLevel || 1) <= 1.0 && !ww.quitting;
      });
      if (sameTypeWorkers.length > 0 && Math.random() < 0.03) {
        var complainer = sameTypeWorkers[Math.floor(Math.random() * sameTypeWorkers.length)];
        complainer.bubble = SPEECH.equity_complaint[0];
        complainer.bubbleTimer = 200;
        complainer.happiness = Math.max(0, complainer.happiness - 5);
        G.empHap = Math.max(0, G.empHap - 5);
      }
    }
  }

  // Process pending modals (one at a time)
  if (!G.eventActive && G.pendingModals.length > 0) {
    var pending = G.pendingModals.shift();
    if (pending.type === 'raise') {
      var raiseWorker = G.workers.find(function(ww) { return ww.id === pending.workerId && !ww.quitting; });
      if (raiseWorker) showRaiseRequest(raiseWorker);
    } else if (pending.type === 'followup') {
      showFollowupModal(pending.data);
    }
  }

  // Update HUD after economy
  updateHUD();
}

function updateMetrics() {
  // Building-based metric growth
  for (var i = 0; i < G.bldgs.length; i++) {
    var def = DEFS[G.bldgs[i].type];
    if (def && def.metric && def.metricAmt) {
      if (def.metric === 'cust') G.custSat = Math.min(100, G.custSat + def.metricAmt * G.gSpeed / 60);
      if (def.metric === 'emp') G.empHap = Math.min(100, G.empHap + def.metricAmt * G.gSpeed / 60);
      if (def.metric === 'soc') G.socVal = Math.min(100, G.socVal + def.metricAmt * G.gSpeed / 60);
    }
  }

  // Policy bonuses
  var polKeys = Object.keys(G.activePolicies);
  for (var p = 0; p < polKeys.length; p++) {
    var pol = POLICIES.find(function(pp) { return pp.id === polKeys[p]; });
    if (pol) {
      G.custSat = Math.min(100, G.custSat + pol.custBonus * 0.001 * G.gSpeed);
      G.empHap = Math.min(100, G.empHap + pol.empBonus * 0.001 * G.gSpeed);
      G.socVal = Math.min(100, G.socVal + pol.socBonus * 0.001 * G.gSpeed);
    }
  }

  // Natural decay
  G.custSat = Math.max(0, G.custSat - 0.002 * G.gSpeed);
  G.empHap = Math.max(0, G.empHap - 0.003 * G.gSpeed);
  G.socVal = Math.max(0, G.socVal - 0.002 * G.gSpeed);

  // Rating
  G.rating = clamp(1, 5, (G.custSat + G.empHap + G.socVal) / 60 + G.ratingBonus);
}

function updateWorkers() {
  var hx = Math.floor(GRID / 2), hy = Math.floor(GRID / 2);
  for (var i = G.workers.length - 1; i >= 0; i--) {
    var w = G.workers[i];
    var tc = EMP_TYPES[w.type] || EMP_TYPES.disengaged;

    // Quitting animation
    if (w.quitting) {
      // Move toward HQ
      var dx = hx - w.x, dy = hy - w.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > 0.5) {
        w.x += (dx / dist) * 0.03 * G.gSpeed;
        w.y += (dy / dist) * 0.03 * G.gSpeed;
      } else {
        w.fadeOut -= 0.02 * G.gSpeed;
        if (w.fadeOut <= 0) {
          G.workers.splice(i, 1);
        }
      }
      continue;
    }

    // Strike speech
    if (G.strikeActive && !w.bubble) {
      w.bubble = SPEECH.strike_active[0];
      w.bubbleTimer = 300;
    }

    // Speech cooldown
    w.speechCooldown -= G.gSpeed;
    if (w.speechCooldown <= 0 && !w.bubble) {
      w.speechCooldown = 200 + Math.random() * 300;
      assignSpeech(w);
    }

    // Bubble timer
    if (w.bubbleTimer > 0) {
      w.bubbleTimer -= G.gSpeed;
      if (w.bubbleTimer <= 0) w.bubble = null;
    }

    // State timer
    w.stateTimer -= G.gSpeed;
    if (w.stateTimer <= 0) {
      pickNewTarget(w);
    }

    // Move along path
    if (w.path && w.path.length > 0 && w.pathIdx < w.path.length) {
      var target = w.path[w.pathIdx];
      var dx = target.x - w.x, dy = target.y - w.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      var spd = tc.speed * 0.02 * G.gSpeed;
      if (dist < spd) {
        w.x = target.x; w.y = target.y;
        w.pathIdx++;
      } else {
        w.x += (dx / dist) * spd;
        w.y += (dy / dist) * spd;
      }
    }

    // Type transitions
    w.transitionCooldown -= G.gSpeed;
    if (w.transitionCooldown <= 0) {
      w.transitionCooldown = 300 + Math.random() * 300;
      attemptTransition(w);
    }

    // Happiness drain for bad conditions
    if (!hasBuilding('cafeteria') && !hasBuilding('wellness')) {
      w.happiness = Math.max(0, w.happiness - 0.005 * G.gSpeed);
    }

    // Quit check
    if (w.happiness <= 0 && w.preventQuitDays <= 0) {
      w.quitting = true;
      w.bubble = SPEECH.quitting[0];
      w.bubbleTimer = 120;
      sfxQuit();
      G.totalQuits++;

      // Knowledge transfer penalty on departure
      if (w.assignedDept) {
        var quitDept = w.assignedDept;
        var capPenalty = (w.type === 'leader') ? 15 : (w.type === 'ace') ? 10 : 5 + Math.floor(Math.random() * 6);
        var willPenalty = (w.type === 'leader') ? 10 : 0;
        // Academy or documentation halves the penalty
        if (hasBuilding('academy')) { capPenalty = Math.ceil(capPenalty * 0.5); willPenalty = Math.ceil(willPenalty * 0.5); }
        var deptDef = DEFS[quitDept.type];
        var deptName = deptDef ? deptDef.lbl : quitDept.type;
        var affected = 0;
        for (var k = 0; k < G.workers.length; k++) {
          var co = G.workers[k];
          if (co === w || co.quitting) continue;
          if (co.assignedDept && co.assignedDept.gx === quitDept.gx && co.assignedDept.gy === quitDept.gy) {
            co.capability = Math.max(0, co.capability - capPenalty);
            if (willPenalty > 0) co.will = Math.max(0, co.will - willPenalty);
            co.bubble = '\uACBD\uD5D8 \uB9CE\uC740 \uBD84\uC774 \uB5A0\uB098\uB2C8 \uBD88\uC548\uD558\uB2E4...';
            co.bubbleTimer = 150;
            affected++;
          }
        }
        if (affected > 0) {
          showToast('\uD575\uC2EC \uC778\uC7AC \uD1F4\uC0AC! ' + deptName + ' \uC5ED\uB7C9 \uD558\uB77D', 'warn');
        }
      }
    }

    // Prevent quit countdown (per day in dayTick is approximate, use ticks)
    if (w.preventQuitDays > 0) {
      w.preventQuitDays -= G.gSpeed / 1440;
    }

    // Quit timer (from rejected raise)
    if (w.quitTimer > 0) {
      w.quitTimer -= G.gSpeed / 1440;
      if (w.quitTimer <= 0 && !w.quitting && w.preventQuitDays <= 0) {
        w.quitting = true;
        w.bubble = SPEECH.quitting[0];
        w.bubbleTimer = 120;
        sfxQuit();
        G.totalQuits++;
        G.laborTension = Math.min(100, G.laborTension + 8);
      }
    }

    // PIP countdown
    if (w.pipActive && w.pipDays > 0) {
      w.pipDays -= G.gSpeed / 1440;
      // Check if improved during PIP
      if (w.will > 40 && w.capability > 40) {
        w.pipActive = false;
        w.pipDays = 0;
        showToast('\uC9C1\uC6D0 #' + w.id + ' PIP \uC131\uACF5\uC801 \uAC1C\uC120! PIP \uD574\uC81C', 'success');
      }
      // PIP expired without improvement
      if (w.pipDays <= 0 && w.pipActive) {
        w.pipDays = 0;
        showPIPExpiryModal(w);
      }
    }
  }
}

function pickNewTarget(w) {
  var hx = Math.floor(GRID / 2), hy = Math.floor(GRID / 2);

  // If assigned to a department, pathfind there
  if (w.assignedDept) {
    var deptGx = w.assignedDept.gx;
    var deptGy = w.assignedDept.gy;
    // Go to adjacent corridor of dept (offset by 1 toward center)
    var adjX = deptGx + (deptGx > hx ? -1 : deptGx < hx ? 1 : 0);
    var adjY = deptGy + (deptGy > hy ? -1 : deptGy < hy ? 1 : 0);
    var path = bfsPath(w.x, w.y, adjX, adjY);
    if (path.length > 0) {
      w.path = path;
      w.pathIdx = 0;
      w.stateTimer = 200 + Math.random() * 200;
    } else {
      // Fallback: go directly to dept
      path = bfsPath(w.x, w.y, deptGx, deptGy);
      if (path.length > 0) { w.path = path; w.pathIdx = 0; }
      w.stateTimer = 200 + Math.random() * 200;
    }
    return;
  }

  // Unassigned workers stay near HQ
  var nearHqX = hx + Math.floor(Math.random() * 3) - 1;
  var nearHqY = hy + Math.floor(Math.random() * 3) - 1;
  var path = bfsPath(w.x, w.y, nearHqX, nearHqY);
  if (path.length > 0) {
    w.path = path;
    w.pathIdx = 0;
  }
  w.stateTimer = 120 + Math.random() * 120;
}

function attemptTransition(w) {
  // Rookie -> Ace (if Academy + OJT)
  if (w.type === 'rookie' && hasBuilding('academy') && policyActive('ojt')) {
    var chance = 0.03 * G.rookieGrowthBuff;
    if (Math.random() < chance) {
      w.type = 'ace';
      w.will = 70; w.capability = 70; w.happiness = 60;
      w.bubble = SPEECH.transition_cynic_ace[0];
      w.bubbleTimer = 120;
      sfxLevelUp();
      showToast('\u{1F525} \uC9C1\uC6D0 #' + w.id + ' \uC5D0\uC774\uC2A4\uB85C \uC131\uC7A5!', 'success');
      G.totalAceTransitions++;
    }
  }
  // Cynic -> Ace (if VWBE + Wellness)
  if (w.type === 'cynic' && policyActive('vwbe') && hasBuilding('wellness')) {
    if (Math.random() < 0.02) {
      w.type = 'ace';
      w.will = 65; w.capability = 65; w.happiness = 55;
      w.bubble = SPEECH.transition_cynic_ace[0];
      w.bubbleTimer = 120;
      sfxLevelUp();
      showToast('\u{1F525} \uC9C1\uC6D0 #' + w.id + ' \uC5D0\uC774\uC2A4\uB85C \uC131\uC7A5!', 'success');
      G.totalCynicRecoveries++;
      G.totalAceTransitions++;
    }
  }
  // Ace -> Cynic (burnout, if no wellness and high workload)
  if (w.type === 'ace' && !hasBuilding('wellness') && !hasBuilding('cafeteria')) {
    if (Math.random() < 0.008) {
      w.type = 'cynic';
      w.will -= 20; w.happiness -= 20;
      w.bubble = SPEECH.transition_ace_cynic[0];
      w.bubbleTimer = 120;
      sfxSad();
      showToast('\u{1F9CA} \uC9C1\uC6D0 #' + w.id + ' \uBC88\uC544\uC6C3\uC73C\uB85C \uB0C9\uC18C\uD30C \uC804\uD658', 'warn');
    }
  }
  // Rookie -> Disengaged (neglect, if no academy and no OJT)
  if (w.type === 'rookie' && !hasBuilding('academy') && !policyActive('ojt')) {
    if (Math.random() < 0.01) {
      w.type = 'disengaged';
      w.will -= 15; w.happiness -= 15;
      showToast('\u{1F634} \uC2E0\uC785 #' + w.id + ' \uBC29\uCE58\uB85C \uBB34\uAE30\uB825\uD654', 'warn');
    }
  }
}

function assignSpeech(w) {
  var lines = null;
  // Onboarding speech override
  if (w.onboardDays > 0) {
    w.bubble = '\uC801\uC751 \uC911...';
    w.bubbleTimer = 120;
    return;
  }
  // PIP speech override
  if (w.pipActive) {
    lines = Math.random() < 0.5 ? SPEECH.pip_motivated : SPEECH.pip_frustrated;
    w.bubble = lines[Math.floor(Math.random() * lines.length)];
    w.bubbleTimer = 120;
    return;
  }
  if (w.type === 'disengaged') {
    if (G.welfareJustBuilt) lines = SPEECH.after_welfare;
    else if (hasBuilding('academy')) lines = SPEECH.disengaged_academy;
    else lines = SPEECH.disengaged_no_welfare;
  } else if (w.type === 'cynic') {
    if (policyActive('vwbe')) lines = SPEECH.cynic_vwbe;
    else lines = SPEECH.cynic_no_vwbe;
  } else if (w.type === 'rookie') {
    if (policyActive('ojt')) lines = SPEECH.rookie_ojt;
    else lines = SPEECH.rookie_no_ojt;
  } else if (w.type === 'ace') {
    if (G.empHap > 60) lines = SPEECH.ace_good;
    else lines = SPEECH.ace_scout;
  } else if (w.type === 'leader') {
    if (G.empHap > 50) lines = SPEECH.leader_good;
    else lines = SPEECH.leader_overwhelmed;
  }
  if (lines) {
    w.bubble = lines[Math.floor(Math.random() * lines.length)];
    w.bubbleTimer = 120;
  }
}

function maybeSpawnWorker() {
  var hrCount = countBuilding('hr');
  if (hrCount <= 0) return;
  var aliveCount = G.workers.filter(function(w) { return !w.quitting; }).length;
  if (aliveCount >= hrCount * 6 + 12) return; // cap
  var hx = Math.floor(GRID / 2), hy = Math.floor(GRID / 2);
  var type = Math.random() < 0.6 ? 'rookie' : 'cynic';
  spawnWorker(type, hx, hy);
  showToast('\uC0C8 \uC9C1\uC6D0\uC774 \uC785\uC0AC\uD588\uC2B5\uB2C8\uB2E4! (' + type + ')', 'info');
}

var HIRE_NAMES = ['김','이','박','최','정','강','조','윤','장','임','한','오','서','신','권','황','안','송','전','홍'];
var HIRE_DESCS = {
  rookie: ['열정은 있지만 경험이 부족합니다','배우고 싶은 마음이 큰 신입입니다','빠르게 성장할 잠재력이 보입니다'],
  cynic: ['실력은 좋은데 전 직장에서 지쳤다네요','능력은 검증됐지만 의욕이 낮습니다','경험이 풍부하지만 냉소적입니다'],
  ace: ['업계에서 인정받는 인재입니다','즉시 전력감, 단 몸값이 높습니다','열정과 실력을 겸비한 핵심 인재'],
  leader: ['10년차 팀장급, 조직을 이끌 수 있습니다','리더십이 검증된 시니어입니다','팀 문화를 바꿀 수 있는 인물입니다']
};
var HIRE_COSTS = {rookie: 150, cynic: 350, ace: 800, leader: 1200};

function generateCandidates() {
  var candidates = [];
  candidates.push(makeCandidate('rookie'));
  candidates.push(makeCandidate('rookie'));
  candidates.push(makeCandidate('cynic'));
  if (Math.random() < 0.5) candidates.push(makeCandidate('ace'));
  if (Math.random() < 0.2) candidates.push(makeCandidate('leader'));
  if (hasBuilding('hr')) {
    candidates.push(makeCandidate(Math.random() < 0.4 ? 'ace' : 'rookie'));
  }
  G.hireCandidates = candidates;
}

function makeCandidate(type) {
  var descs = HIRE_DESCS[type];
  var tc = EMP_TYPES[type];
  var baseCap = type === 'ace' ? 70+Math.random()*20 : type === 'leader' ? 75+Math.random()*15 : type === 'cynic' ? 60+Math.random()*20 : 20+Math.random()*25;
  var baseWill = type === 'ace' ? 65+Math.random()*20 : type === 'leader' ? 75+Math.random()*15 : type === 'rookie' ? 60+Math.random()*25 : 20+Math.random()*20;
  return {
    name: HIRE_NAMES[Math.random()*HIRE_NAMES.length|0] + 'OO',
    type: type,
    cost: HIRE_COSTS[type],
    desc: descs[Math.random()*descs.length|0],
    capability: Math.round(baseCap),
    will: Math.round(baseWill),
    emoji: tc.emoji,
    color: tc.color
  };
}

function updatePolicies() {
  var keys = Object.keys(G.activatingPolicies);
  for (var i = 0; i < keys.length; i++) {
    var pid = keys[i];
    G.activatingPolicies[pid] -= G.gSpeed / 60;
    if (G.activatingPolicies[pid] <= 0) {
      delete G.activatingPolicies[pid];
      G.activePolicies[pid] = true;
      if (pid === 'council') G.hasWorksCouncil = true;
      sfxPolicy();
      showToast(POLICIES.find(function(p){return p.id===pid;}).nameKo + ' \uD65C\uC131\uD654!', 'success');
      renderPolicyPanel();
    }
  }
}

function checkWinLose() {
  if (G.gameOver) return;
  // Lose: money <= 0
  if (G.money <= 0) {
    G.gameOver = true;
    G.gameWon = false;
    saveRanking();
    clearSave();
    showReport();
    return;
  }
  // Lose: all quit
  var alive = G.workers.filter(function(w) { return !w.quitting; });
  if (alive.length === 0 && G.gDay > 2) {
    G.gameOver = true;
    G.gameWon = false;
    saveRanking();
    clearSave();
    showReport();
    return;
  }
  // Win conditions depend on scenario
  if (G.scenario === 2) {
    // Scenario 2: all metrics >= thresholds for WIN_DAYS_S2 days
    if (G.custSat >= 75 && G.empHap >= 65 && G.socVal >= 60 && G.rating >= 4.0) {
      G.winDays += G.gSpeed / 1440;
      if (G.winDays >= WIN_DAYS_S2) {
        G.gameOver = true;
        G.gameWon = true;
        saveRanking();
        clearSave();
        showReport();
      }
    } else {
      G.winDays = Math.max(0, G.winDays - G.gSpeed / 1440 * 0.5);
    }
  } else {
    // Scenario 1: rating >= 3.0 for WIN_DAYS_S1 days
    if (G.rating >= 3.0) {
      G.winDays += G.gSpeed / 1440;
      if (G.winDays >= WIN_DAYS_S1) {
        G.gameOver = true;
        G.gameWon = true;
        saveRanking();
        clearSave();
        showReport();
      }
    } else {
      G.winDays = Math.max(0, G.winDays - G.gSpeed / 1440 * 0.5);
    }
  }
}

function updateHUD() {
  var el;
  el = document.getElementById('hud-money');
  if (el) el.textContent = G.money.toLocaleString();
  el = document.getElementById('hud-workers');
  if (el) el.textContent = G.workers.filter(function(w){return !w.quitting;}).length;
  el = document.getElementById('hud-rating');
  if (el) el.textContent = G.rating.toFixed(1);
  el = document.getElementById('hud-cust');
  if (el) el.textContent = Math.round(G.custSat);
  el = document.getElementById('hud-emp');
  if (el) el.textContent = Math.round(G.empHap);
  el = document.getElementById('hud-soc');
  if (el) el.textContent = Math.round(G.socVal);
  // Labor tension HUD
  var laborStat = document.getElementById('hud-labor-stat');
  var laborVal = document.getElementById('hud-labor');
  if (laborStat && laborVal) {
    if (G.laborTension > 20) {
      laborStat.style.display = '';
      laborVal.textContent = Math.round(G.laborTension) + '%';
      laborVal.style.color = G.laborTension > 50 ? '#F87171' : '#FFB830';
    } else {
      laborStat.style.display = 'none';
    }
  }
  el = document.getElementById('hud-day');
  if (el) el.textContent = 'Day ' + G.gDay;
  el = document.getElementById('hud-clock');
  if (el) {
    var h = Math.floor(G.gTime / 60), m = Math.floor(G.gTime % 60);
    el.textContent = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }
  var winEl = document.getElementById('hud-win');
  if (winEl) {
    var winTarget = G.scenario === 2 ? WIN_DAYS_S2 : WIN_DAYS_S1;
    var winMet = (G.scenario === 2)
      ? (G.custSat >= 75 && G.empHap >= 65 && G.socVal >= 60 && G.rating >= 4.0)
      : (G.rating >= 3.0);
    winEl.textContent = winMet ? Math.floor(G.winDays) + '/' + winTarget + 'd' : '-';
  }
  updateHistoryProfile();
}

function calcPerfQuotas(workers) {
  var n = workers.length;
  return {
    sMax: Math.floor(n * 0.2),
    aMax: Math.floor(n * 0.3),
    cMin: Math.max(1, Math.ceil(n * 0.1)),
    dMin: Math.max(1, Math.ceil(n * 0.1))
  };
}

    var empty = document.createElement('div');
    empty.style.cssText = 'font-size:11px;color:rgba(255,255,255,0.4);padding:12px 0;text-align:center';
    empty.textContent = '\uAD6C\uC131\uC6D0\uC774 \uC5C6\uC2B5\uB2C8\uB2E4';
    panel.appendChild(empty);
    panel.classList.add('open');
    return;
  }

  var GRADES = [
    {g:'S', will:10, hap:15, bonus:50},
    {g:'A', will:5, hap:8, bonus:30},
    {g:'B', will:0, hap:0, bonus:0},
    {g:'C', will:-5, hap:-5, bonus:0},
    {g:'D', will:-10, hap:-15, bonus:0, pip:true}
  ];

  var pendingGrades = {};
  var quotas = calcPerfQuotas(workers);

  // Pre-populate from existing perfGrade
  for (var pi = 0; pi < workers.length; pi++) {
    var pw = workers[pi];
    if (pw.perfGrade) {
      for (var pgi = 0; pgi < GRADES.length; pgi++) {
        if (GRADES[pgi].g === pw.perfGrade) {
          pendingGrades[pw.id] = GRADES[pgi];
          break;
        }
      }
    }
  }

  // Quota bar container
  var quotaBar = document.createElement('div');
  quotaBar.className = 'perf-quota-bar';
  panel.appendChild(quotaBar);

  // Warning container
  var warningEl = document.createElement('div');
  warningEl.className = 'perf-warning';
  panel.appendChild(warningEl);

  // Worker rows container
  var rowsContainer = document.createElement('div');
  panel.appendChild(rowsContainer);

  // Confirm button
  var confirmBtn = document.createElement('button');
  confirmBtn.className = 'perf-confirm-btn';
  confirmBtn.textContent = '\u2705 \uD3C9\uAC00 \uD655\uC815';
  panel.appendChild(confirmBtn);

  function countGrades() {
    var counts = {S:0, A:0, B:0, C:0, D:0};
    var keys = Object.keys(pendingGrades);
    for (var ci = 0; ci < keys.length; ci++) {
      var g = pendingGrades[keys[ci]].g;
      counts[g] = (counts[g] || 0) + 1;
    }
    return counts;
  }

  function refreshPanel() {
    var counts = countGrades();
    var allGraded = Object.keys(pendingGrades).length === workers.length;
    var cMet = counts.C >= quotas.cMin;
    var dMet = counts.D >= quotas.dMin;

    // Update quota bar — clear children safely
    while (quotaBar.firstChild) quotaBar.removeChild(quotaBar.firstChild);
    var items = [
      {label:'S', count:counts.S, limit:quotas.sMax, type:'max'},
      {label:'A', count:counts.A, limit:quotas.aMax, type:'max'},
      {label:'B', count:counts.B, limit:null, type:'none'},
      {label:'C', count:counts.C, limit:quotas.cMin, type:'min'},
      {label:'D', count:counts.D, limit:quotas.dMin, type:'min'}
    ];
    for (var qi = 0; qi < items.length; qi++) {
      var it = items[qi];
      var span = document.createElement('span');
      span.className = 'perf-quota-item';
      if (it.type === 'max' && it.count > it.limit) {
        span.classList.add('over');
      } else if (it.type === 'min' && it.count < it.limit) {
        span.classList.add('under');
      } else if (it.type !== 'none') {
        span.classList.add('ok');
      }
      if (it.type === 'max') {
        span.textContent = it.label + ':' + it.count + '/' + it.limit;
      } else if (it.type === 'min') {
        span.textContent = it.label + ':' + it.count + '/' + it.limit + '+';
      } else {
        span.textContent = it.label + ':' + it.count + '/-';
      }
      quotaBar.appendChild(span);
      if (qi < items.length - 1) {
        var sep = document.createElement('span');
        sep.textContent = '|';
        sep.style.color = 'rgba(255,255,255,0.2)';
        quotaBar.appendChild(sep);
      }
    }

    // Warning
    if (!cMet || !dMet) {
      warningEl.textContent = 'C/D \uB4F1\uAE09 \uCD5C\uC18C \uBC30\uC815 \uD544\uC694';
      warningEl.style.display = '';
    } else {
      warningEl.style.display = 'none';
    }

    // Confirm button state
    var canConfirm = allGraded && cMet && dMet;
    confirmBtn.disabled = !canConfirm;

    // Update grade buttons styling and disabled state
    var allBtns = rowsContainer.querySelectorAll('[data-worker-id]');
    for (var bi = 0; bi < allBtns.length; bi++) {
      var b = allBtns[bi];
      var wid = parseInt(b.getAttribute('data-worker-id'));
      var gr = b.getAttribute('data-grade');
      var selected = pendingGrades[wid] && pendingGrades[wid].g === gr;

      // Reset style
      b.style.background = selected ? 'rgba(255,184,48,0.2)' : '';
      b.style.borderColor = selected ? 'rgba(255,184,48,0.4)' : '';
      b.style.color = selected ? '#FFB830' : '';
      b.disabled = false;

      // Disable if S/A quota full and not the currently selected one
      if (gr === 'S' && counts.S >= quotas.sMax && !selected) {
        b.disabled = true;
        b.style.opacity = '0.3';
      } else if (gr === 'A' && counts.A >= quotas.aMax && !selected) {
        b.disabled = true;
        b.style.opacity = '0.3';
      } else {
        b.style.opacity = '';
      }
    }

    // Update current grade display spans
    var gradeDisplays = rowsContainer.querySelectorAll('[data-grade-display]');
    for (var di = 0; di < gradeDisplays.length; di++) {
      var dEl = gradeDisplays[di];
      var dwid = parseInt(dEl.getAttribute('data-grade-display'));
      dEl.textContent = pendingGrades[dwid] ? pendingGrades[dwid].g : '-';
    }
  }

  // Render worker rows
  for (var i = 0; i < workers.length; i++) {
    (function(w) {
      var tc = EMP_TYPES[w.type] || EMP_TYPES.disengaged;
      var row = document.createElement('div');
      row.className = 'mgmt-row';

      // ID + emoji
      var idSpan = document.createElement('span');
      idSpan.style.cssText = 'min-width:36px;font-weight:700';
      idSpan.textContent = tc.emoji + '#' + w.id;
      row.appendChild(idSpan);

      // Dept
      var deptSpan = document.createElement('span');
      deptSpan.style.cssText = 'min-width:50px;color:rgba(255,255,255,0.5)';
      if (w.assignedDept) {
        var ddef = DEFS[w.assignedDept.type];
        deptSpan.textContent = ddef ? ddef.lbl : '-';
      } else {
        deptSpan.textContent = '\uBBF8\uBC30\uCE58';
      }
      row.appendChild(deptSpan);

      // Will bar
      row.appendChild(makeMiniBar(w.will, 100, '#FFB830'));
      // Capability bar
      row.appendChild(makeMiniBar(w.capability, 100, '#42A5F5'));
      // Happiness bar
      row.appendChild(makeMiniBar(w.happiness, 100, '#66BB6A'));

      // Current pending grade display
      var gradeSpan = document.createElement('span');
      gradeSpan.style.cssText = 'min-width:20px;text-align:center;font-weight:700;font-size:10px';
      gradeSpan.setAttribute('data-grade-display', w.id);
      gradeSpan.textContent = pendingGrades[w.id] ? pendingGrades[w.id].g : '-';
      row.appendChild(gradeSpan);

      // Grade buttons
      var gradeGroup = document.createElement('div');
      gradeGroup.style.cssText = 'display:flex;gap:3px;margin-left:auto';
      for (var gi = 0; gi < GRADES.length; gi++) {
        (function(grade) {
          var btn = document.createElement('button');
          btn.className = 'mgmt-grade-btn';
          btn.textContent = grade.g;
          btn.setAttribute('data-worker-id', w.id);
          btn.setAttribute('data-grade', grade.g);
          btn.addEventListener('click', function() {
            pendingGrades[w.id] = grade;
            refreshPanel();
          });
          gradeGroup.appendChild(btn);
        })(GRADES[gi]);
      }
      row.appendChild(gradeGroup);
      rowsContainer.appendChild(row);
    })(workers[i]);
  }

  // Confirm handler
  confirmBtn.addEventListener('click', function() {
    if (confirmBtn.disabled) return;
    var keys = Object.keys(pendingGrades);
    var totalBonus = 0;
    var pipCount = 0;
    for (var ci = 0; ci < keys.length; ci++) {
      var wid = parseInt(keys[ci]);
      var grade = pendingGrades[wid];
      // Find worker
      var w = null;
      for (var wi = 0; wi < workers.length; wi++) {
        if (workers[wi].id === wid) { w = workers[wi]; break; }
      }
      if (!w) continue;
      w.perfGrade = grade.g;
      if (!w.perfHistory) w.perfHistory = [];
      w.perfHistory.push(grade.g);
      w.will = clamp(0, 100, w.will + grade.will);
      w.happiness = clamp(0, 100, w.happiness + grade.hap);
      if (grade.bonus > 0) {
        G.money -= grade.bonus;
        totalBonus += grade.bonus;
      }
      if (grade.pip) {
        w.pipActive = true;
        w.pipDays = 30;
        pipCount++;
      }
    }
    var msg = '\uC131\uACFC\uD3C9\uAC00 \uD655\uC815! ' + keys.length + '\uBA85 \uD3C9\uAC00 \uC644\uB8CC';
    if (totalBonus > 0) msg += ' (\uCD1D \uBCF4\uB108\uC2A4 $' + totalBonus + ')';
    if (pipCount > 0) msg += ' | PIP ' + pipCount + '\uBA85';
    showToast(msg, 'success');
    closeMgmtPanel();
    updateHUD();
    saveGame();
  });

  // Initial render of quota bar and button states
  refreshPanel();

  panel.classList.add('open');
}

function openCompPanel() {
  closeMgmtPanel();
  var panel = document.getElementById('mgmt-panel');
  makeMgmtHeader(panel, '\u{1F4B0} \uBCF4\uC0C1\uAD00\uB9AC');

  var workers = getAliveWorkers();
  if (workers.length === 0) {
    var empty = document.createElement('div');
    empty.style.cssText = 'font-size:11px;color:rgba(255,255,255,0.4);padding:12px 0;text-align:center';
    empty.textContent = '\uAD6C\uC131\uC6D0\uC774 \uC5C6\uC2B5\uB2C8\uB2E4';
    panel.appendChild(empty);
    panel.classList.add('open');
    return;
  }

  var isQuarterDay = (G.gDay % 15 === 0);
  var canChange = isQuarterDay || !G.compStrategy;

  // Read-only notice when not quarter day and strategy already set
  if (!canChange) {
    var nextQ = G.gDay + (15 - (G.gDay % 15));
    var notice = document.createElement('div');
    notice.className = 'comp-readonly-notice';
    notice.textContent = '\uC804\uB7B5 \uBCC0\uACBD\uC740 \uBD84\uAE30 \uD68C\uC758(\uB9E4 15\uC77C)\uC5D0\uC11C\uB9CC \uAC00\uB2A5\uD569\uB2C8\uB2E4. \uB2E4\uC74C \uD68C\uC758: Day ' + nextQ;
    panel.appendChild(notice);
  }

  // Strategy cards container
  var cardsContainer = document.createElement('div');
  cardsContainer.className = 'comp-cards';

  for (var si = 0; si < COMP_STRATEGIES.length; si++) {
    (function(strat) {
      var card = document.createElement('div');
      card.className = 'comp-card';
      var isActive = G.compStrategy === strat.id;
      if (isActive) card.classList.add('active');
      if (!canChange) card.classList.add('disabled');

      // Icon
      var iconEl = document.createElement('div');
      iconEl.className = 'comp-card-icon';
      iconEl.textContent = strat.icon;
      card.appendChild(iconEl);

      // Name
      var nameEl = document.createElement('div');
      nameEl.className = 'comp-card-name';
      nameEl.textContent = strat.name;
      card.appendChild(nameEl);

      // Description
      var descEl = document.createElement('div');
      descEl.className = 'comp-card-desc';
      descEl.textContent = strat.desc;
      card.appendChild(descEl);

      // SKMS link subtitle
      var skmsEl = document.createElement('div');
      skmsEl.style.cssText = 'font-size:8px;color:rgba(255,255,255,0.25);margin-top:4px';
      skmsEl.textContent = 'SKMS: ' + strat.skmsLink;
      card.appendChild(skmsEl);

      // Active badge
      if (isActive) {
        var badge = document.createElement('div');
        badge.className = 'comp-card-badge';
        badge.textContent = '\uD604\uC7AC \uC801\uC6A9 \uC911';
        card.appendChild(badge);
      }

      // Click handler
      if (canChange) {
        card.addEventListener('click', function() {
          showCompConfirmDialog(strat);
        });
      }

      cardsContainer.appendChild(card);
    })(COMP_STRATEGIES[si]);
  }

  panel.appendChild(cardsContainer);

  // Footer: total monthly labor cost
  var baseSal = 50;
  var totalCost = 0;
  for (var fi = 0; fi < workers.length; fi++) {
    totalCost += Math.round(baseSal * (workers[fi].salaryLevel || 1));
  }
  var footer = document.createElement('div');
  footer.className = 'comp-footer';
  footer.style.cssText += ';display:flex;justify-content:space-between';
  var costLabel = document.createElement('span');
  costLabel.textContent = '\uC6D4 \uCD1D \uC778\uAC74\uBE44';
  footer.appendChild(costLabel);
  var costVal = document.createElement('span');
  costVal.style.cssText = 'font-weight:800;color:#FFB830';
  costVal.textContent = '$' + totalCost + '/day';
  footer.appendChild(costVal);
  panel.appendChild(footer);

  // SKMS connection note
  if (G.compStrategy) {
    var currentStrat = null;
    for (var cs = 0; cs < COMP_STRATEGIES.length; cs++) {
      if (COMP_STRATEGIES[cs].id === G.compStrategy) { currentStrat = COMP_STRATEGIES[cs]; break; }
    }
    if (currentStrat) {
      var skmsNote = document.createElement('div');
      skmsNote.style.cssText = 'font-size:9px;color:rgba(255,255,255,0.25);text-align:center;margin-top:6px';
      skmsNote.textContent = 'SKMS \uC5F0\uACB0: ' + currentStrat.skmsLink + ' \u2014 "' + currentStrat.name + '"';
      panel.appendChild(skmsNote);
    }
  }

  panel.classList.add('open');
}

function showCompConfirmDialog(strat) {
  // Create overlay
  var overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:200;display:flex;align-items:center;justify-content:center';

  var dialog = document.createElement('div');
  dialog.style.cssText = 'background:#1a1a2e;border:1px solid rgba(255,255,255,0.15);border-radius:12px;padding:20px;max-width:320px;width:90%;text-align:center;color:#fff;font-family:inherit';

  var title = document.createElement('div');
  title.style.cssText = 'font-size:20px;margin-bottom:8px';
  title.textContent = strat.icon;
  dialog.appendChild(title);

  var msg = document.createElement('div');
  msg.style.cssText = 'font-size:12px;margin-bottom:16px;line-height:1.5;color:rgba(255,255,255,0.7)';
  msg.textContent = "'" + strat.name + "' \uC804\uB7B5\uC744 \uC801\uC6A9\uD558\uC2DC\uACA0\uC2B5\uB2C8\uAE4C?\n\uAE30\uC874 \uAC1C\uC778\uBCC4 \uC5F0\uBD09\uC740 1.0x\uB85C \uB9AC\uC14B\uB429\uB2C8\uB2E4.";
  msg.style.whiteSpace = 'pre-line';
  dialog.appendChild(msg);

  var btnRow = document.createElement('div');
  btnRow.style.cssText = 'display:flex;gap:8px;justify-content:center';

  var cancelBtn = document.createElement('button');
  cancelBtn.style.cssText = 'padding:8px 20px;border:1px solid rgba(255,255,255,0.15);border-radius:6px;background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.6);font-size:12px;cursor:pointer;font-family:inherit';
  cancelBtn.textContent = '\uCDE8\uC18C';
  cancelBtn.addEventListener('click', function() {
    document.body.removeChild(overlay);
  });
  btnRow.appendChild(cancelBtn);

  var okBtn = document.createElement('button');
  okBtn.style.cssText = 'padding:8px 20px;border:1px solid rgba(255,184,48,0.4);border-radius:6px;background:rgba(255,184,48,0.15);color:#FFB830;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit';
  okBtn.textContent = '\uC801\uC6A9';
  okBtn.addEventListener('click', function() {
    document.body.removeChild(overlay);

    // Set strategy
    G.compStrategy = strat.id;

    // Reset all workers' salary levels
    var workers = getAliveWorkers();
    for (var ri = 0; ri < workers.length; ri++) {
      workers[ri].salaryLevel = 1.0;
    }

    // Apply strategy effects
    strat.apply(G);

    showToast('\uBCF4\uC0C1 \uC804\uB7B5: ' + strat.icon + ' ' + strat.name + ' \uC801\uC6A9\uB428', 'success');
    closeMgmtPanel();
    updateHUD();
    saveGame();
  });
  btnRow.appendChild(okBtn);

  dialog.appendChild(btnRow);
  overlay.appendChild(dialog);

  // Close on overlay click (outside dialog)
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) document.body.removeChild(overlay);
  });

  document.body.appendChild(overlay);
}

function openWorkforcePanel() {
  closeMgmtPanel();
  var panel = document.getElementById('mgmt-panel');
  makeMgmtHeader(panel, '\u{1F4CA} \uC778\uB825\uD604\uD669');

  var workers = getAliveWorkers();

  function addStat(label, value) {
    var row = document.createElement('div');
    row.className = 'mgmt-stat';
    var k = document.createElement('span');
    k.className = 'k';
    k.textContent = label;
    row.appendChild(k);
    var v = document.createElement('span');
    v.className = 'v';
    v.textContent = value;
    row.appendChild(v);
    panel.appendChild(row);
  }

  // Section: Type breakdown
  var secTitle1 = document.createElement('div');
  secTitle1.style.cssText = 'font-size:12px;font-weight:700;margin:8px 0 4px;color:rgba(255,255,255,0.7)';
  secTitle1.textContent = '\u{1F465} \uC720\uD615\uBCC4 \uD604\uD669';
  panel.appendChild(secTitle1);

  var typeNames = {ace: '\u{1F525} Ace', rookie: '\u{1F331} Rookie', cynic: '\u{1F612} Cynic', disengaged: '\u{1F634} Disengaged', leader: '\u{2B50} Leader'};
  var types = ['ace', 'rookie', 'cynic', 'disengaged', 'leader'];
  for (var ti = 0; ti < types.length; ti++) {
    var cnt = workers.filter(function(w) { return w.type === types[ti]; }).length;
    addStat(typeNames[types[ti]], cnt + '\uBA85');
  }

  // Section: Department breakdown
  var secTitle2 = document.createElement('div');
  secTitle2.style.cssText = 'font-size:12px;font-weight:700;margin:12px 0 4px;color:rgba(255,255,255,0.7)';
  secTitle2.textContent = '\u{1F3E2} \uBD80\uC11C\uBCC4 \uD604\uD669';
  panel.appendChild(secTitle2);

  var deptBldgs = G.bldgs.filter(function(b) { return DEFS[b.type] && DEFS[b.type].cat === 'dept'; });
  for (var di = 0; di < deptBldgs.length; di++) {
    var dept = deptBldgs[di];
    var ddef = DEFS[dept.type];
    var assigned = workers.filter(function(w) {
      return w.assignedDept && w.assignedDept.gx === dept.gx && w.assignedDept.gy === dept.gy;
    }).length;
    addStat(ddef.emoji + ' ' + ddef.lbl + ' (' + dept.gx + ',' + dept.gy + ')', assigned + '\uBA85');
  }

  var unassigned = workers.filter(function(w) { return !w.assignedDept; }).length;
  addStat('\uBBF8\uBC30\uCE58', unassigned + '\uBA85');

  // Section: Averages & Stats
  var secTitle3 = document.createElement('div');
  secTitle3.style.cssText = 'font-size:12px;font-weight:700;margin:12px 0 4px;color:rgba(255,255,255,0.7)';
  secTitle3.textContent = '\u{1F4C8} \uC8FC\uC694 \uC9C0\uD45C';
  panel.appendChild(secTitle3);

  if (workers.length > 0) {
    var sumW = 0, sumC = 0, sumH = 0;
    var pipCnt = 0, onbCnt = 0;
    for (var si = 0; si < workers.length; si++) {
      sumW += workers[si].will;
      sumC += workers[si].capability;
      sumH += workers[si].happiness;
      if (workers[si].pipActive) pipCnt++;
      if (workers[si].onboardDays > 0) onbCnt++;
    }
    addStat('\uD3C9\uADE0 \uC758\uC695 (Will)', (sumW / workers.length).toFixed(1));
    addStat('\uD3C9\uADE0 \uC5ED\uB7C9 (Capability)', (sumC / workers.length).toFixed(1));
    addStat('\uD3C9\uADE0 \uD589\uBCF5 (Happiness)', (sumH / workers.length).toFixed(1));
    addStat('PIP \uC9C4\uD589 \uC911', pipCnt + '\uBA85');
    addStat('\uC628\uBCF4\uB529 \uC911', onbCnt + '\uBA85');
  }

  // Turnover
  var totalHired = G.workerID || 0;
  var turnover = totalHired > 0 ? ((G.totalQuits || 0) / totalHired * 100).toFixed(1) : '0.0';
  addStat('\uD1FC\uC0AC\uC728 (\uCD1D \uD1FC\uC0AC/' + '\uCD1D \uCC44\uC6A9)', turnover + '%');
  addStat('\uCD1D \uD1FC\uC0AC', (G.totalQuits || 0) + '\uBA85');
  addStat('\uCD1D \uCC44\uC6A9', totalHired + '\uBA85');

  panel.classList.add('open');
}

function renderPolicyPanel() {
  var panel = document.getElementById('policy-panel');
  while (panel.firstChild) panel.removeChild(panel.firstChild);

  var title = document.createElement('h3');
  title.textContent = 'SKMS \uACBD\uC601 \uC81C\uB3C4';
  panel.appendChild(title);

  for (var i = 0; i < POLICIES.length; i++) {
    (function(pol) {
      var div = document.createElement('div');
      div.className = 'pol-item';

      var isActive = !!G.activePolicies[pol.id];
      var isActivating = !!G.activatingPolicies[pol.id];
      var meetsPrereqs = checkPolicyPrereqs(pol);

      if (isActive) div.classList.add('active');
      else if (isActivating) div.classList.add('activating');
      else if (!meetsPrereqs) div.classList.add('locked');

      var nameEl = document.createElement('div');
      nameEl.className = 'pol-name';
      nameEl.textContent = (isActive ? '\u2705 ' : isActivating ? '\u23F3 ' : !meetsPrereqs ? '\u{1F512} ' : '') + pol.nameKo;
      div.appendChild(nameEl);

      var costEl = document.createElement('div');
      costEl.className = 'pol-cost';
      costEl.textContent = isActive ? '\uD65C\uC131\uD654\uB428' : isActivating ? '\uD65C\uC131\uD654 \uC911...' : '$' + pol.cost + ' \u00B7 ' + pol.time + 's';
      div.appendChild(costEl);

      var descEl = document.createElement('div');
      descEl.className = 'pol-desc';
      descEl.textContent = pol.desc;
      div.appendChild(descEl);

      if (!meetsPrereqs && !isActive && !isActivating) {
        var reqEl = document.createElement('div');
        reqEl.className = 'pol-req';
        reqEl.textContent = '\uD544\uC694: ' + getPrereqText(pol);
        div.appendChild(reqEl);
      }

      if (isActivating) {
        var progWrap = document.createElement('div');
        progWrap.className = 'pol-progress';
        var progBar = document.createElement('div');
        progBar.className = 'pol-progress-bar';
        var remain = G.activatingPolicies[pol.id] || 0;
        var pct = Math.max(0, 100 - (remain / pol.time * 100));
        progBar.style.width = pct + '%';
        progWrap.appendChild(progBar);
        div.appendChild(progWrap);
      }

      if (!isActive && !isActivating && meetsPrereqs) {
        div.addEventListener('click', function() {
          if (G.money < pol.cost) {
            showToast('\uB3C8\uC774 \uBD80\uC871\uD569\uB2C8\uB2E4!', 'warn');
            return;
          }
          G.money -= pol.cost;
          G.activatingPolicies[pol.id] = pol.time;
          showToast(pol.nameKo + ' \uD65C\uC131\uD654 \uC2DC\uC791!', 'info');
          renderPolicyPanel();
          updateHUD();
        });
      }

      panel.appendChild(div);
    })(POLICIES[i]);
  }
}

function checkPolicyPrereqs(pol) {
  for (var i = 0; i < pol.prereqs.length; i++) {
    var req = pol.prereqs[i];
    // Check if it's a policy prereq
    var isPol = POLICIES.some(function(p) { return p.id === req; });
    if (isPol) {
      if (!G.activePolicies[req]) return false;
    } else {
      // Building prereq
      if (!hasBuilding(req)) return false;
    }
  }
  return true;
}

function getPrereqText(pol) {
  var texts = [];
  var buildingNames = {
    planning: '\uAE30\uD68D\uBD80\uC11C', rnd: 'R&D \uBD80\uC11C', hr: 'HR \uBD80\uC11C',
    wellness: '\uBCF5\uC9C0\uC2DC\uC124', social: '\uC0AC\uD68C\uACF5\uD5CC \uBD80\uC11C',
    supex: 'SUPEX \uCD94\uAD6C', vwbe: 'VWBE \uBB38\uD654'
  };
  for (var i = 0; i < pol.prereqs.length; i++) {
    texts.push(buildingNames[pol.prereqs[i]] || pol.prereqs[i]);
  }
  return texts.join(' + ');
}

function openMeeting(worker) {

    {label:'\uC5ED\uB7C9', value:Math.round(worker.capability), color:'#60A5FA'},
    {label:'\uD589\uBCF5', value:Math.round(worker.happiness), color:'#4ADE80'}
  ];

    var sd = document.createElement('div');
    sd.className = 'meeting-stat';
    var sv = document.createElement('span');
    sv.className = 'v';

    sv.style.color = statData[i].color;
    sd.appendChild(sv);
    var sl = document.createElement('span');
    sl.textContent = statData[i].label;
    sd.appendChild(sl);
    stats.appendChild(sd);

  assignInfo.style.cssText = 'text-align:center;font-size:11px;color:rgba(255,255,255,0.6);margin-bottom:8px;padding:6px;background:rgba(255,255,255,0.04);border-radius:6px';
  if (worker.assignedDept) {
    var deptDef = DEFS[worker.assignedDept.type];
    assignInfo.textContent = '\uD604\uC7AC \uBC30\uC815: ' + (deptDef ? deptDef.lbl : worker.assignedDept.type);
  } else {
    assignInfo.textContent = '\uBBF8\uBC30\uC815 (\uC218\uC775 \uAE30\uC5EC \uC5C6\uC74C)';
    assignInfo.style.color = '#F87171';
  }
  panel.appendChild(assignInfo);

  // Onboarding status display
  if (worker.onboardDays > 0) {
    var onboardInfo = document.createElement('div');
    onboardInfo.style.cssText = 'text-align:center;font-size:11px;color:#60A5FA;margin-bottom:8px;padding:4px;background:rgba(96,165,250,0.1);border-radius:6px';
    onboardInfo.textContent = '\uC218\uC2B5 \uC911 (D-' + worker.onboardDays + ')';
    panel.appendChild(onboardInfo);
  }

  // PIP status display
  if (worker.pipActive) {
    var pipInfo = document.createElement('div');
    pipInfo.style.cssText = 'text-align:center;font-size:11px;color:#F87171;margin-bottom:8px;padding:4px;background:rgba(248,113,113,0.1);border-radius:6px;font-weight:700';
    pipInfo.textContent = 'PIP \uC9C4\uD589 \uC911 (D-' + Math.ceil(worker.pipDays) + ') \u2014 \uC758\uC695 40+, \uC5ED\uB7C9 40+ \uD544\uC694';
    panel.appendChild(pipInfo);

    var salInfo = document.createElement('div');

    panel.appendChild(salInfo);
  }

  if (worker.perfGrade) {

    if (worker.perfHistory && worker.perfHistory.length > 1) {

    perfInfo.textContent = historyText;
    panel.appendChild(perfInfo);
  }

  var deptHeader = document.createElement('div');
  deptHeader.style.cssText = 'font-size:11px;font-weight:700;color:rgba(255,255,255,0.5);margin-bottom:6px;margin-top:4px;letter-spacing:0.5px';
  deptHeader.textContent = '\uBD80\uC11C \uBC30\uC815';

  if (depts.length === 0) {

    panel.appendChild(noDept);

    for (var di = 0; di < depts.length; di++) {
      (function(dept) {
        var ddef = DEFS[dept.type];
        var assignedCount = G.workers.filter(function(ww) {
          return !ww.quitting && ww.assignedDept && ww.assignedDept.gx === dept.gx && ww.assignedDept.gy === dept.gy;

        dBtn.className = 'meeting-choice';
        var isCurrentDept = worker.assignedDept && worker.assignedDept.gx === dept.gx && worker.assignedDept.gy === dept.gy;

        dText.textContent = (ddef ? ddef.emoji + ' ' + ddef.lbl : dept.type) + ' (' + assignedCount + '\uBA85)';

          showToast('\uC9C1\uC6D0 #' + worker.id + ' \u2192 ' + (ddef ? ddef.lbl : dept.type) + ' \uBC30\uC815 \uC644\uB8CC', 'success');

  }

  // Separator
  var sep = document.createElement('div');
  sep.style.cssText = 'height:1px;background:rgba(255,255,255,0.08);margin:10px 0';
  panel.appendChild(sep);

  // Choices
  var choices = getMeetingChoices(worker);
  for (var c = 0; c < choices.length; c++) {
    (function(choice) {
      var btn = document.createElement('button');
      btn.className = 'meeting-choice';
      var textNode = document.createElement('span');
      textNode.textContent = choice.text;
      btn.appendChild(textNode);
      var effect = document.createElement('span');
      effect.className = 'effect';
      effect.textContent = choice.effect;
      btn.appendChild(effect);
      btn.addEventListener('click', function() {
        sfxClick();

      });
      panel.appendChild(btn);
    })(choices[c]);
  }

  panel.classList.add('open');
}

    });

      toast: '\uC9C0\uC6D0 \uBC29\uC548\uC744 \uB17C\uC758\uD588\uC2B5\uB2C8\uB2E4',

    });
    choices.push({
      text: '"\uCF54\uCE6D \uC5ED\uB7C9\uC744 \uD0A4\uC6CC\uBD05\uC2DC\uB2E4"',
      effect: hasBuilding('academy') ? '\uB9AC\uB354\uC2ED +' : '\uC544\uCE74\uB370\uBBF8 \uD544\uC694',

    });

      apply: function(w) { if (hasBuilding('academy')) { w.capability = Math.min(100, w.capability + 8); w.will = Math.min(100, w.will + 5); } }
    });

      apply: function(w) { w.happiness = Math.min(100, w.happiness + 8); w.will = Math.min(100, w.will + 5); G.money -= 300; }
    });
  }

  // PIP consultation choice
  if (w.pipActive) {
    choices.push({
      text: '"\uC131\uACFC\uAC1C\uC120 \uC0C1\uB2F4\uC744 \uD574\uBD05\uC2DC\uB2E4" (PIP)',

      apply: function(w) {
        w.will = Math.min(100, w.will + 8);
        w.capability = Math.min(100, w.capability + 5);
      }
    });
  }

  return choices;
}

// ============================================================
// EVENT SYSTEM
// ============================================================
function triggerRandomEvent() {
  if (G.eventActive || G.gameOver) return;
  // Pick unused event, or cycle
  var available = EVENTS.filter(function(e) { return G.usedEvents.indexOf(e.id) === -1; });
  if (available.length === 0) {
    G.usedEvents = [];
    available = EVENTS.slice();
  }
  var evt = available[Math.floor(Math.random() * available.length)];
  G.usedEvents.push(evt.id);
  G.currentEvent = evt;
  G.eventActive = true;
  G.eventCountdown = 15;
  showEventModal(evt);
}

function showEventModal(evt) {
  sfxEvent();
  var overlay = document.getElementById('event-overlay');
  while (overlay.firstChild) overlay.removeChild(overlay.firstChild);

  var card = document.createElement('div');
  card.className = 'event-card';

  // Timer
  var timer = document.createElement('div');
  timer.className = 'event-timer';
  timer.id = 'event-timer-display';
  timer.textContent = '15s';
  card.appendChild(timer);

  // Tag
  var tag = document.createElement('div');
  tag.className = 'event-tag';
  tag.textContent = '\u{1F4F0} NEWS';
  card.appendChild(tag);

  // Headline
  var headline = document.createElement('div');
  headline.className = 'event-headline';
  headline.textContent = evt.headline;
  card.appendChild(headline);

  // Description
  var desc = document.createElement('div');
  desc.className = 'event-desc';
  desc.textContent = evt.desc;
  card.appendChild(desc);

  // Choices
  for (var c = 0; c < evt.choices.length; c++) {
    (function(choice, idx) {
      var btn = document.createElement('button');
      btn.className = 'event-choice';

      var textEl = document.createElement('span');
      textEl.textContent = choice.text;
      btn.appendChild(textEl);

      var previewEl = document.createElement('span');
      previewEl.className = 'preview';

      var previewText = choice.preview;
      var disabled = false;

      // Check policy requirement
      if (choice.reqPolicy && !policyActive(choice.reqPolicy)) {
        disabled = true;
        var reqSpan = document.createElement('span');
        reqSpan.className = 'req';
        var polName = POLICIES.find(function(p){return p.id===choice.reqPolicy;});
        reqSpan.textContent = ' [\uD544\uC694: ' + (polName ? polName.nameKo : choice.reqPolicy) + ']';
        previewEl.textContent = previewText;
        previewEl.appendChild(reqSpan);
      } else if (choice.reqBuilding && !hasBuilding(choice.reqBuilding)) {
        disabled = true;
        previewEl.textContent = previewText + ' [\uD544\uC694: ' + (DEFS[choice.reqBuilding] ? DEFS[choice.reqBuilding].lbl : choice.reqBuilding) + ']';
      } else if (choice.condition && !choice.condition(G)) {
        disabled = true;
        previewEl.textContent = previewText + ' [\uC870\uAC74 \uBBF8\uCDA9\uC871]';
      } else {
        previewEl.textContent = previewText;
      }

      btn.appendChild(previewEl);
      btn.disabled = disabled;

      if (!disabled) {
        btn.addEventListener('click', function() {
          // Snapshot metrics before applying
          var prevMetrics = {custSat: G.custSat, empHap: G.empHap, socVal: G.socVal, money: G.money};
          choice.apply(G);
          // Compute deltas
          var deltas = {
            custSat: Math.round(G.custSat - prevMetrics.custSat),
            empHap: Math.round(G.empHap - prevMetrics.empHap),
            socVal: Math.round(G.socVal - prevMetrics.socVal),
            money: Math.round(G.money - prevMetrics.money)
          };
          // Screen flash
          var effectType = classifyChoiceEffect(choice.preview || '');
          flashScreen(effectType);
          // Gauge delta animations
          if (deltas.custSat) showGaugeDelta('hud-cust', deltas.custSat);
          if (deltas.empHap) showGaugeDelta('hud-emp', deltas.empHap);
          if (deltas.socVal) showGaugeDelta('hud-soc', deltas.socVal);
          if (deltas.money) showGaugeDelta('hud-money', deltas.money);
          // Worker emoji reactions
          showWorkerReactions(effectType === 'positive' ? '\uD83D\uDE0A' : '\uD83D\uDE21');
          // Summary toast
          var summaryParts = [];
          if (deltas.empHap) summaryParts.push('\uD589\uBCF5 ' + (deltas.empHap > 0 ? '+' : '') + deltas.empHap);
          if (deltas.custSat) summaryParts.push('\uACE0\uAC1D ' + (deltas.custSat > 0 ? '+' : '') + deltas.custSat);
          if (deltas.socVal) summaryParts.push('\uC0AC\uD68C ' + (deltas.socVal > 0 ? '+' : '') + deltas.socVal);
          if (deltas.money) summaryParts.push((deltas.money > 0 ? '+$' : '-$') + Math.abs(deltas.money));
          if (summaryParts.length > 0) {
            showToast(summaryParts.join(', '), effectType === 'positive' ? 'success' : 'warn');
          }
          G.choiceLog.push({event: G.currentEvent.id, choice: idx});
          // Record SKMS tag for alignment tracking
          if (choice.skmsTag) {
            G.skmsChoices.push({eventId: G.currentEvent.id, choiceIdx: idx, tag: choice.skmsTag, day: G.gDay});
          }
          // Queue delayed follow-up event
          if (choice.delayed) {
            var followup = FOLLOWUP_EVENTS[choice.delayed.followupId];
            if (followup) {
              G.pendingFollowups.push({triggerDay: G.gDay + choice.delayed.days, event: followup});
            }
          }
          addHistoryEntry(G.currentEvent.headline, choice.text, '\uD83D\uDCF0');
          closeEvent();
          updateHUD();
          saveGame();
        });
      }

      card.appendChild(btn);
    })(evt.choices[c], c);
  }

  overlay.appendChild(card);
  overlay.classList.add('show');
}

function updateEventTimer() {
  var el = document.getElementById('event-timer-display');
  if (el) el.textContent = Math.ceil(G.eventCountdown) + 's';
}

function autoPickWorst() {
  // Pick last choice (worst option)
  if (!G.currentEvent) { closeEvent(); return; }
  var choices = G.currentEvent.choices;
  var lastValid = null;
  for (var i = choices.length - 1; i >= 0; i--) {
    var c = choices[i];
    var disabled = false;
    if (c.reqPolicy && !policyActive(c.reqPolicy)) disabled = true;
    if (c.reqBuilding && !hasBuilding(c.reqBuilding)) disabled = true;
    if (c.condition && !c.condition(G)) disabled = true;
    if (!disabled) { lastValid = c; break; }
  }
  if (lastValid) {
    lastValid.apply(G);
    G.choiceLog.push({event: G.currentEvent.id, choice: 'auto'});
    // Queue delayed follow-up for auto-pick too
    if (lastValid.delayed) {
      var followup = FOLLOWUP_EVENTS[lastValid.delayed.followupId];
      if (followup) {
        G.pendingFollowups.push({triggerDay: G.gDay + lastValid.delayed.days, event: followup});
      }
    }
  }
  flashScreen('negative');
  showWorkerReactions('\uD83D\uDE30');
  closeEvent();
  showToast('\uC2DC\uAC04 \uCD08\uACFC! \uCD5C\uC545\uC758 \uC120\uD0DD\uC774 \uC801\uC6A9\uB418\uC5C8\uC2B5\uB2C8\uB2E4.', 'warn');
  updateHUD();
}

function closeEvent() {
  G.eventActive = false;
  G.currentEvent = null;
  document.getElementById('event-overlay').classList.remove('show');
}
