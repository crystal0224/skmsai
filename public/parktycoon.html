function showPIPExpiryModal(worker) {
  sfxEvent();
  G.gSpeed = 0;
  var overlay = document.getElementById('event-overlay');
  while (overlay.firstChild) overlay.removeChild(overlay.firstChild);

  var card = document.createElement('div');
  card.className = 'event-card';

  var tag = document.createElement('div');
  tag.className = 'event-tag';
  tag.textContent = '\u26A0 PIP';
  card.appendChild(tag);

  var headline = document.createElement('div');
  headline.className = 'event-headline';
  headline.textContent = '\uC9C1\uC6D0 #' + worker.id + ' PIP \uBBF8\uB2EC\uC131';
  card.appendChild(headline);

  var desc = document.createElement('div');
  desc.className = 'event-desc';
  desc.textContent = '\uC131\uACFC\uAC1C\uC120\uACC4\uD68D(PIP) \uAE30\uAC04\uC774 \uB9CC\uB8CC\uB418\uC5C8\uC73C\uB098 \uAC1C\uC120\uC774 \uD655\uC778\uB418\uC9C0 \uC54A\uC558\uC2B5\uB2C8\uB2E4. (\uC758\uC695: ' + Math.round(worker.will) + ', \uC5ED\uB7C9: ' + Math.round(worker.capability) + ')';
  card.appendChild(desc);

  var choices = [
    {
      text: '\uC7AC\uAD50\uC721 \uAE30\uD68C \uBD80\uC5EC',
      preview: 'PIP 30\uC77C \uC5F0\uC7A5, $500 \uBE44\uC6A9 (SKMS \uC778\uAC04\uC911\uC2EC)',
      apply: function() {
        if (G.money < 500) { showToast('\uC790\uAE08\uC774 \uBD80\uC871\uD569\uB2C8\uB2E4!', 'warn'); return; }
        G.money -= 500;
        worker.pipDays = 30;
        showToast('\uC9C1\uC6D0 #' + worker.id + ' \uC7AC\uAD50\uC721 \uAE30\uD68C \uBD80\uC5EC ($500)', 'info');
      }
    },
    {
      text: '\uAD8C\uACE0 \uD1B4\uC9C1',
      preview: '\uC9C1\uC6D0 \uD1B4\uC0AC, \uC804\uC6D0 \uD589\uBCF5 -8, \uD1B4\uC9C1\uAE08 $200',
      apply: function() {
        G.money -= 200;
        worker.quitting = true;
        worker.bubble = SPEECH.quitting[0];
        worker.bubbleTimer = 120;
        G.totalQuits = (G.totalQuits || 0) + 1;
        var aliveOthers = G.workers.filter(function(ww) { return !ww.quitting && ww.id !== worker.id; });
        for (var i = 0; i < aliveOthers.length; i++) {
          aliveOthers[i].happiness = Math.max(0, aliveOthers[i].happiness - 8);
        }
        G.empHap = Math.max(0, G.empHap - 8);
        showToast('\uC9C1\uC6D0 #' + worker.id + ' \uAD8C\uACE0 \uD1B4\uC9C1 \uCC98\uB9AC ($200)', 'warn');
      }
    },
    {
      text: '\uC804\uD658 \uBC30\uCE58',
      preview: '\uB2E4\uB978 \uBD80\uC11C\uB85C \uC774\uB3D9, PIP \uD574\uC81C, \uC758\uC695 +5',
      apply: function() {
        var depts = G.bldgs.filter(function(b) { var d = DEFS[b.type]; return d && d.cat === 'dept'; });
        var otherDepts = depts.filter(function(d) {
          return !(worker.assignedDept && worker.assignedDept.gx === d.gx && worker.assignedDept.gy === d.gy);
        });
        if (otherDepts.length === 0) {
          showToast('\uC804\uD658\uD560 \uC218 \uC788\uB294 \uBD80\uC11C\uAC00 \uC5C6\uC2B5\uB2C8\uB2E4!', 'warn');
          return;
        }
        var newDept = otherDepts[Math.floor(Math.random() * otherDepts.length)];
        worker.assignedDept = {gx: newDept.gx, gy: newDept.gy, type: newDept.type};
        worker.pipActive = false;
        worker.pipDays = 0;
        worker.will = Math.min(100, worker.will + 5);
        var ddef = DEFS[newDept.type];
        showToast('\uC9C1\uC6D0 #' + worker.id + ' \u2192 ' + (ddef ? ddef.lbl : newDept.type) + ' \uC804\uD658 \uBC30\uCE58', 'success');
      }
    }
  ];

  for (var c = 0; c < choices.length; c++) {
    (function(choice) {
      var btn = document.createElement('button');
      btn.className = 'event-choice';
      var textEl = document.createElement('span');
      textEl.textContent = choice.text;
      btn.appendChild(textEl);
      var previewEl = document.createElement('span');
      previewEl.className = 'preview';
      previewEl.textContent = choice.preview;
      btn.appendChild(previewEl);
      btn.addEventListener('click', function() {
        choice.apply();
        overlay.classList.remove('show');
        G.gSpeed = 1;
        document.getElementById('btn-speed').textContent = '1x';
        updateHUD();
      });
      card.appendChild(btn);
    })(choices[c]);
  }

  overlay.appendChild(card);
  overlay.classList.add('show');
}

// ============================================================
// QUARTERLY STRATEGY MEETING
// ============================================================
function showStrategyMeeting() {
  if (G.gameOver) return;
  sfxMeeting();
  G.gSpeed = 0; // Pause game during meeting

  var overlay = document.getElementById('strat-overlay');
  while (overlay.firstChild) overlay.removeChild(overlay.firstChild);

  var card = document.createElement('div');
  card.className = 'strat-card';

  var quarter = Math.ceil(G.gDay / 30);
  var alive = G.workers.filter(function(w) { return !w.quitting; });

  // Title
  var title = document.createElement('div');
  title.className = 'strat-title';
  title.textContent = '\uD83D\uDCCB Q' + quarter + ' \uACBD\uC601\uC804\uB7B5\uD68C\uC758';
  card.appendChild(title);

  var sub = document.createElement('div');
  sub.className = 'strat-subtitle';
  sub.textContent = 'Day ' + G.gDay + ' \u2014 \uBD84\uAE30 \uACBD\uC601 \uC131\uACFC \uB9AC\uBDF0';
  card.appendChild(sub);

  // Section 1: Stakeholder metrics with trends
  var sec1 = document.createElement('div');
  sec1.className = 'strat-section';
  var h1 = document.createElement('h4');
  h1.textContent = '\uC774\uD574\uAD00\uACC4\uC790 \uC9C0\uD45C';
  sec1.appendChild(h1);

  var metrics = [
    { label: '\uACE0\uAC1D \uB9CC\uC871', val: Math.round(G.custSat), prev: G.prevCust, color: '#42A5F5' },
    { label: '\uAD6C\uC131\uC6D0 \uD589\uBCF5', val: Math.round(G.empHap), prev: G.prevEmp, color: '#66BB6A' },
    { label: '\uC0AC\uD68C\uC801 \uAC00\uCE58', val: Math.round(G.socVal), prev: G.prevSoc, color: '#26A69A' }
  ];

  for (var i = 0; i < metrics.length; i++) {
    var m = metrics[i];
    var row = document.createElement('div');
    row.className = 'strat-metric';

    var lbl = document.createElement('span');
    lbl.className = 'label';
    lbl.textContent = m.label;
    row.appendChild(lbl);

    var bar = document.createElement('div');
    bar.className = 'bar';
    var fill = document.createElement('div');
    fill.className = 'bar-fill';
    fill.style.width = m.val + '%';
    fill.style.background = m.color;
    bar.appendChild(fill);
    row.appendChild(bar);

    var val = document.createElement('span');
    val.className = 'val';
    val.textContent = m.val;
    row.appendChild(val);

    var diff = m.val - m.prev;
    var trend = document.createElement('span');
    trend.className = 'strat-trend ' + (diff > 2 ? 'up' : diff < -2 ? 'down' : 'flat');
    trend.textContent = diff > 0 ? '\u25B2+' + diff : diff < 0 ? '\u25BC' + diff : '\u25AC 0';
    row.appendChild(trend);

    sec1.appendChild(row);
  }
  card.appendChild(sec1);

  // Section 2: Company status
  var sec2 = document.createElement('div');
  sec2.className = 'strat-section';
  var h2 = document.createElement('h4');
  h2.textContent = '\uD68C\uC0AC \uD604\uD669';
  sec2.appendChild(h2);

  var moneyDiff = G.money - G.prevMoney;
  var workerDiff = alive.length - G.prevWorkerCount;
  var polCount = Object.keys(G.activePolicies).length;

  var stats = [
    { emoji: '\uD83D\uDCB0', text: '\uC790\uAE08: $' + G.money.toLocaleString() + (moneyDiff >= 0 ? ' (\u25B2+$' + moneyDiff.toLocaleString() + ')' : ' (\u25BC$' + moneyDiff.toLocaleString() + ')') },
    { emoji: '\uD83D\uDC65', text: '\uAD6C\uC131\uC6D0: ' + alive.length + '\uBA85' + (workerDiff >= 0 ? ' (+' + workerDiff + ')' : ' (' + workerDiff + ')') },
    { emoji: '\u2B50', text: '\uBCC4\uC810: ' + G.rating.toFixed(1) + ' / 5.0' },
    { emoji: '\uD83D\uDCDC', text: 'SKMS \uC815\uCC45: ' + polCount + '/9 \uD65C\uC131\uD654' }
  ];

  // Type breakdown
  var tc = { ace: 0, rookie: 0, cynic: 0, disengaged: 0, leader: 0 };
  for (var j = 0; j < alive.length; j++) tc[alive[j].type] = (tc[alive[j].type] || 0) + 1;
  stats.push({ emoji: '\uD83D\uDD25', text: '\uC5D0\uC774\uC2A4 ' + (tc.ace||0) + ' / \uC2E0\uC785 ' + (tc.rookie||0) + ' / \uB0C9\uC18C ' + (tc.cynic||0) + ' / \uBB34\uAE30\uB825 ' + (tc.disengaged||0) + ' / \uB9AC\uB354 ' + (tc.leader||0) });

  for (var k = 0; k < stats.length; k++) {
    var item = document.createElement('div');
    item.className = 'strat-agenda-item';
    var em = document.createElement('span');
    em.className = 'emoji';
    em.textContent = stats[k].emoji;
    item.appendChild(em);
    var tx = document.createElement('span');
    tx.textContent = stats[k].text;
    item.appendChild(tx);
    sec2.appendChild(item);
  }
  card.appendChild(sec2);

  // Section 2.5: Performance Evaluation
  var perfGradeSelections = {};
  var secPerf = document.createElement('div');
  secPerf.className = 'strat-section';
  var hPerf = document.createElement('h4');
  hPerf.textContent = '\uC131\uACFC \uD3C9\uAC00';
  secPerf.appendChild(hPerf);

  var perfSub = document.createElement('div');
  perfSub.style.cssText = 'font-size:10px;color:rgba(255,255,255,0.4);margin-bottom:8px';
  perfSub.textContent = '\uAD6C\uC131\uC6D0\uBCC4 \uC131\uACFC \uB4F1\uAE09\uC744 \uD3C9\uAC00\uD558\uC138\uC694. \uC790\uB3D9 \uCD94\uCC9C \uB4F1\uAE09\uC774 \uC120\uD0DD\uB418\uC5B4 \uC788\uC2B5\uB2C8\uB2E4.';
  secPerf.appendChild(perfSub);

  var grades = ['S','A','B','C','D'];
  var typeNames = {ace:'\uC5D0\uC774\uC2A4', rookie:'\uC2E0\uC785', cynic:'\uC2DC\uB2C8\uD06C', disengaged:'\uBC29\uAD00\uC790', leader:'\uB9AC\uB354'};

  function suggestGrade(w) {
    if (w.will > 80 && w.capability > 80) return 'S';
    if (w.will > 60 && w.capability > 60) return 'A';
    if (w.will > 40 && w.capability > 40) return 'B';
    if (w.will > 25 || w.capability > 25) return 'C';
    return 'D';
  }

  for (var pi = 0; pi < alive.length; pi++) {
    (function(w, idx) {
      var suggested = suggestGrade(w);
      perfGradeSelections[w.id] = suggested;

      var row = document.createElement('div');
      row.className = 'perf-row' + (w.pipActive ? ' pip-active' : '');

      var tc = EMP_TYPES[w.type] || EMP_TYPES.disengaged;
      var nameEl = document.createElement('span');
      nameEl.className = 'perf-name';
      nameEl.textContent = tc.emoji + ' #' + w.id;
      row.appendChild(nameEl);

      var deptEl = document.createElement('span');
      deptEl.className = 'perf-dept';
      if (w.assignedDept) {
        var ddef = DEFS[w.assignedDept.type];
        deptEl.textContent = ddef ? ddef.lbl : w.assignedDept.type;
      } else {
        deptEl.textContent = '\uBBF8\uBC30\uC815';
      }
      row.appendChild(deptEl);

      if (w.pipActive) {
        var pipBadge = document.createElement('span');
        pipBadge.className = 'pip-badge';
        pipBadge.textContent = 'PIP';
        row.appendChild(pipBadge);
      }

      var gradesDiv = document.createElement('div');
      gradesDiv.className = 'perf-grades';

      for (var gi = 0; gi < grades.length; gi++) {
        (function(grade) {
          var gBtn = document.createElement('button');
          gBtn.className = 'perf-grade grade-' + grade.toLowerCase();
          if (grade === suggested) gBtn.classList.add('selected');
          gBtn.textContent = grade;
          gBtn.addEventListener('click', function() {
            perfGradeSelections[w.id] = grade;
            var siblings = gradesDiv.querySelectorAll('.perf-grade');
            for (var s = 0; s < siblings.length; s++) siblings[s].classList.remove('selected');
            gBtn.classList.add('selected');
          });
          gradesDiv.appendChild(gBtn);
        })(grades[gi]);
      }
      row.appendChild(gradesDiv);

      secPerf.appendChild(row);
    })(alive[pi], pi);
  }

  card.appendChild(secPerf);

  // Section 3: AI Insights (context-sensitive advice)
  var sec3 = document.createElement('div');
  sec3.className = 'strat-section';
  var h3 = document.createElement('h4');
  h3.textContent = '\uACBD\uC601 \uC9C4\uB2E8 & \uC81C\uC548';
  sec3.appendChild(h3);

  var insights = [];

  if (G.empHap < 30) insights.push({ text: '\uAD6C\uC131\uC6D0 \uD589\uBCF5\uC774 \uC704\uD5D8 \uC218\uC900\uC785\uB2C8\uB2E4. <strong>\uBCF5\uC9C0\uC2DC\uC124 \uAC74\uC124</strong>\uACFC <strong>VWBE \uBB38\uD654 \uB3C4\uC785</strong>\uC744 \uAC80\uD1A0\uD558\uC138\uC694. \uBC29\uCE58\uD558\uBA74 \uB300\uB7C9 \uD1B4\uC0AC\uAC00 \uBC1C\uC0DD\uD569\uB2C8\uB2E4.', priority: 'high' });
  else if (G.empHap < 50) insights.push({ text: '\uAD6C\uC131\uC6D0 \uD589\uBCF5\uC774 \uBCF4\uD1B5 \uC218\uC900\uC785\uB2C8\uB2E4. <strong>\uAD6C\uB0B4\uC2DD\uB2F9</strong>\uC774\uB098 <strong>\uC6F0\uB2C8\uC2A4 \uC13C\uD130</strong>\uB97C \uCD94\uAC00\uD558\uBA74 \uAC1C\uC120\uB429\uB2C8\uB2E4.', priority: 'med' });

  if (G.custSat < 30) insights.push({ text: '\uACE0\uAC1D \uB9CC\uC871\uC774 \uB9E4\uC6B0 \uB0AE\uC2B5\uB2C8\uB2E4. <strong>\uB9C8\uCF00\uD305 \uBD80\uC11C</strong>\uC640 <strong>\uC0DD\uC0B0\uBD80\uC11C</strong>\uC5D0 \uC5D0\uC774\uC2A4 \uC9C1\uC6D0\uC744 \uBC30\uCE58\uD558\uC138\uC694.', priority: 'high' });

  if (G.socVal < 20) insights.push({ text: '\uC0AC\uD68C\uC801 \uAC00\uCE58\uAC00 \uC704\uD5D8 \uC218\uC900\uC785\uB2C8\uB2E4. <strong>\uC0AC\uD68C\uACF5\uD5CC \uBD80\uC11C</strong>\uB97C \uC124\uB9BD\uD558\uACE0 <strong>\uC0AC\uD68C\uC801 \uAC00\uCE58 \uACBD\uC601</strong> \uC815\uCC45\uC744 \uD65C\uC131\uD654\uD558\uC138\uC694.', priority: 'high' });

  if (tc.disengaged > 3) insights.push({ text: '\uBB34\uAE30\uB825 \uAD6C\uC131\uC6D0\uC774 ' + tc.disengaged + '\uBA85\uC73C\uB85C \uB9CE\uC2B5\uB2C8\uB2E4. <strong>\uAD50\uC721\uC6D0</strong>\uACFC <strong>O.J.T \uC815\uCC45</strong>\uC744 \uD1B5\uD574 \uC5ED\uB7C9\uC744 \uD0A4\uC6CC\uC8FC\uC138\uC694.', priority: 'med' });

  if (tc.cynic > 2 && !policyActive('vwbe')) insights.push({ text: '\uB0C9\uC18C\uD30C \uC9C1\uC6D0\uC774 ' + tc.cynic + '\uBA85\uC785\uB2C8\uB2E4. <strong>VWBE \uBB38\uD654</strong>\uB97C \uD65C\uC131\uD654\uD558\uBA74 \uC5D0\uC774\uC2A4\uB85C \uC804\uD658\uB420 \uC218 \uC788\uC2B5\uB2C8\uB2E4.', priority: 'med' });

  if (polCount === 0) insights.push({ text: 'SKMS \uC815\uCC45\uC774 \uD558\uB098\uB3C4 \uD65C\uC131\uD654\uB418\uC9C0 \uC54A\uC558\uC2B5\uB2C8\uB2E4. <strong>\uC131\uACFC \uBCF4\uC0C1 \uCCB4\uACC4</strong>($500)\uBD80\uD130 \uC2DC\uC791\uD574\uBCF4\uC138\uC694.', priority: 'high' });
  else if (polCount >= 3 && !policyActive('supex')) insights.push({ text: '\uC815\uCC45 \uAE30\uBC18\uC774 \uAC16\uCDB0\uC84C\uC2B5\uB2C8\uB2E4. <strong>SUPEX \uCD94\uAD6C</strong>\uB97C \uD65C\uC131\uD654\uD558\uBA74 \uC131\uACFC \uCC9C\uC7A5\uC744 \uB3CC\uD30C\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4.', priority: 'med' });

  if (moneyDiff < -2000) insights.push({ text: '\uC790\uAE08\uC774 \uBE60\uB974\uAC8C \uC904\uACE0 \uC788\uC2B5\uB2C8\uB2E4. \uBD88\uD544\uC694\uD55C \uC9C0\uCD9C\uC744 \uC904\uC774\uACE0 <strong>\uC0DD\uC0B0 \uBD80\uC11C</strong>\uC5D0 \uC9D1\uC911\uD558\uC138\uC694.', priority: 'high' });

  if (G.rating >= 2.5) insights.push({ text: '\uD68C\uC0AC\uAC00 \uC548\uC815\uB418\uACE0 \uC788\uC2B5\uB2C8\uB2E4! \uBCC4\uC810 3.0\uC744 30\uC77C \uC720\uC9C0\uD558\uBA74 \uC2B9\uB9AC\uD569\uB2C8\uB2E4. \uADE0\uD615 \uC7A1\uD78C \uC131\uC7A5\uC744 \uC774\uC5B4\uAC00\uC138\uC694.', priority: 'low' });

  if (insights.length === 0) insights.push({ text: '\uC804\uBC18\uC801\uC73C\uB85C \uC591\uD638\uD569\uB2C8\uB2E4. \uD604\uC7AC \uC804\uB7B5\uC744 \uC720\uC9C0\uD558\uBA74\uC11C \uBD80\uC871\uD55C \uC9C0\uD45C\uC5D0 \uC9D1\uC911\uD558\uC138\uC694.', priority: 'low' });

  for (var n = 0; n < insights.length; n++) {
    var ins = document.createElement('div');
    ins.className = 'strat-insight';
    // Use safe DOM for the text with <strong> tags
    var parts = insights[n].text.split(/<\/?strong>/);
    for (var p = 0; p < parts.length; p++) {
      if (p % 2 === 0) {
        ins.appendChild(document.createTextNode(parts[p]));
      } else {
        var strong = document.createElement('strong');
        strong.textContent = parts[p];
        ins.appendChild(strong);
      }
    }
    card.appendChild(ins);
  }

  // Section 4: Next quarter agenda
  var sec4 = document.createElement('div');
  sec4.className = 'strat-section';
  var h4el = document.createElement('h4');
  h4el.textContent = '\uB2E4\uC74C \uBD84\uAE30 \uC548\uAC74';
  sec4.appendChild(h4el);

  var agenda = [];
  var lowest = Math.min(G.custSat, G.empHap, G.socVal);
  if (lowest === G.custSat) agenda.push('\uD83D\uDCC8 \uACE0\uAC1D \uB9CC\uC871\uB3C4 \uAC1C\uC120 \uC9D1\uC911');
  else if (lowest === G.empHap) agenda.push('\uD83D\uDC9A \uAD6C\uC131\uC6D0 \uD589\uBCF5 \uD68C\uBCF5 \uC6B0\uC120');
  else agenda.push('\uD83C\uDF0D \uC0AC\uD68C\uC801 \uAC00\uCE58 \uAC15\uD654');

  if (tc.disengaged > tc.ace) agenda.push('\uD83D\uDD25 \uBB34\uAE30\uB825 \uAD6C\uC131\uC6D0 \uD65C\uC131\uD654 \uD504\uB85C\uADF8\uB7A8');
  if (polCount < 5) agenda.push('\uD83D\uDCDC SKMS \uC815\uCC45 \uCD94\uAC00 \uB3C4\uC785 \uAC80\uD1A0');
  if (G.money < 5000) agenda.push('\uD83D\uDCB0 \uC7AC\uBB34 \uAC74\uC804\uC131 \uD655\uBCF4');

  var agendaDiv = document.createElement('div');
  agendaDiv.className = 'strat-agenda';
  for (var a = 0; a < agenda.length; a++) {
    var ag = document.createElement('div');
    ag.className = 'strat-agenda-item';
    ag.textContent = agenda[a];
    agendaDiv.appendChild(ag);
  }
  sec4.appendChild(agendaDiv);
  card.appendChild(sec4);

  // Close button
  var closeBtn = document.createElement('button');
  closeBtn.className = 'strat-close';
  closeBtn.textContent = '\uD68C\uC758 \uC885\uB8CC \u2014 \uACBD\uC601 \uC7AC\uAC1C';
  closeBtn.addEventListener('click', function() {
    // Apply performance grade effects
    var gradeCounts = {S:0, A:0, B:0, C:0, D:0};
    var aliveNow = G.workers.filter(function(w) { return !w.quitting; });
    for (var gi = 0; gi < aliveNow.length; gi++) {
      var w = aliveNow[gi];
      var grade = perfGradeSelections[w.id];
      if (!grade) continue;
      gradeCounts[grade]++;
      w.perfGrade = grade;
      if (!w.perfHistory) w.perfHistory = [];
      w.perfHistory.push(grade);
      if (grade === 'S') {
        w.will = Math.min(100, w.will + 10);
        w.happiness = Math.min(100, w.happiness + 15);
        G.money -= 50;
      } else if (grade === 'A') {
        w.will = Math.min(100, w.will + 5);
        w.happiness = Math.min(100, w.happiness + 8);
        G.money -= 30;
      } else if (grade === 'C') {
        w.will = Math.max(0, w.will - 5);
        w.happiness = Math.max(0, w.happiness - 5);
      } else if (grade === 'D') {
        w.will = Math.max(0, w.will - 10);
        w.happiness = Math.max(0, w.happiness - 15);
        if (!w.pipActive) {
          w.pipActive = true;
          w.pipDays = 30;
        }
      }
    }
    showToast('\uC131\uACFC \uD3C9\uAC00 \uC644\uB8CC: S ' + gradeCounts.S + '\uBA85, A ' + gradeCounts.A + '\uBA85, B ' + gradeCounts.B + '\uBA85, C ' + gradeCounts.C + '\uBA85, D ' + gradeCounts.D + '\uBA85', 'success');

    overlay.classList.remove('show');
    G.gSpeed = 1;
    // Save current values for next quarter comparison
    G.prevCust = Math.round(G.custSat);
    G.prevEmp = Math.round(G.empHap);
    G.prevSoc = Math.round(G.socVal);
    G.prevMoney = G.money;
    G.prevWorkerCount = alive.length;
    sfxClick();
    document.getElementById('btn-speed').textContent = '1x';
  });
  card.appendChild(closeBtn);

  overlay.appendChild(card);
  overlay.classList.add('show');
}

function copyReportText(style, alignment) {
  var text = getReportText(style, alignment);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() {
      showToast('\uD074\uB9BD\uBCF4\uB4DC\uC5D0 \uBCF5\uC0AC\uB418\uC5C8\uC2B5\uB2C8\uB2E4!', 'success');
    });
  } else {
    // Fallback for older browsers
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('\uD074\uB9BD\uBCF4\uB4DC\uC5D0 \uBCF5\uC0AC\uB418\uC5C8\uC2B5\uB2C8\uB2E4!', 'success');

function getManagementStyle() {
  var polCount = Object.keys(G.activePolicies).length;
  if (polCount >= 7 && G.empHap >= 70 && G.socVal >= 50) return '\uC774\uD574\uAD00\uACC4\uC790 \uC911\uC2EC \uACBD\uC601\uC790';
  if (G.custSat >= 70 && G.empHap < 50) return '\uC131\uACFC \uC911\uC2EC \uC2E4\uC6A9\uC8FC\uC758\uC790';
  if (G.socVal >= 60) return '\uC0AC\uD68C\uC801 \uAC00\uCE58 \uACBD\uC601\uC790';
  if (G.empHap >= 60) return '\uAD6C\uC131\uC6D0 \uD589\uBCF5 \uC6B0\uC120 \uACBD\uC601\uC790';
  if (polCount >= 4) return '\uADE0\uD615 \uC7A1\uD78C \uACBD\uC601\uC790';
  return '\uC0DD\uC874 \uC911\uC2EC \uACBD\uC601\uC790';
}

function calcSKMSAlignment() {
  var score = 0;
  // +10 per active policy
  score += Object.keys(G.activePolicies).length * 10;
  // +5 if emp > 70
  if (G.empHap > 70) score += 5;
  // +5 if no neglect quits (approximate: if totalQuits <= 2)
  if (G.totalQuits <= 2) score += 5;
  // -10 per ignore
  score -= G.ignoreCount * 10;
  // -5 per pressure
  score -= G.pressureCount * 5;
  return clamp(0, 100, score);
}

  '\uD558\uB2E8 [\uD83C\uDFE2 \uC870\uC9C1] \uD0ED\uC5D0\uC11C HR \uBD80\uC11C\uB97C \uC124\uB9BD\uD558\uC138\uC694. \uBCF5\uB3C4 \uC5F0\uACB0 \uD544\uC218!',

  '[\uD83C\uDFE2 \uC870\uC9C1] \uD0ED\uC758 \uD83D\uDC64\uCC44\uC6A9 \uBC84\uD2BC\uC73C\uB85C \uCCAB \uC778\uC7AC\uB97C \uCC44\uC6A9\uD558\uC138\uC694!',
  '\uC624\uB978\uCABD \uC815\uCC45 \uD328\uB110\uC744 \uC5F4\uACE0 \uCCAB SKMS \uC815\uCC45\uC744 \uD65C\uC131\uD654\uD558\uC138\uC694.'
];

function showTutorial() {
  if (G.tutDone || G.tutStep >= TUTORIAL_STEPS.length) return;
  var el = document.getElementById('tutorial');
  while (el.firstChild) el.removeChild(el.firstChild);

  var step = document.createElement('div');
  step.className = 'step';
  step.textContent = 'Step ' + (G.tutStep + 1) + '/' + TUTORIAL_STEPS.length;
  el.appendChild(step);

  var msg = document.createElement('div');
  msg.className = 'msg';
  msg.textContent = TUTORIAL_STEPS[G.tutStep];
  el.appendChild(msg);

  var dismiss = document.createElement('div');
  dismiss.className = 'dismiss';
  dismiss.textContent = '\uC54C\uACA0\uC2B5\uB2C8\uB2E4 \u2192';
  dismiss.addEventListener('click', function() {
    G.tutStep++;
    if (G.tutStep >= TUTORIAL_STEPS.length) {
      G.tutDone = true;
      el.classList.remove('show');
    } else {
      showTutorial();
    }
  });
  el.appendChild(dismiss);

  el.classList.add('show');
}

canvas.addEventListener('mousemove', function(e) {
  G.mouseX = e.clientX;
  G.mouseY = e.clientY;
  var grd = toGrd(e.clientX, e.clientY);
  G.mouseGX = grd.x;
  G.mouseGY = grd.y;

  if (G.drag) {
    var dx = e.clientX - G.dragStart.x;
    var dy = e.clientY - G.dragStart.y;
    G.camX = G.camStart.x + dx;
    G.camY = G.camStart.y + dy;
  }
});

canvas.addEventListener('mouseup', function(e) {
  if (!G.drag) return;
  var dx = Math.abs(e.clientX - G.dragStart.x);
  var dy = Math.abs(e.clientY - G.dragStart.y);
  G.drag = false;

  // Only act if not dragging (click)
  if (dx < 5 && dy < 5) {
    handleClick(e.clientX, e.clientY);
  }
});

canvas.addEventListener('wheel', function(e) {
  e.preventDefault();
  var oldZm = G.zm;
  G.zm = clamp(0.3, 3, G.zm - e.deltaY * 0.001);
  // Zoom toward mouse
  var ratio = G.zm / oldZm;
  G.camX = e.clientX - (e.clientX - G.camX) * ratio;
  G.camY = e.clientY - (e.clientY - G.camY) * ratio;
}, {passive: false});

function handleClick(cx, cy) {
  var grd = toGrd(cx, cy);
  var gx = grd.x, gy = grd.y;
  if (!inBounds(gx, gy)) return;

  if (G.selTool === 'bulldoze') {
    bulldoze(gx, gy);
    return;
  }

  if (G.selTool && DEFS[G.selTool]) {
    placeBuild(gx, gy, G.selTool);
    return;
  }

  // Click on worker?
  var closest = null, closestDist = 999;
  for (var i = 0; i < G.workers.length; i++) {
    var w = G.workers[i];
    if (w.quitting) continue;
    var dx = w.x - gx, dy = w.y - gy;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 1.5 && dist < closestDist) {
      closest = w;
      closestDist = dist;
    }
  }
  if (closest) {
    openMeeting(closest);
  }
}

function placeBuild(gx, gy, type) {
  if (G.grid[gy][gx]) {
    sfxErr();
    var existing = DEFS[G.grid[gy][gx].type];
    showToast('\uC774\uBBF8 ' + (existing ? existing.lbl : '\uAC74\uBB3C') + '\uC774(\uAC00) \uC788\uC2B5\uB2C8\uB2E4. \uBE48 \uD0C0\uC77C\uC5D0 \uBC30\uCE58\uD558\uC138\uC694!', 'warn');
    return;
  }
  var def = DEFS[type];
  if (G.money < def.cost) {
    sfxErr();
    showToast('\uB3C8\uC774 \uBD80\uC871\uD569\uB2C8\uB2E4!', 'warn');
    return;
  }
  // Save undo
  G.undoStack.push({action:'build', x:gx, y:gy, type:type});
  G.redoStack = [];

  G.money -= def.cost;
  G.grid[gy][gx] = {type: type};
  G.bldgs.push({type: type, gx: gx, gy: gy});

    // Connection warning for departments and facilities
    if (def.cat === 'dept' || def.cat === 'facility') {
      var dirs = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
      var connected = false;
      for (var d = 0; d < dirs.length; d++) {
        var nx = gx + dirs[d].x, ny = gy + dirs[d].y;
        if (nx >= 0 && ny >= 0 && nx < GRID && ny < GRID) {
          var adj = G.grid[ny][nx];
          if (adj && (adj.type === 'corridor' || adj.type === 'hq')) { connected = true; break; }
        }
      }
      if (!connected) showToast('\u26A0 \uBCF5\uB3C4\uC640 \uC5F0\uACB0\uB418\uC9C0 \uC54A\uC558\uC2B5\uB2C8\uB2E4!', 'warn');
    }

  sfxPlace();

  // Check welfare buildings for speech trigger
  if (type === 'cafeteria' || type === 'wellness') {
    G.welfareJustBuilt = true;
    G.welfareTimer = 300;
  }

  updateHUD();
  renderPolicyPanel();
}

function bulldoze(gx, gy) {
  var cell = G.grid[gy][gx];
  if (!cell || cell.type === 'hq') {
    sfxErr();
    return;
  }
  var def = DEFS[cell.type];
  var refund = def ? Math.floor(def.cost * 0.5) : 0;

  G.undoStack.push({action:'bulldoze', x:gx, y:gy, type:cell.type});
  G.redoStack = [];

  G.grid[gy][gx] = null;
  for (var i = G.bldgs.length - 1; i >= 0; i--) {
    if (G.bldgs[i].gx === gx && G.bldgs[i].gy === gy) {
      G.bldgs.splice(i, 1);
      break;
    }
  }
  G.money += refund;
  sfxDel();
  showToast('\uCCA0\uAC70 (+$' + refund + ')', 'info');
  updateHUD();
  renderPolicyPanel();
}

// Undo/Redo
document.addEventListener('keydown', function(e) {
  if (e.code === 'Space' && !e.metaKey && !e.ctrlKey) {
    e.preventDefault();
    if (G.gSpeed === 0) { G.gSpeed = 1; showToast('Resumed', 'info'); }
    else { G.gSpeed = 0; showToast('Paused', 'info'); }
    var sBtn = document.getElementById('btn-speed');
    if (sBtn) sBtn.textContent = G.gSpeed === 0 ? '||' : G.gSpeed + 'x';
  }
  if (e.ctrlKey && e.key === 'z' && !e.shiftKey) {
    e.preventDefault();
    undoAction();
  }
  if (e.ctrlKey && e.shiftKey && (e.key === 'z' || e.key === 'Z')) {
    e.preventDefault();
    redoAction();
  }
  if (e.key === 'Escape') {
    document.getElementById('hire-panel').classList.remove('open');
  }
});

function undoAction() {
  if (G.undoStack.length === 0) return;
  var action = G.undoStack.pop();
  G.redoStack.push(action);
  if (action.action === 'build') {
    // Remove building
    G.grid[action.y][action.x] = null;
    for (var i = G.bldgs.length - 1; i >= 0; i--) {
      if (G.bldgs[i].gx === action.x && G.bldgs[i].gy === action.y) {
        G.bldgs.splice(i, 1); break;
      }
    }
    G.money += DEFS[action.type].cost;
  } else if (action.action === 'bulldoze') {
    // Restore building
    G.grid[action.y][action.x] = {type: action.type};
    G.bldgs.push({type: action.type, gx: action.x, gy: action.y});
    G.money -= Math.floor(DEFS[action.type].cost * 0.5);
  }
  updateHUD();
  showToast('Undo', 'info');
}

function redoAction() {
  if (G.redoStack.length === 0) return;
  var action = G.redoStack.pop();
  G.undoStack.push(action);
  if (action.action === 'build') {
    G.grid[action.y][action.x] = {type: action.type};
    G.bldgs.push({type: action.type, gx: action.x, gy: action.y});
    G.money -= DEFS[action.type].cost;
  } else if (action.action === 'bulldoze') {
    G.grid[action.y][action.x] = null;
    for (var i = G.bldgs.length - 1; i >= 0; i--) {
      if (G.bldgs[i].gx === action.x && G.bldgs[i].gy === action.y) {
        G.bldgs.splice(i, 1); break;
      }
    }
    G.money += Math.floor(DEFS[action.type].cost * 0.5);
  }
  updateHUD();
  showToast('Redo', 'info');
}

// ============================================================
// GAME LOOP
// ============================================================
var lastTime = 0;
function gameLoop(ts) {
  var dt = ts - lastTime;
  lastTime = ts;

  if (!G.gameOver) {
    G.tickAccum += dt;
    while (G.tickAccum >= 1000 / 60) {
      G.tickAccum -= 1000 / 60;
      gameTick();
    }
    // Update HUD periodically
    if (Math.floor(ts / 500) !== Math.floor((ts - dt) / 500)) {
      updateHUD();
      // Update policy progress bars
      if (G.policyOpen && Object.keys(G.activatingPolicies).length > 0) {
        renderPolicyPanel();
      }
    }
  }

  render();
  requestAnimationFrame(gameLoop);
}
