services:
  - type: web
    name: skmsai-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Keep this in sync with the deployed frontend origin(s).
      - key: ALLOWED_ORIGINS
        value: https://skmsai.netlify.app
