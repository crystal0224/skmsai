name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: python -m pytest tests/ -v --tb=short --cov=scripts/lib --cov=server --cov-report=term-missing --cov-fail-under=80

      - name: Verify test count
        run: |
          COUNT=$(python -m pytest tests/ --collect-only -q 2>&1 | grep -E "^[0-9]+ tests? collected" | grep -oE "^[0-9]+")
          echo "Collected $COUNT tests"
          if [ "$COUNT" -lt 1216 ]; then
            echo "ERROR: Expected at least 1216 tests, got $COUNT"
            exit 1
          fi

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t skmsai:ci .
