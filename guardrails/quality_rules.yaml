# =============================================================================
# SKMS Time-Aware NotebookLM — 품질 관리 규칙
# =============================================================================
# OCR 변환 품질, 응답 신뢰도, 환각 방지 등
# 콘텐츠 품질 전반을 관리하기 위한 가드레일 규칙.
# =============================================================================

quality_rules:

  # ---------------------------------------------------------------------------
  # 품질 플래그별 처리 정책 (Flag Policies)
  # ---------------------------------------------------------------------------
  # 각 청크에 부착된 품질 플래그에 따라 응답 생성 시 처리 방식을 결정한다.
  flag_policies:
    ocr_error:
      description: "OCR 변환 실패 구간"
      action: "include_with_warning"
      warning_message: "이 구간은 OCR 변환 품질이 낮아 원문 확인이 필요합니다."
      exclude_from_generation: false
      lower_confidence: true
      confidence_penalty: 0.2

    page_header_leak:
      description: "페이지 번호/머리글 잔존"
      action: "strip_silently"
      exclude_from_generation: true
      strip_pattern: "^\\s*-?\\s*\\d{1,3}\\s*-?\\s*$"

    table_broken:
      description: "표 구조 파괴"
      action: "include_with_warning"
      warning_message: >
        원문에 표가 포함되어 있으나 텍스트 변환 과정에서
        구조가 손실되었습니다.
      exclude_from_generation: false
      suggest_original: true

    reference_unresolved:
      description: "외부 참조 미해결 (별도 첨부 자료, 도표 등)"
      action: "include_with_note"
      note_message: >
        원문에서 별도 자료를 참조하고 있으나,
        해당 자료는 현재 시스템에 포함되어 있지 않습니다.
      exclude_from_generation: false

    draft_content:
      description: "임시 내용 (세미나 논의 요약 등, 추후 보완 예정)"
      action: "include_with_warning"
      warning_message: >
        이 내용은 원문에서 '추후 보완' 예정으로 표기된 임시 내용입니다.
        최종 확정본이 아닐 수 있습니다.
      detection_pattern: "추후 보완|임원 세미나에서 논의된"
      exclude_from_generation: false
      lower_confidence: true
      confidence_penalty: 0.15

    section_boundary_ambiguous:
      description: "섹션 경계가 불명확한 구간"
      action: "include_with_note"
      note_message: >
        이 구간의 섹션 경계가 원문에서 명확하지 않아,
        인접 섹션의 내용이 혼입되었을 수 있습니다.
      exclude_from_generation: false

    header_gap_suspect:
      description: "200줄 이상 연속 구간에 헤더 없음 — OCR 헤더 누락 또는 구조 파손 의심"
      action: "include_with_warning"
      warning_message: >
        이 구간은 원문에서 200줄 이상 헤더가 발견되지 않았습니다.
        OCR 변환 과정에서 헤더가 누락되었거나, 원본 자체에 구조적
        구분이 없는 장문일 수 있습니다.
      exclude_from_generation: false
      lower_confidence: true
      confidence_penalty: 0.1

    amendment_history_block:
      description: "보완 이력 테이블 블록 — 메타데이터 구간"
      action: "include_with_note"
      note_message: >
        이 구간은 SKMS 보완 이력 테이블로, 본문 내용이 아닌
        메타데이터입니다. 개정판 경계로 오인하지 마세요.
      exclude_from_generation: false

  # ---------------------------------------------------------------------------
  # 응답 품질 검증 규칙 (Response Validation)
  # ---------------------------------------------------------------------------
  response_validation:
    - rule_id: QR-001
      name: "인용 필수"
      description: "모든 응답에 최소 1개 이상의 원문 인용이 포함되어야 함"
      min_citations: 1
      action: "reject_and_retry"
      max_retries: 2
      retry_instruction: >
        응답에 원문 인용이 포함되지 않았습니다.
        반드시 제공된 컨텍스트에서 관련 문장을 인용하세요.

    - rule_id: QR-002
      name: "개정판 명시"
      description: "인용 시 해당 개정판(edition_id)을 반드시 명시"
      action: "reject_and_retry"
      max_retries: 2
      citation_format: "[출처: {edition}, {section}]"
      retry_instruction: >
        인용에 개정판 정보가 누락되었습니다.
        모든 인용에 [출처: N차 개정판, 섹션명] 형식을 사용하세요.

    - rule_id: QR-003
      name: "환각 방지"
      description: "응답 내용이 검색된 컨텍스트에 근거해야 함"
      evidence_coverage_min: 0.85
      action: "warn_if_below"
      warning_message: >
        응답의 일부 내용이 제공된 컨텍스트에서 충분히 뒷받침되지 않습니다.
        해당 부분은 추가 확인이 필요할 수 있습니다.
      check_method: "sentence_level_grounding"

    - rule_id: QR-004
      name: "교차 개정판 혼동 방지"
      description: "서로 다른 개정판의 내용을 하나의 응답에서 구분 없이 섞지 않음"
      action: "check_temporal_consistency"
      violation_action: "reject_and_retry"
      retry_instruction: >
        서로 다른 개정판의 내용이 구분 없이 혼합되어 있습니다.
        각 개정판의 내용을 명확히 구분하여 서술하세요.

    - rule_id: QR-005
      name: "응답 완결성"
      description: "질의의 핵심 요소에 모두 답변했는지 확인"
      action: "warn_if_incomplete"
      check_method: "query_facet_coverage"
      min_facet_coverage: 0.8

  # ---------------------------------------------------------------------------
  # 전체 품질 임계값 (Thresholds)
  # ---------------------------------------------------------------------------
  thresholds:
    # 충실도: 응답이 원문에 얼마나 충실한가 (5점 만점)
    min_faithfulness: 4.0

    # 관련성: 응답이 질의에 얼마나 관련 있는가 (5점 만점)
    min_relevance: 3.5

    # 근거 커버리지: 응답 문장 중 컨텍스트에 근거가 있는 비율
    min_evidence_coverage: 0.85

    # 환각률: 컨텍스트에 근거가 없는 주장의 비율 (낮을수록 좋음)
    max_hallucination_rate: 0.05

    # 인용 정확도: 인용이 실제 원문과 일치하는 비율
    min_citation_accuracy: 0.95

  # ---------------------------------------------------------------------------
  # 평가 메트릭 수집 (Evaluation Metrics)
  # ---------------------------------------------------------------------------
  evaluation:
    enabled: true
    metrics:
      - name: "faithfulness"
        method: "llm_as_judge"
        scale: 5
      - name: "relevance"
        method: "llm_as_judge"
        scale: 5
      - name: "evidence_coverage"
        method: "sentence_grounding_ratio"
        scale: 1.0
      - name: "hallucination_rate"
        method: "ungrounded_claim_ratio"
        scale: 1.0
      - name: "citation_accuracy"
        method: "citation_verification"
        scale: 1.0
      - name: "temporal_consistency"
        method: "edition_mixing_check"
        scale: "boolean"
    log_to: "eval/quality_log.jsonl"
    sample_rate: 1.0
