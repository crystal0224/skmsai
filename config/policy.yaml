# =============================================================================
# policy.yaml
# SKMS RAG Pipeline - 검색 정책 레이어
# 의도(intent)에 따라 최신판 우선/연대순 정렬/개정판 폴백 정책을 정의한다.
# =============================================================================

policy:
  # ---------------------------------------------------------------------------
  # 최신판 우선 정책 (latest_first)
  # ---------------------------------------------------------------------------
  latest_first:
    # latest_first를 강제 적용하는 의도 목록
    forced_intents:
      - general_definition
      - open_ended
      - content_generation

    # latest_first 적용 시 1차 검색 개정판
    primary_edition: "2020-14차"

    # 1차 검색 결과가 빈약할 때 (min_hits 미만) 폴백 순서
    min_hits: 2
    fallback_editions:
      - "2016-13차"
      - "2008-12차"
      # 그 외: edition_filter=null (전체)

  # ---------------------------------------------------------------------------
  # 변천/비교 정책 (evolution)
  # ---------------------------------------------------------------------------
  evolution:
    # 전 판본 검색, year 오름차순 정렬
    forced_intents:
      - evolution_comparison

    sort_order: "chronological"  # oldest → newest

  # ---------------------------------------------------------------------------
  # 특정 시점 정책 (specific_time)
  # ---------------------------------------------------------------------------
  specific_time:
    # edition_hint에 해당하는 개정판만 필터링
    # 매칭 실패 시 전체 결과로 fallback
    forced_intents:
      - specific_time
