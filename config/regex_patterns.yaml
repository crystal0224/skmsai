# =============================================================================
# regex_patterns.yaml
# SKMS Time-Aware NotebookLM - 텍스트 처리용 정규식 패턴 모음
# 대상 파일: data/raw/SKMSraw.txt (15,330 lines, 1979-2020, 12개 개정판)
#
# 2026-02-26 실측 기반 전면 개정
# 분석 근거: docs/edition_regex_analysis.md
# =============================================================================

# -----------------------------------------------------------------------------
# 개정판 경계 감지 (2가지 유형)
# SKMSraw.txt에서 개정판 시작점을 식별하는 패턴
#
# [삭제] type_c ('YY.MM.DD 형식): 전수 조사 결과 24건 모두 보완 이력
#        테이블 내부 항목이며, 개정판 경계가 아님. 오탐만 유발하므로 제거.
# -----------------------------------------------------------------------------
edition_patterns:
  type_a:
    # A형: "YYYY년 초판" 또는 "YYYY년 N차"
    # 실측 매칭 7건: L11, L727, L11778, L12937, L13959, L14947, L15073
    # 오탐 0건: "1989년 12월"(월), "2008년 주요"(한글) 등은 매칭 안 됨
    pattern: '^\s*\d{4}년\s+(초판|\d{1,2}차)'
    description: "A형: YYYY년 + 초판/N차"
    examples:
      - "1979년 초판"
      - "2004년 11차 | 전면 보완"
      - "2020년 14차"

  type_b:
    # B형: "N차 YYYY년" (역순)
    # 실측 매칭 1건: L7860 "7차 1990년 | 전면보완"
    pattern: '^\s*\d{1,2}차\s+\d{4}년'
    description: "B형: N차 + YYYY년 (역순)"
    examples:
      - "7차 1990년 | 전면보완"

# 검증된 개정판 목록 (실측, 12개)
# L11:    1979년 초판       (type_a)
# L727:   1981년 1차        (type_a)
# L5251:  5차 1988년        (type_b)
# L6749:  6차 1989년        (type_b)
# L7860:  7차 1990년 | 전면보완  (type_b)
# L8954:  8차 1995년        (type_b)
# L10132: 9차 1997년        (type_b)
# L11778: 1998년 10차       (type_a)
# L12937: 2004년 11차 | 전면 보완  (type_a)
# L13959: 2008년 12차       (type_a)
# L14947: 2016년 13차 | 전면보완  (type_a)
# L15073: 2020년 14차       (type_a)
#
# 미존재: 2차~4차 (보완 이력 테이블 내에서만 참조됨)

# -----------------------------------------------------------------------------
# 5단계 헤더 계층 구조 (실측 기반)
#
# [변경 사항]
# - H1: 로마숫자 삭제 (실측 0건) → 장(Chapter) 수준 한글 제목으로 교체
# - H4b: 신규 추가 - "N) 한글" 형식 (실측 ~20건)
# - H5: 원숫자 삭제 (실측 0건)
# -----------------------------------------------------------------------------
header_patterns:
  H0:
    # 개정판 경계 (edition_patterns 참조)
    description: "개정판 경계 (edition_patterns로 감지)"

  H1:
    # 장(Chapter) 수준: 번호 없는 한글 제목 또는 SUPEX 등 영문 키워드
    # 실측: "서문", "경영 기본 이념", "경영 관리 요소", "경영 실행 원리",
    #        "기업관", "추구 가치", "SUPEX 추구법", "동적 요소", "정적 요소" 등
    # 선행 공백 0~3자 허용 (일부 판본에서 들여쓰기 사용)
    pattern: '^\s{0,3}(서문|序文|경영\s*(기본\s*이념|원칙|관리\s*요소|실행\s*원리|기본이념|관리요소|실행원리|목표)|기업관|추구\s*가치|SUPEX|정적\s*요소|동적\s*요소|패기)'
    description: "장 수준 한글 제목 (서문, 경영 기본 이념, SUPEX 등)"
    examples:
      - "서문"
      - " 경영 기본 이념"
      - "경영관리요소"
      - " SUPEX 추구법"
      - "동적 요소"
    notes: >
      로마숫자(I. II. III.) 패턴은 전수 조사 결과 0건.
      실제 파일은 번호 없는 한글 제목을 장 구분에 사용.

  H2:
    # 절(Section) 수준: 아라비아 번호 + 마침표 + 한글
    # 실측: "1. 인간중심의 경영", "2. 합리적 경영" 등 다수
    pattern: '^\d{1,2}\.\s+[가-힣]'
    description: "아라비아 번호 (1. 인간중심의 경영)"
    examples:
      - "1. 인간중심의 경영"
      - "2. 합리적 경영"
      - "3. 현실을 인식한 경영"

  H3:
    # 항(Clause) 수준: 한글 가나다 번호
    # 실측: "가. 인적 요소의 중요성", "나. 사람 관리의 어려움" 등 다수
    pattern: '^(가|나|다|라|마|바|사|아)\.\s+'
    description: "한글 가나다 (가. 인적 요소의 중요성)"
    examples:
      - "가. 기업에 있어서의 인적 요소의 중요성"
      - "나. 사람 관리의 어려움과 원인"
      - "다. 사람 관리에 임하는 기본적 자세"

  H4:
    # 목(Item) 수준: 괄호 번호
    # 실측: 364건
    pattern: '^\(\d{1,2}\)\s+'
    description: "괄호 번호 ((1) 사람이 물적 요소의 운용 주체)"
    examples:
      - "(1) 사람이 물적 요소의 운용 주체라는 점에서의 중요성"
      - "(2) 사람이 여러 제도나 기술의 운영 주체"

  H4b:
    # 목(Item) 수준 변형: 닫는 괄호만 있는 번호
    # 실측: "1) 기획관리", "2) 인사관리" 등 ~20건
    pattern: '^\d{1,2}\)\s+[가-힣]'
    description: "반괄호 번호 (1) 기획관리)"
    examples:
      - "1) 기획관리"
      - "2) 인사관리"
      - "5) 선경인의 자세(SK-MANSHIP) 관리"

# -----------------------------------------------------------------------------
# 정의 블록 감지
# SKMS 본문에서 개념 정의문을 식별하는 패턴
# -----------------------------------------------------------------------------
definition_patterns:
  - # 인용 정의형: 따옴표로 시작하여 서술어로 이어지는 정의문
    # 예시: "경영"이란 ... 을 뜻한다
    pattern: '^"[가-힣].*"[은는이가을를]?\s+(이|란|라\s*함은|뜻한다|의미한다|말한다)'
    description: "인용 정의형"

  - # 주어+서술 정의형: 주어가 바로 정의 서술어로 연결
    # 예시: 인사관리란 ..., SUPEX라 함은 ...
    pattern: '^[가-힣A-Z]+[은는이가](란|라\s*함은|라는\s*것은|을\s*말한다|의\s*정의)'
    description: "주어+서술 정의형"

  - # ~이란/~이라 정의형
    # 예시: "... 것을 말한다", "... 것이다"
    pattern: '(이란|이라\s*함은|을\s*말한다|을\s*의미한다|을\s*뜻한다)\s*[.。]?\s*$'
    description: "문미 정의형"

# -----------------------------------------------------------------------------
# 품질 플래그 마커
# OCR 변환 과정에서 발생한 품질 이슈를 탐지하는 패턴/지표
# -----------------------------------------------------------------------------
quality_flags:
  ocr_error:
    # OCR 변환 실패로 원문을 판독할 수 없는 경우
    indicators:
      - '□'
      - '■'
      - '?????'
      - '!!!!'
    description: "OCR 변환 실패로 원문 불명"

  page_header_leak:
    # 페이지 번호가 본문에 잔존한 경우
    pattern: '^\d+\s*$'
    description: "페이지 번호 잔존"

  table_broken:
    # 표 구조가 파괴되어 텍스트로 변환된 경우
    indicators:
      - '│'
      - '┌'
      - '┐'
      - '└'
      - '┘'
      - '├'
      - '┤'
    description: "표 구조가 파괴된 텍스트"

  reference_unresolved:
    # 외부 참조(별첨, 부록 등)가 해결되지 않은 경우
    pattern: '\(.*참조\)|\(.*별첨\)|\(.*부록\)'
    description: "외부 참조 미해결"

  header_gap_suspect:
    # 헤더 없이 너무 긴 구간: OCR에서 헤더가 누락되었거나 구조가 깨진 의심 구간
    # 실측: H2~H4 헤더 간 최대 갭 431줄, 200줄 초과 구간 4곳
    # 감지 방법: 연속된 200줄 이상에서 H1~H4 헤더가 하나도 발견되지 않으면 플래그
    threshold_lines: 200
    description: "헤더 없이 200줄 이상 연속 — 구조 파손 또는 OCR 헤더 누락 의심"

  amendment_history_block:
    # 보완 이력 테이블 구간: 'YY.MM.DD 형식이 밀집된 블록
    # 이 구간은 개정판 경계가 아니라 메타데이터이므로 별도 처리 필요
    pattern: "^'\\d{2}\\."
    min_consecutive: 3
    description: "보완 이력 테이블 블록 ('YY.MM.DD 형식 밀집)"
