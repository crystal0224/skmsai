# =============================================================================
# retrieval.yaml
# SKMS Time-Aware NotebookLM - 검색 및 검색 설정
# 벡터 검색, 키워드 검색, 하이브리드 검색 전략 구성
# =============================================================================

retrieval:
  mode: "hybrid"  # vector | keyword | hybrid

  # ---------------------------------------------------------------------------
  # 벡터 검색 설정
  # ---------------------------------------------------------------------------
  vector:
    provider: "chroma"  # chroma | pinecone
    collection_name: "skms_quotes"
    top_k: 10
    score_threshold: 0.5

  # ---------------------------------------------------------------------------
  # 키워드 검색 설정
  # ---------------------------------------------------------------------------
  keyword:
    engine: "bm25"
    index_path: "indexes/bm25_index.pkl"
    top_k: 10
    # 타입별 BM25 가중치 부스트 (토큰 반복 횟수, 1.0 = 부스트 없음)
    type_boost:
      definition: 2.0   # 정의문 우선
      principle: 1.5     # 원칙 선언 약간 우선
      procedure: 1.0
      checklist: 1.0
      example: 1.0
      narrative: 1.0

  # ---------------------------------------------------------------------------
  # 하이브리드 검색 설정
  # 벡터 검색과 키워드 검색을 결합하여 최종 결과 생성
  # ---------------------------------------------------------------------------
  hybrid:
    alpha: 0.6  # 벡터 vs 키워드 가중치 (0=키워드 전용, 1=벡터 전용)
    rrf_k: 60   # Reciprocal Rank Fusion 상수
    final_top_k: 5

  # ---------------------------------------------------------------------------
  # 리랭커 설정 (V1에서 활성화 예정)
  # ---------------------------------------------------------------------------
  reranker:
    enabled: false
    model: "cohere-rerank-v3"
    top_n: 5

  # ---------------------------------------------------------------------------
  # 검색 필터
  # ---------------------------------------------------------------------------
  filters:
    edition_filter: null  # null = 전체 개정판 대상
    quality_flag_exclude:
      - "ocr_error"  # OCR 오류가 있는 청크는 검색 결과에서 제외

# =============================================================================
# 질의 라우팅 설정
# 질의 유형에 따라 검색 전략을 최적화
# =============================================================================
query_routing:
  types:
    - name: "single_version"
      description: "단일 개정판 내 질의"
      example: "10차 개정판에서 인사관리는 어떻게 정의되는가?"

    - name: "cross_version"
      description: "개정판 간 비교 질의"
      example: "인간중심의 경영 개념이 초판에서 14차까지 어떻게 변했는가?"

    - name: "definition"
      description: "용어/개념 정의 질의"
      example: "SUPEX란 무엇인가?"

    - name: "open_ended"
      description: "일반 탐색 질의"
      example: "SKMS에서 가장 강조하는 가치는?"

  default_type: "open_ended"
