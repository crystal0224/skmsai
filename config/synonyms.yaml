# SKMS 동의어 매핑 — 검색 확장용
#
# PR-017: BM25/Hybrid 검색 시 동의어 확장에 사용
#
# 구조: 각 그룹(cluster)은 의미적으로 동일한 용어들의 집합.
# 검색어에 포함된 용어가 그룹에 속하면, 해당 그룹의 모든 용어로 확장.
# bidirectional: 그룹 내 모든 용어 쌍이 양방향 동의어.
#
# 주의: 공백/하이픈/마침표만 다른 변형은 정규화로 처리되므로 별도 등록 불필요.
# 예: "인사관리" ↔ "인사 관리", "OJT" ↔ "O.J.T" → 자동 매칭
# =============================================================================

